      properties:
        min_length:
          type: integer
          minimum: 15
          maximum: 128
        require_uppercase:
          type: boolean
        require_lowercase:
          type: boolean
        require_numbers:
          type: boolean
        require_special_chars:
          type: boolean
    ProjectConfigAuthPasswordReset:
      type: object
      additionalProperties: false
      properties:
        allow:
          type: boolean
        timeout:
          type: integer
          description: Password reset token expiry in seconds
        max_history:
          type: integer
          description: Number of previous passwords to disallow (0=disabled)
    ProjectConfigAuthProviders:
      type: object
      additionalProperties: false
      properties:
        email_password:
          $ref: '#/components/schemas/ProjectConfigAuthEmailPasswordProvider'
        oauth:
          type: array
          description: Fully synced when declared - providers absent from this list are deleted.
          items:
            $ref: '#/components/schemas/ProjectConfigOAuthProvider'
    ProjectConfigAuthRateLimits:
      type: object
      additionalProperties: false
      description: Rate limits per hour.
      properties:
        signup:
          type: integer
        signin:
          type: integer
        token_refresh:
          type: integer
        password_reset:
          type: integer
    ProjectConfigAuthRedirects:
      type: object
      additionalProperties: false
      properties:
        allowed:
          type: array
          items:
            type: string
          description: Redirect allowlist. Every entry must be a valid http/https URL.
        post_auth:
          type: string
          description: Must be included in `allowed` when set.
        post_logout:
          type: string
          description: Must be included in `allowed` when set.
        device_verification:
          type: string
          description: Optional custom device-authorization verification page URL.
    ProjectConfigAuthSessions:
      type: object
      additionalProperties: false
      properties:
        inactivity_timeout:
          type: integer
          description: Force re-login after inactivity (seconds, 0=never)
        max_session_duration:
          type: integer
          description: Force re-login after duration (seconds, 0=never)
    ProjectConfigAuthSignup:
      type: object
      additionalProperties: false
      properties:
        enable_signup:
          type: boolean
          description: Master switch for signups across ALL providers
        enable_anonymous_signins:
          type: boolean
        allowed_email_domains:
          type: array
          maxItems: 100
          description: |
            Email domains allowed to create users. Empty allows every domain.
            Replaces the stored list; entries are normalized (lowercase, no `@`
            prefix) and must be bare domains such as `domain1.com`. Matching is
            exact, so subdomains need their own entry. At most 100 entries.

            Restricting signups is a PRO feature to configure and to enforce: a
            FREE project can only declare the list it already has or remove the
            restriction, and the list it keeps is parked until it upgrades.
          items:
            type: string
          example:
            - domain1.com
            - domain2.com
        allowed_email_domains_mode:
          type: string
          description: |
            How far `allowed_email_domains` reaches. `signup` gates account
            creation only. `signup_and_signin` also blocks sign-in for accounts
            outside the list and signs out the ones it locks out. `disabled`
            keeps the list without enforcing it.
          enum:
            - disabled
            - signup
            - signup_and_signin
    ProjectConfigAuthTokens:
      type: object
      additionalProperties: false
      description: Token lifetimes in seconds.
      properties:
        access_token_lifetime:
          type: integer
        refresh_token_lifetime:
          type: integer
        refresh_token_reuse_interval:
          type: integer
        platform_token_ttl:
          type: integer
    ProjectConfigBucket:
      type: object
      additionalProperties: false
      description: |
        Settings for an existing storage bucket. Buckets are never created or
        deleted through the manifest. When `policies` is declared it is fully
        synced (policies absent from the list are deleted; an empty list
        deletes all); omitting `policies` leaves the bucket's policies
        untouched.
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 64
        file_size_limit:
          type: integer
          format: int64
          description: Maximum file size in bytes
        allowed_mime_types:
          type: array
          items:
            type: string
        policies:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigBucketPolicy'
      required:
        - name
    ProjectConfigBucketPolicy:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        operation:
          type: string
          enum:
            - SELECT
            - INSERT
            - UPDATE
            - DELETE
        definition:
          type: string
          description: Policy expression
      required:
        - name
        - operation
        - definition
    ProjectConfigCustomDomain:
      type: object
      additionalProperties: false
      description: |
        Custom domain with BYOC TLS (PRO plan). `tls` is required when the
        domain is first created and optional afterwards: providing new TLS
        material for the same domain rotates the certificate in place (zero
        downtime); omitting `tls` keeps the stored certificate. TLS material is
        write-only and omitted from config export.
      properties:
        domain:
          type: string
          description: Fully-qualified domain name (hostname only, no scheme/path)
        tls:
          $ref: '#/components/schemas/FrontendCustomDomainTLSConfig'
      required:
        - domain
    ProjectConfigDatabase:
      type: object
      additionalProperties: false
      description: |
        Assertion-only entry for an existing database. No database property is
        mutable through the manifest; declared values are compared against the
        deployed database and any mismatch fails validation. Databases are
        never created or deleted here.
      properties:
        name:
          type: string
          minLength: 1
        region:
          type: string
          description: Deployed region ID (e.g. aws-us-east-1). Asserted, never written.
        pg_version:
          type: string
          enum:
            - '15'
            - '16'
          description: PostgreSQL major version. Asserted, never written.
        database_type:
          type: string
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          description: |
            Compute tier. Asserted, never written - tier changes are not
            supported via the manifest; use the databases API/CLI/GUI instead.
      required:
        - name
        - region
        - pg_version
    ProjectConfigEmailTemplate:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
        html_body:
          type: string
          maxLength: 262144
          description: HTML body. Max 256 KiB. PRO plan required for custom bodies.
        text_body:
          type: string
          maxLength: 262144
          description: Plain-text body. Max 256 KiB. PRO plan required for custom bodies.
    ProjectConfigEmailTemplates:
      type: object
      additionalProperties: false
      description: |
        Email templates keyed by type. Fully synced when declared - template
        types absent from a declared map revert to server defaults (custom
        bodies deleted, subject overrides cleared). Custom template bodies
        require the PRO plan; subject-only changes are available on FREE.
      properties:
        confirmation:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
        password_reset:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
        password_changed:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
        welcome:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
    ProjectConfigFrontend:
      type: object
      additionalProperties: false
      description: |
        Configuration for an existing (deployed) frontend. Frontends are never
        created or deleted through the manifest. A declared frontend entry
        without `custom_domain` deletes an existing custom domain.
      properties:
        name:
          type: string
          minLength: 1
        custom_domain:
          $ref: '#/components/schemas/ProjectConfigCustomDomain'
      required:
        - name
    ProjectConfigFunction:
      type: object
      additionalProperties: false
      description: |
        Configuration for an existing (deployed) function. Functions are never
        created or deleted through the manifest. When `schedulers` is declared
        it is fully synced (schedulers absent from the list are deleted);
        omitting `schedulers` leaves the function's schedulers untouched.
      properties:
        name:
          type: string
          minLength: 1
        public:
          type: boolean
          description: Function visibility for anon-key invocation
        schedulers:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigScheduler'
      required:
        - name
    ProjectConfigHostedPage:
      type: object
      additionalProperties: false
      properties:
        html:
          type: string
          maxLength: 262144
          description: Raw HTML markup for the page. Max 256 KiB.
        css:
          type: string
          maxLength: 262144
          description: Optional CSS injected at render time. Max 256 KiB.
      required:
        - html
    ProjectConfigHostedPages:
      type: object
      additionalProperties: false
      description: |
        Hosted auth pages keyed by page type (PRO plan). Upsert-only: omitted
        pages are left untouched (there is no delete for hosted pages).
      properties:
        login:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
        reset_password:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
    ProjectConfigMissingResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - function
            - frontend
            - database
            - bucket
        name:
          type: string
      required:
        - type
        - name
    ProjectConfigOAuthProvider:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
            - google
            - github
            - microsoft
            - apple
            - device
        enabled:
          type: boolean
        client_id:
          type: string
          description: |
            Required for non-device providers. Server-generated for
            `provider=device` (exported read-only, ignored on apply).
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: Write-only; omitted from config export. Not used for `provider=device`.
        redirect_url:
          type: string
          description: Not used for `provider=device`.
        scopes:
          type: array
          items:
            type: string
      required:
        - provider
    ProjectConfigProject:
      type: object
      additionalProperties: false
      description: Project-level settings. `name` renames the project.
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          maxLength: 255
        all_regions:
          type: boolean
          description: Region policy. `false` requires `selected_regions` (PRO plan).
        selected_regions:
          type: array
          items:
            type: string
          description: Region subset (bare region names). Requires `all_regions=false`.
    ProjectConfigRealtime:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        broadcast_enabled:
          type: boolean
        presence_enabled:
          type: boolean
        postgres_changes_enabled:
          type: boolean
    ProjectConfigScheduler:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        cron:
          type: string
          description: 5-field UTC cron expression
        enabled:
          type: boolean
        payload:
          type: object
          additionalProperties: true
      required:
        - name
        - cron
    ProjectConfigSkippedResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - function
            - frontend
            - database
            - bucket
        name:
          type: string
        reason:
          type: string
      required:
        - type
        - name
        - reason
    ProjectConfigValidationError:
      type: object
      properties:
        section:
          type: string
          description: Manifest section the error refers to (e.g. databases, functions).
        name:
          type: string
          description: Resource name or key within the section, when applicable.
        message:
          type: string
      required:
        - section
        - message
    ProjectConfigValidationErrorResponse:
      type: object
      description: Returned when manifest validation fails. Nothing was applied.
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigValidationError'
      required:
        - error
        - errors
    ProjectConfigVariable:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
      required:
        - name
        - value
    ProjectHealthResource:
      type: object
      properties:
        type:
          type: string
          enum:
            - project
            - function
            - frontend
            - database
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - type
        - id
        - name
    ResourceReference:
      type: object
      description: Stable reference to a Volcano resource.
      properties:
        type:
          type: string
          enum:
            - project
            - function
            - frontend
            - database
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - type
        - id
        - name
    DeploymentReference:
      type: object
      description: Stable reference to a Volcano deployment run.
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    ProjectHealthScope:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ProjectHealthResource'
      required:
        - resource
    ProjectHealthResponse:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ProjectHealthStatus'
        observed_at:
          type: string
          format: date-time
        fresh_through:
          type: string
          format: date-time
        data_status:
          $ref: '#/components/schemas/ProjectHealthDataStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ProjectHealthCheck'
        findings:
          description: Top findings ordered by severity, then stable check ID.
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ProjectHealthCheck'
      required:
        - project_id
        - status
        - observed_at
        - fresh_through
        - data_status
        - checks
        - findings
    ProjectHealthStatus:
      type: string
      enum:
        - healthy
        - degraded
        - critical
        - unknown
    ProjectHealthDataStatus:
      type: string
      enum:
        - complete
        - partial
        - no_data
        - stale
    ProjectHealthCategory:
      type: string
      enum:
        - lifecycle
        - storage
    ProjectHealthEvidence:
      type: object
      properties:
        metric:
          type: string
        value:
          type: number
          format: double
        unit:
          type: string
        sample_count:
          type: integer
          format: int64
          minimum: 0
      required:
        - metric
        - value
        - unit
        - sample_count
    ProjectHealthCheck:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/ProjectHealthCategory'
        status:
          $ref: '#/components/schemas/ProjectHealthStatus'
        reason_code:
          type: string
        scope:
          $ref: '#/components/schemas/ProjectHealthScope'
        evidence:
          $ref: '#/components/schemas/ProjectHealthEvidence'
      required:
        - id
        - category
        - status
        - reason_code
        - scope
        - evidence
    ProjectMetricsDataStatus:
      type: string
      enum:
        - complete
        - partial
        - no_data
    ProjectMetricsDimensions:
      type: object
      additionalProperties: false
      properties:
        region:
          type: string
        resource_type:
          type: string
          enum:
            - function
            - frontend
    ProjectMetricsGroupBy:
      type: string
      enum:
        - region
        - resource_type
    ProjectMetricsMetric:
      type: string
      enum:
        - request_count
        - server_error_count
        - availability
        - p95_latency
    ProjectMetricsQuery:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z][A-Za-z0-9_-]*$
        metric:
          $ref: '#/components/schemas/ProjectMetricsMetric'
        group_by:
          $ref: '#/components/schemas/ProjectMetricsGroupBy'
      required:
        - id
        - metric
    ProjectMetricsQueryRequest:
      type: object
      additionalProperties: false
      properties:
        time_range:
          $ref: '#/components/schemas/ProjectMetricsQueryTimeRange'
        queries:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProjectMetricsQuery'
      required:
        - time_range
        - queries
    ProjectMetricsQueryResponse:
      type: object
      additionalProperties: false
      properties:
        observed_at:
          type: string
          format: date-time
        fresh_through:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/ProjectMetricsWindow'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMetricsResult'
      required:
        - observed_at
        - window
        - results
    ProjectMetricsQueryTimeRange:
      type: object
      additionalProperties: false
      properties:
        window:
          type: string
          enum:
            - 30m
            - 1h
            - 24h
            - 7d
      required:
        - window
    ProjectMetricsResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        metric:
          $ref: '#/components/schemas/ProjectMetricsMetric'
        unit:
          $ref: '#/components/schemas/ProjectMetricsUnit'
        data_status:
          $ref: '#/components/schemas/ProjectMetricsDataStatus'
        values:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMetricsValue'
      required:
        - id
        - metric
        - unit
        - data_status
        - values
    ProjectMetricsUnit:
      type: string
      enum:
        - count
        - ratio
        - seconds
    ProjectMetricsValue:
      type: object
      additionalProperties: false
      properties:
        dimensions:
          $ref: '#/components/schemas/ProjectMetricsDimensions'
        value:
          type: number
          format: double
          minimum: 0
      required:
        - dimensions
        - value
    ProjectMetricsWindow:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
        - from
        - to
    ProjectFrontendCustomDomain:
      allOf:
        - $ref: '#/components/schemas/FrontendCustomDomainResponse'
        - type: object
          properties:
            frontend:
              type: object
              description: |
                The frontend this custom domain is attached to. Inlined to
                avoid a second fetch from the project-scoped feed.
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
          required:
            - frontend
    ProjectDeployment:
      type: object
      description: A Function or Frontend deployment attempt in a project-scoped feed.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/ProjectDeploymentResource'
        operation:
          type: string
          enum:
            - deploy
            - redeploy
            - update
            - delete
        status:
          type: string
          enum:
            - queued
            - provisioning
            - active
            - degraded
            - failed
            - superseded
            - deleting
            - deleted
        deploy_source:
          type: string
          enum:
            - git
            - cli
            - web
            - api
            - system
            - unknown
          description: What initiated this deployment.
        artifact_version:
          type: string
        error_message:
          type: string
        completed_at:
          type: string
          format: date-time
        progress:
          $ref: '#/components/schemas/DeploymentProgress'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - resource
        - operation
        - status
        - deploy_source
        - created_at
        - updated_at
    ProjectDeploymentResource:
      type: object
      description: The resource this deployment belongs to.
      properties:
        type:
          type: string
          enum:
            - function
            - frontend
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - type
        - id
        - name
    ProjectDeploymentSummary:
      type: object
      description: Aggregate deployment statistics for one resource pipeline.
      properties:
        deployment_count:
          type: integer
          description: All deployment attempts matching the filters.
        successful_count:
          type: integer
          description: Attempts that reached active or deleted.
        failed_count:
          type: integer
          description: Attempts that reached failed or degraded.
        canceled_count:
          type: integer
          description: Superseded attempts, excluded from success rate and duration.
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: Successful attempts divided by successful plus failed attempts.
        median_build_duration_seconds:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Median CodeBuild duration across eligible completed attempts.
      required:
        - deployment_count
        - successful_count
        - failed_count
        - canceled_count
        - success_rate
        - median_build_duration_seconds
    ProjectUsageResponse:
      type: object
      description: Aggregated usage metrics for a project.
      properties:
        project_id:
          type: string
          format: uuid
          description: Project ID
        month:
          type: string
          description: Usage month in YYYY-MM format
          example: 2026-02
        metrics:
          type: array
          description: Usage metrics for the project
          items:
            $ref: '#/components/schemas/MetricUsageData'
        frontends:
          type: array
          description: Per-frontend request totals for the current usage month
          items:
            $ref: '#/components/schemas/FrontendUsageData'
      required:
        - project_id
        - month
        - metrics
    RealtimeConfig:
      type: object
      description: |
        Realtime configuration for a project.
        Note: Message size and channels per connection are plan-based (not configurable).
      properties:
        project_id:
          type: string
          format: uuid
          description: Project ID
        enabled:
          type: boolean
          description: Whether realtime is enabled for this project
          default: false
        broadcast_enabled:
          type: boolean
          description: Whether broadcast channels are enabled
          default: true
        presence_enabled:
          type: boolean
          description: Whether presence tracking is enabled
          default: true
        postgres_changes_enabled:
          type: boolean
          description: Whether Postgres change notifications are enabled
          default: true
        created_at:
          type: string
          format: date-time
          description: When the configuration was created
        updated_at:
          type: string
          format: date-time
          description: When the configuration was last updated
    RealtimePlanLimits:
      type: object
      description: Plan-based limits for realtime features
      properties:
        plan:
          type: string
          description: Plan name (FREE or PRO)
          example: FREE
        max_connections:
          type: integer
          description: Maximum concurrent connections allowed
          example: 100
        messages_per_month:
          type: integer
          description: Maximum messages per month
          example: 1000000
        message_size_kb:
          type: integer
          description: Maximum message size in KB
          example: 32
        channels_per_conn:
          type: integer
          description: Maximum channels per connection
          example: 100
    RealtimeStats:
      type: object
      description: Realtime usage statistics for a project
      properties:
        num_connections:
          type: integer
          description: Current number of active connections
        peak_connections:
          type: integer
          description: Peak concurrent connections this usage period
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent realtime activity timestamp across channels
        limits:
          $ref: '#/components/schemas/RealtimePlanLimits'
    ResolveFunctionResponse:
      type: object
      properties:
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          description: DNS-safe function name
        function_id:
          type: string
          format: uuid
          description: Canonical function ID used for invocation routing
        cache_ttl_seconds:
          type: integer
          minimum: 1
          description: Suggested SDK cache TTL for this name-to-ID mapping
      required:
        - name
        - function_id
        - cache_ttl_seconds
    ScheduleRequest:
      type: object
      required:
        - cron_expression
      properties:
        kind:
          type: string
          enum:
            - cron
          default: cron
        cron_expression:
          type: string
          description: Standard 5-field cron expression evaluated in UTC. Seconds fields, descriptors, and Quartz syntax are not supported.
          example: '*/5 * * * *'
    ServiceKey:
      type: object
      description: |
        Service role key for admin operations.
        **WARNING:** Bypasses all RLS - backend use only!
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Descriptive name for the key
        key_value:
          type: string
          description: |
            Full JWT token for Authorization header.
            Returned on create, get, and list (decrypted from storage).
            **Store securely - NEVER expose in frontend code!**
        key_prefix:
          type: string
          description: First 12 characters of the key for display/identification
          maxLength: 12
        permissions:
          type: array
          items:
            type: string
          description: |
            Operations this key may perform. ["*"] grants full admin access
            (default for keys created without an explicit scope). Scoped keys
            list specific permissions, e.g. ["functions.invoke", "locks.manage"].
          example:
            - '*'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - key_prefix
        - permissions
    StorageBucket:
      type: object
      description: |
        A named container for files within a project.
        Public access is controlled at the file level via is_public on StorageObject.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Bucket name (unique within project)
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 64
        file_size_limit:
          type: integer
          format: int64
          nullable: true
          description: Maximum file size in bytes (null for no limit)
        allowed_mime_types:
          type: array
          nullable: true
          items:
            type: string
          description: Allowed MIME types (null for all types)
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent bucket operation timestamp
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
    StorageCopyRequest:
      type: object
      properties:
        from:
          type: string
          description: Source path
        to:
          type: string
          description: Destination path
      required:
        - from
        - to
    StorageListResponse:
      type: object
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/StorageObject'
        next_cursor:
          type: string
          description: Cursor for next page (empty if no more results)
    StorageMoveRequest:
      type: object
      properties:
        from:
          type: string
          description: Source path
        to:
          type: string
          description: Destination path
      required:
        - from
        - to
    StorageObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bucket_id:
          type: string
          format: uuid
        name:
          type: string
          description: Full path within bucket (e.g., "users/abc123/avatar.png")
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: Auth user who uploaded (null for anonymous/service)
        is_public:
          type: boolean
          default: false
          description: |
            If true, the file can be downloaded with just an anon key (no user authentication).
            Files are private by default. Only the owner or a service key can change visibility.
        size:
          type: integer
          format: int64
          description: File size in bytes
        mime_type:
          type: string
          description: MIME type
        etag:
          type: string
          description: Entity tag for cache validation
        metadata:
          type: object
          additionalProperties: true
          description: |
            Custom user metadata (key-value pairs).
            Limits: Maximum 50 keys, maximum 10KB total serialized size.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        public_url:
          type: string
          format: uri
          description: |
            Shareable public URL for this file (only set for public files with is_public=true).
            This URL requires NO authentication and can be embedded in HTML, shared via email, etc.
            The URL is properly URL-encoded by the server - use it as-is without additional encoding.
      required:
        - id
        - bucket_id
        - name
        - is_public
        - size
        - mime_type
    StorageObjectWithBucket:
      type: object
      description: Storage object with bucket name included (for admin listing across buckets)
      properties:
        id:
          type: string
          format: uuid
        bucket_id:
          type: string
          format: uuid
        bucket_name:
          type: string
          description: Name of the bucket containing this object
        name:
          type: string
          description: Full path within bucket
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: Auth user who uploaded (null for anonymous/service)
        is_public:
          type: boolean
          default: false
        size:
          type: integer
          format: int64
          description: File size in bytes
        mime_type:
          type: string
        etag:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        public_url:
          type: string
          format: uri
          description: |
            Shareable public URL for this file (only set for public files with is_public=true).
            This URL requires NO authentication and can be embedded in HTML, shared via email, etc.
      required:
        - id
        - bucket_id
        - bucket_name
        - name
        - is_public
        - size
        - mime_type
    StoragePolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bucket_id:
          type: string
          format: uuid
        name:
          type: string
          description: Policy name (unique within bucket)
        operation:
          type: string
          enum:
            - SELECT
            - INSERT
            - UPDATE
            - DELETE
          description: Operation this policy applies to
        definition:
          type: string
          description: |
            Policy expression evaluated at request time.
            Examples:
            - "true" - Allow all
            - "auth.uid() = owner_id" - Owner only
            - "auth.role() = 'authenticated'" - Authenticated users
            - "(storage.foldername(name))[1] = auth.uid()::text" - User's folder
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - bucket_id
        - name
        - operation
        - definition
    StorageStats:
      type: object
      description: Aggregate storage statistics for a project
      properties:
        bucket_count:
          type: integer
          description: Number of storage buckets
        object_count:
          type: integer
          description: Total number of stored files
        total_size:
          type: integer
          format: int64
          description: Total storage used in bytes
      required:
        - bucket_count
        - object_count
        - total_size
    StorageVisibilityRequest:
      type: object
      properties:
        is_public:
          type: boolean
          description: Whether the file should be publicly accessible
      required:
        - is_public
    UnbanUserResponse:
      type: object
      description: Response when unbanning a user
      properties:
        message:
          type: string
          example: User unbanned successfully
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - active
      required:
        - message
        - user_id
        - email
        - status
    TestEmailRequest:
      type: object
      required:
        - to_email
      description: |
        When `html_body` or `text_body` is provided the backend renders
        those (plus optional `subject`) through html/text templates
        against the standard `Data` (ProjectName, Name, SiteURL)
        and sends the result — used by the template-editor "Send Test"
        affordance to preview an unsaved template. When both bodies are
        omitted a hardcoded diagnostic message is sent to verify SMTP
        credentials and `subject` is ignored. Sending `subject` alone
        (without a body) is rejected with 400.
      properties:
        to_email:
          type: string
          format: email
          description: Recipient address for the diagnostic email.
        subject:
          type: string
          description: |
            Optional subject override, rendered as a text/template. Only
            applied on the override path — requires `html_body` or
            `text_body` to also be set, otherwise the request is
            rejected with 400.
        html_body:
          type: string
          maxLength: 262144
          description: Optional HTML body override. Rendered as an html/template. Max 256 KiB.
        text_body:
          type: string
          maxLength: 262144
          description: Optional plain-text body override. Rendered as a text/template. Max 256 KiB.
    TestEmailResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    UpdateAuthConfigRequest:
      type: object
      description: 'All fields optional - only include fields you want to update. Validation rule: require_email_confirmation=true requires email_enabled=true.'
      properties:
        access_token_lifetime:
          type: integer
        refresh_token_lifetime:
          type: integer
        inactivity_timeout:
          type: integer
        max_session_duration:
          type: integer
        min_password_length:
          type: integer
          minimum: 15
          maximum: 128
        require_uppercase:
          type: boolean
        require_lowercase:
          type: boolean
        require_numbers:
          type: boolean
        require_special_chars:
          type: boolean
        enable_signup:
          type: boolean
          description: Master switch for signups across ALL providers
        enable_email_password:
          type: boolean
          description: Enable/disable email/password provider
        rate_limit_signup:
          type: integer
        rate_limit_signin:
          type: integer
        rate_limit_token_refresh:
          type: integer
        cors_allow_credentials:
          type: boolean
        cors_max_age:
          type: integer
        enable_anonymous_signins:
          type: boolean
        allowed_email_domains:
          type: array
          maxItems: 100
          description: |
            Replaces the email domain allowlist. Empty array removes the
            restriction so any domain can sign up. Entries must be bare domains
            such as `domain1.com` and are stored normalized (lowercase, no `@`
            prefix); matching is exact, so subdomains need their own entry. At
            most 100 entries.

            Restricting signups is a PRO feature to configure and to enforce: a
            FREE project can only remove the restriction and gets 403 for any
            other change, and the list it keeps is parked until it upgrades.
          items:
            type: string
          example:
            - domain1.com
            - domain2.com
        allowed_email_domains_mode:
          type: string
          description: |
            How far `allowed_email_domains` reaches. `signup` gates account
            creation only. `signup_and_signin` also blocks sign-in for accounts
            outside the list; switching to it, or narrowing the list while in
            it, deletes the sessions of every account it locks out. `disabled`
            keeps the list without enforcing it.
          enum:
            - disabled
            - signup
            - signup_and_signin
        allow_password_reset:
          type: boolean
        password_reset_timeout:
          type: integer
        max_password_history:
          type: integer
        require_email_confirmation:
          type: boolean
          description: Require users to confirm email before sign-in. Can only be true when email_enabled is true.
        email_confirmation_timeout:
          type: integer
          description: Email confirmation token expiry in seconds.
        auto_link_verified_oauth:
          type: boolean
          description: Link a verified OAuth identity to an existing confirmed account with the same email instead of returning a conflict. Requires require_email_confirmation to be true.
        email_enabled:
          type: boolean
          description: Enable transactional email sending. Cannot be false while require_email_confirmation is true.
        email_from_address:
          type: string
        email_from_name:
          type: string
        smtp_host:
          type: string
        smtp_port:
          type: integer
        smtp_username:
          type: string
        smtp_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Replacement SMTP password. Omit this field to preserve the configured password. The value is encrypted at rest and never returned.
        smtp_use_tls:
          type: boolean
        email_confirmation_subject:
          type: string
        email_password_reset_subject:
          type: string
        email_password_changed_subject:
          type: string
        managed_auth_enabled:
          type: boolean
          description: Enable or disable managed auth hosted pages for the project.
        post_auth_redirect_url:
          type: string
          description: Must be included in allowed_redirect_urls when set.
        allowed_redirect_urls:
          type: array
          items:
            type: string
          description: Redirect allowlist. Every entry must be a valid http/https URL.
        post_logout_redirect_url:
          type: string
          description: Must be included in allowed_redirect_urls when set.
        device_verification_url:
          type: string
          description: |
            Optional custom device-authorization verification page. Must be a
            valid http/https URL (not tied to allowed_redirect_urls). When set,
            device-code logins return this URL (with user_code) instead of the
            managed device page. Send an empty string to clear the override.
    UpdateAuthHostedPageRequest:
      type: object
      required:
        - html
      properties:
        html:
          type: string
          description: Raw HTML markup for the page. Max 256 KiB.
        css:
          type: string
          description: Optional CSS injected at render time. Max 256 KiB.
    UpdateDatabaseTypeRequest:
      type: object
      description: Update database compute size tier
      properties:
        database_type:
          type: string
          description: New compute size tier
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          example: volcano-db-m
      required:
        - database_type
    UpdateEmailTemplateRequest:
      type: object
      properties:
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string
    UpdateFunctionRequest:
      type: object
      properties:
        is_public:
          type: boolean
          description: |
            Function visibility for anon-key invocation.
            - `false` (default): private function
            - `true`: public function (anon keys with `functions.invoke` can invoke)
      required:
        - is_public
    UpdateFunctionSchedulerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
        schedule:
          $ref: '#/components/schemas/ScheduleRequest'
        payload:
          type: object
          additionalProperties: true
        regions:
          type: array
          maxItems: 1
          items:
            type: string
    UpdateOAuthConfigRequest:
      type: object
      properties:
        client_id:
          type: string
          description: Supported for non-device providers. Not supported for `provider=device`.
        client_secret:
          type: string
          description: Supported for non-device providers. Not supported for `provider=device`.
        redirect_url:
          type: string
          format: uri
        scopes:
          type: array
