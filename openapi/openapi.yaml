        - value
    Database:
      type: object
      description: |
        PostgreSQL database with automatic scalability and security features.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Database name
          pattern: ^[a-z0-9_]+$
          maxLength: 64
        status:
          type: string
          enum:
            - provisioning
            - active
            - failed
            - deleting
          description: Database provisioning status
        provisioning_started_at:
          type: string
          format: date-time
          description: Timestamp when the current provisioning phase started
        connection_string:
          type: string
          description: |
            Secure PostgreSQL connection URI for your database.

            The database is identified by the globally-unique username
            (`volcano_client_{database_id}`) already in this URI; the
            `application_name` parameter only selects the access mode:
            - `volcano_full_access` — Full admin access (DDL, migrations)
            - `volcano_user_access:{user_id}` — User impersonation (RLS enforced)
            - `volcano_user_access` — Anonymous access (anon role, RLS enforced)
          example: postgres://volcano_client_11111111-1111-1111-1111-111111111111:vpg_secret@database.volcano.dev:5432/my_app_db?sslmode=require&application_name=volcano_full_access
        region:
          type: string
          description: AWS region where database is hosted
          example: aws-us-east-1
        pg_version:
          type: string
          description: PostgreSQL major version
          example: '16'
        database_type:
          type: string
          description: |
            Database size tier that determines available RAM and scaling limits.
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          example: volcano-db-xs
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent request timestamp for this database
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - name
        - status
        - created_at
        - updated_at
    DatabaseStats:
