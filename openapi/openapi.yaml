  /auth/user/change-email:
    post:
      tags:
        - Authentication
      summary: Request email change
      description: |
        Request to change user's email address.
        Sends confirmation token to new email address.
      operationId: authRequestEmailChange
      security:
        - AuthUserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_email
              properties:
                new_email:
                  type: string
                  format: email
      responses:
        '200':
          description: Confirmation email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  new_email:
                    type: string
        '400':
          description: Invalid email format or same as current email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (10 requests per hour per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/confirm-email-change:
    post:
      tags:
        - Authentication
      summary: Confirm email change
      description: Confirm email change with token sent to new address
      operationId: authConfirmEmailChange
      security:
        - AuthUserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email_change_token
              properties:
                email_change_token:
                  type: string
      responses:
        '200':
          description: Email changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          description: Invalid or expired token, or no pending email change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email is now in use by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/cancel-email-change:
    delete:
      tags:
        - Authentication
      summary: Cancel pending email change
      operationId: authCancelEmailChange
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: Email change cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/sessions:
    get:
      tags:
        - Authentication
      summary: Get current user's sessions
      description: |
        Returns paginated sessions for the currently authenticated user.
        Each session includes device info, IP addresses, and activity timestamps.
        The current session is marked with `is_current: true`.
      operationId: authGetMySessions
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of sessions per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of user sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  total:
                    type: integer
                    description: Total number of sessions
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of sessions per page
                  total_pages:
                    type: integer
                    description: Total number of pages
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Authentication
      summary: Sign out from all other devices
      description: |
        Deletes all sessions except the current one.
        Use this to log out from all other devices while keeping the current session active.
      operationId: authDeleteAllMySessions
      security:
        - AuthUserAccessToken: []
      responses:
        '204':
          description: All other sessions deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/sessions/{sessionId}:
    delete:
      tags:
        - Authentication
      summary: Sign out from specific device
      description: |
        Deletes a specific session, logging out that device.
        You can get session IDs from the list sessions endpoint.
      operationId: authDeleteMySession
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: The session ID to delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Returns authenticated user's profile. Requires access token.
      operationId: authGetUser
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated - access token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Authentication
      summary: Update user profile
      description: Update password or metadata. Requires access token.
      operationId: authUpdateUser
      security:
        - AuthUserAccessToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 6
                user_metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          description: Bad request - invalid password or metadata format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated - access token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/identities:
    get:
      tags:
        - Authentication
      summary: List the current user's identities
      description: |
        Returns every real email identity the account owns. An account can own
        multiple identities (for example a password identity plus one or more
        OAuth identities on different emails). Anonymous accounts have no real
        identity and return an empty list.
      operationId: authListIdentities
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: List of identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthIdentitiesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/identities/{identityId}:
    delete:
      tags:
        - Authentication
      summary: Unlink an identity from the current user
      description: |
        Removes a non-primary identity and its attached sign-in methods. Refused
        when the identity is the account's primary, its only identity, or when
        removing it would leave the account with no way to sign in.
      operationId: authUnlinkIdentity
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: identityId
          in: path
          required: true
          description: The identity ID to unlink
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Identity unlinked
        '400':
          description: Identity cannot be unlinked (primary, last, or would remove last sign-in method), or the identity id is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/methods:
    get:
      tags:
        - Authentication
      summary: List the current user's sign-in methods
      description: |
        Returns a flat list of every sign-in method the account owns (password,
        each OAuth provider, and any active anonymous method), with the primary
        method flagged. Password stubs and converted anonymous methods are excluded.
      operationId: authListMethods
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: List of sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/methods/{methodId}/promote:
    post:
      tags:
        - Authentication
      summary: Set a method as the account's primary
      description: |
        Promotes the given method to the account's primary sign-in method. The
        account's canonical email is re-derived from the promoted method's identity.
        Refused for password stubs and converted anonymous methods.
      operationId: authPromoteMethod
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: methodId
          in: path
          required: true
          description: The method ID to promote
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The promoted method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodSummary'
        '400':
          description: This method cannot be set as primary (password stub, converted anonymous method, or unverified email), or the method id is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Method not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/users:
    get:
      tags:
        - Auth Admin
      summary: List all auth users (admin)
      description: List auth users in project. Requires platform token.
      operationId: listAuthUsers
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthUsers'
  /projects/{id}/auth/users/{userId}:
    get:
      tags:
        - Auth Admin
      summary: Get specific auth user (admin)
      operationId: getAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Auth user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
    delete:
      tags:
        - Auth Admin
      summary: Delete auth user (admin)
      description: Soft-deletes user and revokes all sessions
      operationId: deleteAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
  /projects/{id}/auth/users/{userId}/sessions:
    get:
      tags:
        - Auth Admin
      summary: List user sessions
      description: |
        List paginated sessions for a specific auth user.
        Returns session details including device info, IP address, and activity timestamps.
      operationId: listUserSessions
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of sessions per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of user sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  total:
                    type: integer
                    description: Total number of sessions
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of sessions per page
                  total_pages:
                    type: integer
                    description: Total number of pages
        '404':
          description: User not found
    delete:
      tags:
        - Auth Admin
      summary: Delete all user sessions
      description: |
        Revokes all sessions for a user, forcing them to re-authenticate on all devices.
        Use this to log out a user from everywhere.
      operationId: deleteAllUserSessions
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: All sessions deleted
        '404':
          description: User not found
  /projects/{id}/auth/users/{userId}/sessions/{sessionId}:
    delete:
      tags:
        - Auth Admin
      summary: Delete specific session
      description: |
        Revokes a specific session for a user.
        Use this to log out a user from a single device.
      operationId: deleteUserSession
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session deleted
        '404':
          description: Session or user not found
  /projects/{id}/auth/users/{userId}/ban:
    post:
      tags:
        - Auth Admin
      summary: Ban a user
      description: |
        Bans a user temporarily or permanently. Banned users cannot sign in
        and all their active sessions are immediately revoked.

        - Omit `banned_until` for a permanent ban
        - Provide `banned_until` ISO timestamp for a temporary ban
      operationId: banAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                banned_until:
                  type: string
                  format: date-time
                  description: When the ban expires (omit for permanent ban)
                  example: '2026-12-31T23:59:59Z'
      responses:
        '200':
          description: User banned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanUserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/users/{userId}/unban:
    post:
      tags:
        - Auth Admin
      summary: Unban a user
      description: |
        Removes a ban from a user, restoring their ability to sign in.
        The user's status is set back to 'active'.
      operationId: unbanAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unbanned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnbanUserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/email-templates:
    get:
      tags:
        - Auth Configuration
      summary: List email templates
      description: Returns all custom email templates for this project.
      operationId: listEmailTemplates
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Email templates list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmailTemplate'
    post:
      tags:
        - Auth Configuration
      summary: Create email template
      description: |
        Creates a custom email template for the project. Custom email templates
        are a PRO-plan feature: requests from a FREE-plan project owner are
        rejected with 403, and FREE projects always send the built-in default
        templates regardless of any previously saved custom rows.
        Valid template types: welcome, confirmation, password_reset, password_changed
      operationId: createEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '400':
          description: Invalid template type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Custom email templates require the PRO plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/email-templates/{type}:
    get:
      tags:
        - Auth Configuration
      summary: Get email template
      operationId: getEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - welcome
              - confirmation
              - password_reset
              - password_changed
      responses:
        '200':
          description: Email template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '404':
          description: Template not found
    put:
      tags:
        - Auth Configuration
      summary: Update email template
      description: |
        Updates a custom email template. Custom email templates are a PRO-plan
        feature: requests from a FREE-plan project owner are rejected with 403
        (including after a PRO→FREE downgrade), so a FREE project cannot modify
        templates and always sends the built-in defaults.
      operationId: updateEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - welcome
              - confirmation
              - password_reset
              - password_changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailTemplateRequest'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '403':
          description: Custom email templates require the PRO plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
    delete:
      tags:
        - Auth Configuration
      summary: Delete email template
      description: |
        Deletes a custom template, reverting to the default. Custom email
        templates are a PRO-plan feature: requests from a FREE-plan project owner
        are rejected with 403.
      operationId: deleteEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - welcome
              - confirmation
              - password_reset
              - password_changed
      responses:
        '204':
          description: Template deleted
        '403':
          description: Custom email templates require the PRO plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
  /email-templates/defaults:
    get:
      tags:
        - Auth Configuration
      summary: Get default email templates
      description: Returns the default email templates used when no custom template is configured.
      operationId: getDefaultEmailTemplates
      responses:
        '200':
          description: Default templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmailTemplate'
  /email-templates/defaults/{type}:
    get:
      tags:
        - Auth Configuration
      summary: Get default email template by type
      operationId: getDefaultEmailTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - welcome
              - confirmation
              - password_reset
              - password_changed
      responses:
        '200':
          description: Default template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '404':
          description: Template type not found
  /projects/{id}/auth/config:
    get:
      tags:
        - Auth Configuration
      summary: Get auth configuration
      operationId: getAuthConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
    put:
      tags:
        - Auth Configuration
      summary: Update auth configuration
      operationId: updateAuthConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthConfigRequest'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
  /projects/{id}/auth/config/test-email:
    post:
      tags:
        - Auth Configuration
      summary: Send a test email using the project's saved SMTP config
      description: |
        Sends a diagnostic email to `to_email` using the project's
        persisted `auth_config` SMTP credentials. If `html_body` or
        `text_body` is supplied, the override path is taken: those
        values (plus optional `subject`) are rendered through
        html/text templates against the project's `Data` and
        used as the body — used by the template editor's "Send Test"
        affordance to preview an unsaved template. With both bodies
        omitted, a hardcoded diagnostic message is sent and any
        `subject` field is ignored. Sending `subject` alone (no
        bodies) is rejected with 400 to avoid a silently-dropped
        subject or a blank message. Also rejects with 400 if
        `email_enabled=false` or `smtp_host` is empty.
      operationId: testEmailConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEmailRequest'
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResponse'
        '400':
          description: Invalid request or email delivery not configured
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
        '502':
          description: Template render failure or SMTP delivery failed
  /projects/{id}/auth/hosted-pages/{pageType}:
    get:
      tags:
        - Auth Configuration
      summary: Get hosted auth page
      description: Returns current saved HTML/CSS for the page type. If no custom page exists yet, returns the default template for that page type.
      operationId: getAuthHostedPage
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: pageType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HostedAuthPageType'
      responses:
        '200':
          description: Hosted page loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthHostedPageResponse'
    put:
      tags:
        - Auth Configuration
      summary: Update hosted auth page
      description: |
        Saves the current HTML/CSS for this page type.
        Security validation rejects script tags, javascript: URLs, inline event handlers, iframe/object/embed/meta/link tags in HTML,
        and closing style/head tags in CSS.
      operationId: updateAuthHostedPage
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: pageType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HostedAuthPageType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthHostedPageRequest'
      responses:
        '200':
          description: Hosted page updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthHostedPageResponse'
        '400':
          description: Invalid input or unsafe markup
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /projects/{id}/auth/hosted/{pageType}:
    get:
      tags:
        - Auth Configuration
      summary: Render managed reset-password page
      description: |
        Public HTML endpoint for the managed reset-password page.
        Requires `Accept: text/html`.
        Returns 404 when managed hosted pages are disabled for the project.
      security: []
      operationId: renderManagedAuthPage
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: pageType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HostedRenderablePageType'
      responses:
        '200':
          description: Hosted auth page HTML
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid project id or unsupported Accept header
        '404':
          description: Managed pages disabled or page type not found
  /projects/{id}/auth/hosted:
    get:
      tags:
        - Auth Configuration
      summary: Render default managed auth page
      description: |
        Public HTML endpoint for the managed login page.
        Requires `Accept: text/html`.
      security: []
      operationId: renderDefaultManagedAuthPage
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - login
              - signup
              - forgot-password
              - device
          description: |
            Optional deep-link action for the unified hosted page. Ignored when a
            custom login page is configured. `action=device` renders the device
            authorization approval UI inline (no redirect to any external app);
            it signs the user in and calls `POST /auth/device/verify`.
        - name: user_code
          in: query
          required: false
          schema:
            type: string
          description: Device user code (from `POST /auth/device/authorize`) used with `action=device`.
        - name: anon_key
          in: query
          required: false
          schema:
            type: string
          description: Project anon key used by built-in managed auth flows (required for login/signup/device actions).
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque one-time nonce generated by the client SDK before redirecting
            here. On successful login/signup it is echoed back in the post-auth
            redirect fragment as `state`, so the SDK can bind the returned session
            to the flow it initiated (login-CSRF / session-fixation defense). The
            SDK rejects a returned session whose `state` does not match.
      responses:
        '200':
          description: Hosted auth page HTML
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid project id or unsupported Accept header
        '404':
          description: Managed pages disabled
  /projects/{id}/auth/hosted/login/options:
    get:
      tags:
        - Auth Configuration
      summary: Get hosted login runtime options
      description: |
        Returns runtime options for the built-in managed login flow.
        Requires `anon_key` query parameter.
        Rate limited per project and client IP. Excess requests return `429` and `Retry-After`.
      security: []
      operationId: getHostedLoginOptions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: anon_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hosted login options returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedLoginOptionsResponse'
        '401':
          description: Invalid or missing anon key
        '404':
          description: Managed pages disabled
        '429':
          description: Rate limit exceeded
  /projects/{id}/auth/hosted/login/check-email:
    post:
      tags:
        - Auth Configuration
      summary: Check whether email exists for hosted login flow
      description: |
        Used by the built-in managed login page to branch UI between signin and signup.
        Requires anon key in Authorization header.
        Rate limited per project and client IP. Excess requests return `429` and `Retry-After`.
      security: []
      operationId: hostedLoginCheckEmail
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer anon key (`Bearer <anon_key>`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedLoginEmailCheckRequest'
      responses:
        '200':
          description: Email existence evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedLoginEmailCheckResponse'
        '401':
          description: Invalid or missing anon key
        '429':
          description: Rate limit exceeded
  /projects/{id}/auth/methods:
    get:
      tags:
        - Auth Configuration
      summary: Get all authentication methods
      description: |
        Returns all configured authentication methods for this project,
        including email/password, anonymous, device authorization, and OAuth providers.
      operationId: getAuthMethods
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Authentication methods configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_password:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      method:
                        type: string
                      name:
                        type: string
                  anonymous:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      method:
                        type: string
                      name:
                        type: string
                  oauth_providers:
                    type: array
                    items:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        method:
                          type: string
                        provider:
                          type: string
                        name:
                          type: string
                        redirect_url:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                  available_methods:
                    type: array
                    items:
                      type: string
                    example:
                      - email_password
                      - oauth_google
                      - oauth_github
    put:
      tags:
        - Auth Configuration
      summary: Configure authentication methods (unified)
      description: |
        Configure all authentication methods in a single request.
        At least one method must remain enabled.
      operationId: configureAuthMethods
