    MetricUsageData:
      type: object
      description: Usage data for one metric across totals, daily, and hourly windows.
      properties:
        metric:
          type: string
          description: |
            Metric name (for example, "Function & Frontend Invocations", "Frontend Requests",
            "CodeBuild Build Seconds", "Bandwidth Ingress (Bytes)", "Bandwidth Egress (Bytes)",
            "Bandwidth Total (Bytes)", or "Database Storage (Bytes)"). Byte-based metrics are
            reported in bytes. "Bandwidth Total (Bytes)" is derived (ingress + egress) and
            is not billed separately. "Database Storage (Bytes)" is a current observed gauge,
            not a cumulative counter.
        total:
          type: integer
          format: int64
          description: Total usage for the current usage month
        all_time:
          type: integer
          format: int64
          description: Lifetime cumulative usage across every month for this metric
        daily:
          type: array
          description: Last 30 days of daily usage points
          items:
            $ref: '#/components/schemas/UsageDataPoint'
        hourly:
          type: array
          description: Last 24 hours of hourly usage points
          items:
            $ref: '#/components/schemas/UsageDataPoint'
      required:
