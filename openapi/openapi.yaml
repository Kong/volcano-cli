            - github
            - microsoft
            - apple
            - device
          example: google
        client_id:
          type: string
          example: 123456789.apps.googleusercontent.com
          description: Required for non-device providers. Must not be provided for `provider=device`; server always auto-generates it.
        client_secret:
          type: string
          example: GOCSPX-abc123def456
          description: Required for non-device providers. Must not be provided for `provider=device`; server always auto-generates it.
        redirect_url:
          type: string
          description: Required for non-device providers. Not used for `provider=device`.
          format: uri
          example: https://yourapp.com/auth/callback
        scopes:
          type: array
          items:
            type: string
          example:
            - openid
            - email
            - profile
          description: Optional for non-device providers, uses provider defaults if omitted. Not used for `provider=device`.
    CreateProjectRequest:
      type: object
      description: Request to create a new project
      properties:
        name:
          type: string
          description: |
            Project name (must be unique).
            Can only contain letters, numbers, underscores, and hyphens.
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          maxLength: 255
          example: my-awesome-app
        all_regions:
          type: boolean
          description: |
            Optional region policy.
            - `true` (default): project functions deploy to all configured regions
            - `false`: project deploys only to `selected_regions`
          default: true
        selected_regions:
          type: array
          items:
            type: string
          description: |
            Optional region subset. Requires `all_regions=false`.
            Region names must be a subset of platform `AWS_REGIONS`.
          example:
            - us-east-1
            - us-west-2
      required:
        - name
    CreateStorageBucketRequest:
      type: object
      properties:
        name:
          type: string
          description: Bucket name (alphanumeric, dashes, underscores)
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 64
        file_size_limit:
          type: integer
          format: int64
          description: Maximum file size in bytes
        allowed_mime_types:
          type: array
          items:
            type: string
          description: Allowed MIME types (e.g., ["image/png", "image/jpeg"])
      required:
        - name
    CreateStoragePolicyRequest:
      type: object
