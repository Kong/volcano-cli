    ProjectLockLeaseRequest:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 5
          maximum: 7776000
          description: |
            Lease duration in seconds, from 5 seconds through 90 days, measured
            from when the request is served. Renew before it elapses. A renewal
            sets the new expiry outright, so a shorter TTL shortens the lease.
            Renewals cannot extend an acquisition beyond its absolute 90-day
            deadline.
      required:
        - ttl_seconds
    ProjectLockLease:
      type: object
      additionalProperties: false
      properties:
        expires_at:
          type: string
          format: date-time
          description: Advisory lease expiry timestamp in UTC.
        fencing_token:
          type: integer
          format: int64
          description: |
            Monotonically increasing token for this acquisition. It rises whenever the
            lock changes hands and stays the same across renewals of one lease. Pass it
            to the resource you are protecting and reject any write carrying a token
            lower than the highest already seen; that is what stops a displaced holder
            from writing after its lease lapsed.
      required:
        - expires_at
        - fencing_token
    ProjectLockState:
      type: object
      additionalProperties: false
      properties:
        held:
          type: boolean
          description: |
            Whether the lock is unavailable right now. False means an acquire would
            succeed. It remains true during the brief grace window after expiry.
        expires_at:
          type: string
          format: date-time
          description: Advisory lease expiry timestamp in UTC. Present only when held.
        fencing_token:
          type: integer
          format: int64
          description: Current holder's fencing token. Present only when held.
      required:
        - held
    CreateProjectGitRepositoryRequest:
      type: object
      properties:
        owner:
          type: string
          maxLength: 39
          pattern: ^[A-Za-z0-9-]+$
          description: GitHub account to create the repository under, as returned in account_login by /user/git/connections/{id}/installations. Omit for the connected user's own account. Must be an organization the app is installed on, or your own account.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Repository name, unique within the owner account.
        private:
          type: boolean
          default: true
          description: 'Whether the new repository is private. Defaults to true: the next step is pushing the project''s source into it, so an omitted field must not publish it.'
        description:
          type: string
          maxLength: 350
          description: Repository description shown on GitHub.
        root_directory:
          type: string
          description: Monorepo subdirectory the project builds from, as a relative path inside the repository. Omit for the repo root. Absolute paths and ".." traversal are rejected before the repository is created, because the build applies the same rule and nothing would deploy.
        production_branch:
          type: string
          maxLength: 255
          description: 'The branch to deploy from — name the one you are about to push. The repository is created empty, so it has no real default branch to follow: omitting this binds whatever branch name GitHub reports for the new repository (falling back to "main" if it reports none), which is the account''s configured default and a prediction, and pushing anything else then deploys nothing. Naming the branch GitHub already reports is not treated as pinning it, so the project still tracks a later default-branch rename; naming any other branch pins it. Rejected before the repository is created if it is not a valid Git branch name; it does not have to exist.'
      required:
        - name
    SetProjectGitProductionBranchRequest:
      type: object
      properties:
        production_branch:
          type: string
          minLength: 1
          maxLength: 255
          description: The branch a push must land on to deploy. Validated as a Git branch name only — it does not have to exist yet.
      required:
        - production_branch
    CreatedProjectGitConnection:
      type: object
      description: A newly created repository's project binding, plus whether the Volcano GitHub App can actually see it.
      properties:
        connection:
          $ref: '#/components/schemas/ProjectGitConnection'
        app_installed:
          type: boolean
          description: Whether the App installation covers the new repository. False means the binding is complete but no push will deploy until the user grants access at install_url. An installation scoped to selected repositories never picks up a new repo on its own.
        install_url:
          type: string
          description: Where the user grants the App access to the new repository. Present only when app_installed is false.
      required:
        - connection
        - app_installed
    ConnectProjectGitRequest:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
          description: The caller's user_git_connections row (see /user/git/connections).
        installation_id:
          type: integer
          format: int64
        repository_id:
          type: integer
          format: int64
          description: Stable GitHub repository id (repository.id), the preferred selector. Either repository_id or repo_full_name is required; when both are given they must identify the same live repository.
        repo_full_name:
          type: string
          deprecated: true
          description: Deprecated selector kept for a compatibility window; prefer repository_id. Either repository_id or repo_full_name is required.
        root_directory:
          type: string
          description: Monorepo subdirectory the project builds from. Omit for the repo root.
        production_branch:
          type: string
          maxLength: 255
          description: 'The branch a push must land on to deploy, with three cases, because this is a full replace and a read-modify-write client sends back whatever it read. Omit it to follow the repository''s GitHub default branch, which also discards a branch set earlier. Send back the branch the project already deploys from, when that is the repository''s default, and nothing changes either way — a project pinned to that branch stays pinned. Sending the default branch when the project deploys from something else returns it to following the default, including on a rebind, where a pin describes a branch chosen for the repository being left. Any other branch becomes the project''s own choice, exempt from later default-branch renames. Validated as a Git branch name only: it does not have to exist yet, so a project can be pointed at a branch about to be pushed. Changing repository and naming a branch other than the new repository''s default in one request is refused with 400, because the branch named is almost always the previous repository''s, echoed back — connect first, then set the branch.'
      required:
        - connection_id
        - installation_id
    Frontend:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
        framework:
          type: string
          enum:
            - nextjs
        app_root:
          type: string
          maxLength: 1024
          description: Optional relative POSIX path from the uploaded archive root to the Next.js app that is deployed.
        status:
          type: string
          description: |
            Frontend lifecycle status. `degraded` means the regional runtime remains
            available but edge synchronization exhausted its immediate retries; Volcano
            retries edge recovery without rebuilding the frontend, and stops once a new
            deployment is queued or the retry budget runs out, leaving the frontend
            `degraded` until the next redeploy. A redeploy that fails over a serving
            frontend stays `active` on the previous deployment, so `failed` means no
            deployment is serving.
          enum:
            - provisioning
            - active
            - degraded
            - failed
            - deleting
        provisioning_started_at:
          type: string
          format: date-time
          description: Timestamp when the current provisioning phase started
        deployed_regions:
          type: array
          items:
            type: string
        current_deployment_id:
          type: string
          format: uuid
          description: Identifier of the latest frontend deployment operation
        pending_deployment_id:
          type: string
          format: uuid
          description: Newest queued deployment that will run after the current operation
        site_url:
          type: string
        custom_domain:
          type: string
          description: Active custom domain hostname when configured
        custom_domain_status:
          type: string
          description: Current custom domain lifecycle status
          enum:
            - pending_verification
            - provisioning
            - active
            - detaching
            - failed
            - deleted
        last_invoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - name
        - framework
        - status
        - deployed_regions
        - created_at
        - updated_at
    FrontendCustomDomainResponse:
      type: object
      properties:
        domain:
          type: string
        tls_mode:
          type: string
          enum:
            - managed
            - byoc
        domain_status:
          type: string
          enum:
            - pending_verification
            - provisioning
            - active
            - detaching
            - failed
            - deleted
        verification_status:
          type: string
          enum:
            - pending
