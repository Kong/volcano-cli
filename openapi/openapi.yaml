openapi: 3.0.3
info:
  title: Volcano Hosting API
  description: |-
    Public API for Volcano Hosting clients, SDKs, and CLI tooling (Port 8000).

    This specification intentionally excludes first-party/internal APIs. See api/openapi-internal.yaml for non-public internal and Builder operations.
  version: 3.0.0
  contact:
    name: Volcano Hosting
    email: support@volcano.dev
servers:
  - url: https://api.volcano.dev
    description: Production API server
  - url: http://localhost:8000
    description: Development API server (use VOLCANO_API_URL env var)
tags:
  - name: Projects
    description: Project management operations
  - name: Logs
    description: Project-scoped log search and activity APIs
  - name: Functions
    description: Function deployment and management
  - name: Frontends
    description: Frontend deployment and management. Supports Next.js 15.x and 16.x with Node.js 22.x or 24.x inferred from package.json engines.node when the selected Node.js family satisfies the installed Next.js package engines.node constraint.
  - name: Tokens
    description: Service keys for function invocation and database admin access
  - name: Variables
    description: Environment variable management
  - name: Databases
    description: Serverless PostgreSQL database provisioning and management
  - name: Database Queries
    description: REST API for querying databases (SELECT, INSERT, UPDATE, DELETE)
  - name: Authentication
    description: End-user authentication (signup, signin, profile)
  - name: Auth Admin
    description: Auth user management (platform admin only)
  - name: Auth Configuration
    description: Authentication settings and anon keys
  - name: Anon Keys
    description: Project-specific public keys for frontend auth
  - name: Service Keys
    description: Project-specific secret keys for admin operations (bypass RLS - backend only!)
  - name: OAuth Configuration
    description: OAuth provider configuration (Google, GitHub, Microsoft, Apple)
  - name: OAuth Authentication
    description: OAuth login flows and provider management for end users
  - name: Storage Buckets
    description: Storage bucket management (platform admin)
  - name: Storage Policies
    description: Storage access policy management (platform admin)
  - name: Storage Admin
    description: Storage statistics and cross-bucket object listing (platform admin)
  - name: Storage Objects
    description: File upload, download, and management (SDK-facing)
  - name: Realtime
    description: WebSocket realtime configuration and monitoring
  - name: System
    description: System health and monitoring endpoints
  - name: CLI Authentication
    description: |
      Browser-based CLI login flow for automatic token provisioning.
      The CLI creates a session, opens a browser for user authentication,
      and polls for completion. Session completion is handled by volcano.dev
      via the Management API.
paths:
  /projects:
    get:
      tags:
        - Projects
      summary: List all projects for authenticated user
      operationId: listProjects
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
    post:
      tags:
        - Projects
      summary: Create a new project
      description: |
        Creates a project for the authenticated user.
        Each user can create up to 1,000 projects. Requests over this cap return 403.
      operationId: createProject
      security:
        - UserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Project limit exceeded for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}:
    get:
      tags:
        - Projects
      summary: Get project by ID
      operationId: getProject
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Projects
      summary: Update project metadata and region policy
      operationId: updateProject
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (for example, selecting subset regions on non-PRO plan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict (project name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: |
        Starts asynchronous project deletion. The project remains visible with `status: deleting`
        until cleanup finishes, then it returns 404 and no longer appears in project lists.
      operationId: deleteProject
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: Project deletion started
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/health:
    get:
      tags:
        - Projects
      summary: Get project health
      description: |
        Returns a fast control-plane health snapshot for the project and its
        deployed resources. The endpoint does not run live provider probes.
        A successful request returns 200 even when the project status is
        `unhealthy`; transport and authorization failures use HTTP errors.
      operationId: getProjectHealth
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project health snapshot retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectHealthResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/metrics/query:
    post:
      tags:
        - Projects
      summary: Query project runtime metrics
      description: |
        Evaluates a batch of named, curated runtime metric queries over one
        trailing time range. Query IDs correlate each request with its result;
        raw backend query languages are intentionally not exposed.
      operationId: queryProjectMetrics
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMetricsQueryRequest'
      responses:
        '200':
          description: Project runtime metric queries evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMetricsQueryResponse'
        '400':
          description: Invalid metric query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Runtime metrics backend unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/logo:
    get:
      tags:
        - Projects
      summary: Get the project logo image
      description: |
        Returns the raw logo image stored in the project's S3 folder. This
        endpoint is unauthenticated so the asset can be rendered directly in an
        `<img>` tag; project IDs are unguessable UUIDs and logos are
        non-sensitive branding. The `Project.logo_url` field exposes a versioned
        path to this endpoint.
      operationId: getProjectLogo
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Logo image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '404':
          description: Project or logo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Projects
      summary: Upload or replace the project logo
      description: |
        Uploads an image as the project's logo, storing it in the project's S3
        folder. Accepts PNG, JPEG, GIF, WebP, or SVG up to 2 MB. Replaces any
        existing logo. Returns the updated project, whose `logo_url` reflects
        the new logo.
      operationId: uploadProjectLogo
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - logo
              properties:
                logo:
                  type: string
                  format: binary
                  description: Logo image (PNG, JPEG, GIF, WebP, or SVG; max 2 MB)
      responses:
        '200':
          description: Logo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request (missing file, unsupported type, or too large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Project is being deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Logo storage is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Projects
      summary: Remove the project logo
      description: |
        Deletes the project logo from the project's S3 folder and clears its
        record. Returns the updated project with no `logo_url`.
      operationId: deleteProjectLogo
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Logo removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Project is being deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Logo storage is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/usage:
    get:
      tags:
        - Projects
      summary: Get usage metrics for a project
      description: |
        Returns project usage totals for the current usage month plus
        recent hourly and daily time series for each tracked metric.
      operationId: getProjectUsage
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Usage metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUsageResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/config:
    get:
      tags:
        - Projects
      summary: Export project configuration
      description: |
        Exports the project's current user-facing configuration as a
        declarative manifest. Returns JSON by default. Request the canonical
        volcano-config.yaml rendering with `Accept: application/yaml` or
        `?format=yaml`; the YAML is returned verbatim as the raw response body
        (`Content-Type: application/yaml`) and is meant to be saved as-is.
        Write-only secrets (SMTP password, OAuth client secrets, TLS material)
        are omitted from the export; the YAML rendering adds a header comment
        describing how to set them via CLI environment interpolation.
      operationId: getProjectConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: format
          in: query
          required: false
          description: Response format override. Takes precedence over the Accept header.
          schema:
            type: string
            enum:
              - json
              - yaml
      responses:
        '200':
          description: |
            Current project configuration. JSON by default; when YAML is
            requested the body is the canonical volcano-config.yaml document
            served verbatim with `Content-Type: application/yaml`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfig'
            application/yaml:
              schema:
                type: string
                format: binary
                description: |
                  Canonical volcano-config.yaml document returned verbatim,
                  ready to be saved as-is.
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Projects
      summary: Apply project configuration
      description: |
        Validates and applies a declarative configuration manifest to the
        project, reconciling each declared section and returning a per-resource
        report. Omitted sections are untouched. Declared collection keys
        (`variables`, `buckets[].policies`, `auth.providers.oauth`,
        `auth.email.templates`, `functions[].schedulers`) are fully synced:
        resources absent from the manifest are deleted. Functions, frontends,
        databases, and buckets are never created or deleted; manifest entries
        for resources that do not exist are skipped and reported in `skipped`,
        and existing resources missing from a declared section are reported in
        `missing`. Validation failures (including plan-gate violations) return
        422 and nothing is applied. Set `dry_run=true` to get the projected
        report without applying changes. Applies are serialized per project;
        a concurrent apply returns 409.
      operationId: applyProjectConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: dry_run
          in: query
          required: false
          description: Validate and report projected actions without applying changes.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConfig'
      responses:
        '200':
          description: |
            Apply report. Individual entries may still carry `action: error`
            for apply-phase failures (summary.errors > 0); already-applied
            changes are not rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfigApplyResult'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another apply is in progress for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Manifest validation failed; nothing was applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfigValidationErrorResponse'
  /projects/{id}/databases/{databaseName}/queries:
    get:
      tags:
        - Databases
      summary: Get database queries
      description: |
        Returns the database's current top queries from pg_stat_statements
        ranked by total execution time.

        **PRO plan required.** This endpoint is only available to projects owned
        by users on the PRO billing plan.
      operationId: getProjectDatabaseQueries
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - name: limit
          in: query
          description: Maximum number of queries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Database query performance retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryPerformanceResponse'
        '400':
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/deployments:
    get:
      tags:
        - Projects
      summary: List deployments in a project
      description: |
        Lists Function and Frontend deployment attempts across the project,
        ordered most-recent first. Each item includes a normalized resource
        reference so clients can render both resource types without extra
        fetches.
      operationId: listProjectDeployments
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectDeployments'
        '400':
          description: Bad request - invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - project ownership required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/domains:
    get:
      tags:
        - Frontends
      summary: List all custom domains in a project
      description: |
        Project-scoped custom-domain list. Returns every active custom
        domain across every frontend in the project (excludes soft-deleted
        rows). Each item inlines the linked frontend's id and name so the
        UI does not need a second fetch to render the "Linked to" column.
      operationId: listProjectCustomDomains
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectCustomDomains'
        '400':
          description: Bad request - invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - project ownership required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/functions:
    get:
      tags:
        - Functions
      summary: List all functions in a project
      operationId: listFunctions
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFunctions'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Functions
      summary: Create or update function code
      description: |
        Upload a serverless function source bundle. Direct API clients may send the function code
        as a ZIP or tar.gz archive via multipart/form-data. The API stores a normalized tar.gz
        source archive.
        Cloud deploys should include source files and dependency manifests/lockfiles, not installed
        dependency directories. Volcano installs Node.js, Python, and Ruby dependencies during the
        function compile build.
        Source archive size is enforced by the API with `SOURCE_ARCHIVE_SIZE_LIMIT_MB`; the CLI
        does not apply its own source archive size limit. After the final Lambda container image is
        built, the publish build enforces `LAMBDA_TARGET_CONTAINER_SIZE_LIMIT_MB` before pushing.
        Uploaded source archives cannot contain symlink entries. Safe symlinks created during
        the cloud build are materialized before publish.
        Volcano builds and deploys the function asynchronously after upload. New functions and existing
        function code updates return a Function resource with `status: provisioning` while the Step
        Functions workflow is running, then transition to `active` or `failed`.
        If a function with the same name already exists in the project, this operation updates that
        function's runtime, handler, and source bundle and returns `200 OK`.
        Each project can contain up to 5,000 functions. Creating a new function over this cap returns 403.
      operationId: createFunction
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - code
                - runtime
              properties:
                name:
                  type: string
                  description: DNS-safe function name (lowercase letters, numbers, hyphens; cannot start or end with hyphen)
                  maxLength: 63
                  pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                  example: my-api-function
                code:
                  type: string
                  format: binary
                  description: ZIP or tar.gz archive containing function source code plus dependency manifests/lockfiles. The API enforces SOURCE_ARCHIVE_SIZE_LIMIT_MB and stores a normalized tar.gz source archive.
                runtime:
                  type: string
                  enum:
                    - nodejs22.x
                    - nodejs24.x
                    - python3.10
                    - python3.11
                    - python3.12
                    - python3.13
                    - python3.14
                    - ruby3.3
                    - ruby3.4
                    - ruby4.0
                  description: |
                    Runtime environment. Required.
                    - Node.js: nodejs22.x, nodejs24.x
                    - Python: python3.10, python3.11, python3.12, python3.13, python3.14
                    - Ruby: ruby3.3, ruby3.4, ruby4.0
                  example: nodejs24.x
                handler:
                  type: string
                  description: |
                    The name of the function to invoke. Defaults to "handler" if not specified.
                    Your code must export/define a function with this name:
                    - Node.js: exports.handler (in index.js)
                    - Python: def handler() (in main.py)
                    - Ruby: def handler() (in main.rb)
                  default: handler
                  example: handler
      responses:
        '200':
          description: Existing function updated and update workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Function'
        '201':
          description: Function created and deployment workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Function'
        '400':
          description: Bad request (invalid file, too large, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
