    DeploymentPhase:
      type: object
      description: Timing and outcome for one normalized deployment pipeline phase.
      properties:
        name:
          type: string
          enum:
            - queue
            - checkout
            - build
            - image
            - provisioning
            - rollout
            - verification
        status:
          type: string
          enum:
            - pending
            - in_progress
            - succeeded
            - failed
            - skipped
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int64
          minimum: 0
      required:
        - name
        - status
    DeploymentProgress:
      type: object
      description: Normalized live progress derived from the deployment workflow and build phases.
      properties:
        current_phase:
          type: string
          enum:
            - queue
            - checkout
            - build
            - image
            - provisioning
            - rollout
            - verification
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        elapsed_seconds:
          type: integer
          format: int64
          minimum: 0
        phases:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/DeploymentPhase'
        updated_at:
          type: string
          format: date-time
      required:
        - started_at
        - elapsed_seconds
        - phases
        - updated_at
    LogDeploymentRequestSelector:
      type: object
      description: Deployment log selector for deployable resources.
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 25
          description: Optional deployment identifiers. Omit or send an empty array to include every deployment for the selected resources.
          items:
            type: string
            format: uuid
    LogFunctionRequestResource:
      type: object
      description: Edge Function log resource selector.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - function
          description: Resource type to read logs for.
        ids:
          type: array
          maxItems: 25
          description: Optional function identifiers. Omit or send an empty array to include every function in the project.
          items:
            type: string
            format: uuid
        deployments:
          $ref: '#/components/schemas/LogDeploymentRequestSelector'
      required:
        - type
    LogFrontendRequestResource:
      type: object
      description: Frontend log resource selector.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - frontend
          description: Resource type to read logs for.
        ids:
          type: array
          maxItems: 25
          description: Optional frontend identifiers. Omit or send an empty array to include every frontend in the project.
          items:
            type: string
            format: uuid
        deployments:
          $ref: '#/components/schemas/LogDeploymentRequestSelector'
      required:
        - type
    LogDatabaseRequestResource:
      type: object
      description: Database runtime log resource selector. Deployment logs are not supported for databases.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - database
          description: Resource type to read logs for.
        ids:
          type: array
          maxItems: 25
          description: Optional database identifiers. Omit or send an empty array to include every database in the project.
          items:
            type: string
            format: uuid
      required:
        - type
    LogRequestResource:
      description: Resource selectors for project log reads.
      oneOf:
        - $ref: '#/components/schemas/LogFunctionRequestResource'
        - $ref: '#/components/schemas/LogFrontendRequestResource'
        - $ref: '#/components/schemas/LogDatabaseRequestResource'
      discriminator:
        propertyName: type
        mapping:
          function: '#/components/schemas/LogFunctionRequestResource'
          frontend: '#/components/schemas/LogFrontendRequestResource'
          database: '#/components/schemas/LogDatabaseRequestResource'
    LogResource:
      type: object
      description: Resource that owns a historical log event.
      properties:
        type:
          type: string
          enum:
            - function
            - frontend
            - database
          description: Resource type that owns the log event.
        id:
          type: string
          format: uuid
          description: Resource ID that owns the log event.
        name:
          type: string
          description: Resource name associated with the log event, when available.
      required:
        - type
        - id
    LogDeployment:
      type: object
      description: Deployment context associated with a historical deployment log event.
      properties:
        id:
          type: string
          format: uuid
          description: Deployment ID associated with the log event.
        stage:
          type: string
          enum:
            - compile
            - publish
          description: Deployment stage that produced the log event, when available.
      required:
        - id
    DatabaseQueryFilter:
      type: object
      description: One WHERE condition. Conditions are combined with AND.
      properties:
        column:
          type: string
          example: status
        operator:
          type: string
          enum:
            - eq
            - neq
            - gt
            - gte
            - lt
            - lte
            - like
            - ilike
            - is
            - in
          example: eq
          description: |
            Filter operators:
            - eq: equals (=)
            - neq: not equals (<>)
            - gt: greater than (>)
            - gte: greater than or equal (>=)
            - lt: less than (<)
            - lte: less than or equal (<=)
            - like: pattern match (LIKE)
            - ilike: case-insensitive pattern match (ILIKE)
            - is: IS NULL / IS NOT NULL
            - in: IN array
        value:
          oneOf:
            - type: string
              nullable: true
            - type: number
            - type: boolean
            - type: array
              description: Array of values, for the `in` operator
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
          example: published
      required:
        - column
        - operator
        - value
    DatabaseQueryOrder:
      type: object
      description: One ORDER BY clause.
      properties:
        column:
          type: string
          example: created_at
        ascending:
          type: boolean
          default: true
          example: false
        nulls_first:
          type: boolean
          default: false
      required:
        - column
    FunctionRuntimeDeployment:
      type: object
      required:
        - file_extensions
        - entrypoint
        - handler
        - dependency_manifests
      properties:
        file_extensions:
          type: array
          description: Source file extensions the CLI can use to detect this runtime.
          items:
            type: string
          example:
            - .js
            - .mjs
        entrypoint:
          type: string
          description: Archive path the CLI should use for a single-file function source.
          example: index.js
        handler:
          type: string
          description: Handler symbol the CLI should submit when deploying this runtime.
          example: handler
        dependency_manifests:
          type: array
          description: Dependency manifest files the CLI should include for hosted builds.
          items:
            type: string
          example:
            - package.json
            - package-lock.json
    AuthHostedPageDefaults:
      type: object
      required:
        - html
        - css
      description: |
        The starting point for an unsaved page: the theme shell we render for the
        built-in page plus its stylesheet. Valid input to the update endpoint —
        it carries no script, meta, or link tags.
      properties:
        html:
          type: string
          description: Body shell markup containing the runtime render root.
        css:
          type: string
          description: The built-in stylesheet, themed by the customer.
    AuthHostedPageRuntime:
      type: object
      required:
        - root_id
        - script
        - mock_prelude
      description: |
        The server-owned behavior of a hosted page. Clients compose previews from
        this instead of reimplementing the page, so a preview cannot drift from
        what is actually served.
      properties:
        root_id:
          type: string
          description: Element id the runtime script renders into. Markup carrying it opts into the theme-shell contract.
        script:
          type: string
          description: The runtime script injected into the rendered page.
        mock_prelude:
          type: string
          description: Preview harness that supplies request params and stubs the hosted-auth API. Never served on a real page.
