                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                user_metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: User converted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
