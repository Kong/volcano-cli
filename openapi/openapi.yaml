  /databases/{databaseName}/branches/{branchName}/query/insert:
    post:
      tags:
        - Database Queries
      summary: Insert data into database (REST API)
      description: |
        Insert new rows into your database using REST API.

        **Authentication:** Requires auth user access token

        **Auto-set user_id:** If your table has a trigger using `auth.uid()`,
        user_id will be automatically set to the authenticated user

        **Security:** Row-Level Security policies are enforced

        **Branch-targeted.** Runs against the named branch instead of the parent
        database, using the branch's own credentials. The branch must be `active`
        and unexpired. Nothing about this request can reach the parent's data.
      operationId: queryDatabaseBranchInsert
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseInsertRequest'
      responses:
        '200':
          description: Insert successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryResult'
              example:
                data:
                  - id: uuid-123
                    title: My New Post
                    content: This is the content
                    status: draft
                    user_id: user-uuid
                    created_at: '2026-01-13T10:00:00Z'
                count: 1
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/branches/{branchName}/query/update:
    post:
      tags:
        - Database Queries
      summary: Update data in database (REST API)
      description: |
        Update existing rows in your database using REST API.

        **Security:** Row-Level Security ensures you can only update data you have access to

        **Safety:** Requires at least one filter to prevent accidental mass updates. A
        request with no `filters` is rejected with `400` (mirrors delete). This matters
        for service-key queries, which run with full access and bypass RLS.

        **Note:** If RLS blocks the update, an empty result is returned (not an error)

        **Branch-targeted.** Runs against the named branch instead of the parent
        database, using the branch's own credentials. The branch must be `active`
        and unexpired. Nothing about this request can reach the parent's data.
      operationId: queryDatabaseBranchUpdate
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseUpdateRequest'
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryResult'
              example:
                data:
                  - id: post-uuid
                    title: Updated Title
                    status: published
                    updated_at: '2026-01-13T10:05:00Z'
                count: 1
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/branches/{branchName}/query/delete:
    post:
      tags:
        - Database Queries
      summary: Delete data from database (REST API)
      description: |
        Delete rows from your database using REST API.

        **Safety:** Requires at least one filter to prevent accidental mass deletions

        **Security:** Row-Level Security ensures you can only delete data you have access to

        **Note:** If RLS blocks the delete, an empty result is returned (not an error)

        **Branch-targeted.** Runs against the named branch instead of the parent
        database, using the branch's own credentials. The branch must be `active`
        and unexpired. Nothing about this request can reach the parent's data.
      operationId: queryDatabaseBranchDelete
      security:
        - AuthUserAccessToken: []
      parameters:
