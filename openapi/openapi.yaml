                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          description: Invalid or expired token, or no pending email change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The pending email domain is no longer in `allowed_email_domains`.
            Re-checked here because the allowlist can narrow between the request
            and the confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email is now in use by another user
          content:
            application/json:
