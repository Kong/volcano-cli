  /locks/{key}/lease:
    post:
      tags:
        - Locks
      summary: Acquire a project lock
      description: |
        Acquires a project-scoped lease using the project embedded in the service-role key.
        The caller must hold the `locks.manage` permission. Repeating the request with the
        same lock token is idempotent and resets that lease to the requested TTL. A different
        live owner receives `409 lock_held`; a caller whose own lease already lapsed receives
        `409 lock_ownership_lost`.
      operationId: acquireProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockToken'
        - $ref: '#/components/parameters/LockRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLockLeaseRequest'
      responses:
        '201':
          description: Lease acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLockLease'
        '400':
          description: Invalid lock key, token, or TTL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The lock is held by another live lease (`lock_held`), or the caller's own lease
            lapsed and is not yet reclaimable (`lock_ownership_lost`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Locks
      summary: Renew a project lock
      description: |
        Renews a lease owned by the supplied lock token. The request must arrive
        more than one second before `expires_at`; this safety margin prevents
        clock skew between regional API instances from resurrecting an expired
        lease.
      operationId: renewProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockToken'
        - $ref: '#/components/parameters/LockRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLockLeaseRequest'
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLockLease'
        '400':
          description: Invalid lock key, token, or TTL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The lease expired or is owned by another token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Locks
      summary: Release a project lock
      description: Releases a lease only when the supplied lock token still owns it.
      operationId: releaseProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockToken'
        - $ref: '#/components/parameters/LockRequestId'
      responses:
        '204':
          description: Lease released
        '400':
          description: Invalid lock key or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The lease is owned by another token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /locks/{key}:
    get:
      tags:
        - Locks
      summary: Read a project lock
      description: |
        Reports whether the lock is currently held, when its lease expires, and the
        holder's fencing token. `held` follows takeover eligibility rather than raw
        expiry, so `held: false` means an acquire would succeed now. No lock token is
        required, making this usable for monitoring and recovery.
      operationId: getProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockRequestId'
      responses:
        '200':
          description: Current lock state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLockState'
        '400':
          description: Invalid lock key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Locks
      summary: Force release a project lock
      description: |
        Drops the lease whatever token holds it, for recovering a lock whose holder
        died without releasing. Use `DELETE /locks/{key}/lease` for normal release.

        This breaks mutual exclusion by itself: the previous holder keeps working
        until its own renewal fails. Guard the protected resource with the lease's
        `fencing_token`, which the next acquisition raises, so a write from the
        displaced holder can be rejected. Succeeds when the lock is already absent.
      operationId: forceReleaseProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockRequestId'
      responses:
        '204':
          description: Lock released
        '400':
          description: Invalid lock key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /storage/{bucketName}/move:
