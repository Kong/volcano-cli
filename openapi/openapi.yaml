  /auth/password-policy:
    get:
      tags:
        - Authentication
      summary: Get the effective password policy
      description: |
        Returns the backend-enforced password bounds and compromised-password
        screening status for the project identified by the anon key. A valid
        anon key is required, but no route-specific auth permission is needed.
      operationId: authGetPasswordPolicy
      security:
        - AnonKey: []
      responses:
        '200':
          description: Effective password policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPasswordPolicy'
        '401':
          description: Invalid, missing, or revoked anon key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or auth configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: Sign up a new auth user
      description: |
        Create a new end-user account. The project is determined from the anon key.
        Requires project-specific anon key in Authorization header.

        **Session-less**: signup never issues a session. On success it returns a
        uniform acknowledgement (`AuthSignupResponse`) with no tokens; the client
        obtains a session with a subsequent `POST /auth/signin`. If email confirmation
        is enabled for the project, a confirmation email is sent and
        `confirmation_required` is `true`.

        **Anti-enumeration**: a signup for an already-registered email returns the
        exact same `201` response as a fresh signup — it never returns `409` — so the
        response cannot be used to discover which emails are registered.
      operationId: authSignup
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: |
                    Password validated after NFC normalization against the
                    policy returned by GET /auth/password-policy.
                user_metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: |
            Signup acknowledged (session-less). Returned identically for a new
            account and for an already-registered email (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignupResponse'
        '400':
          description: Invalid input (bad email/password format)
        '401':
          description: |
            Unauthorized - Invalid, tampered, revoked, or wrong-project anon key
        '403':
          description: |
            Forbidden - Signups disabled, anon key lacks signup permission, or the
            email domain is not in `allowed_email_domains`. The internal
            `anonymous.volcano.internal` domain is reserved for anonymous
            accounts and is refused whatever the project allows.
        '429':
          description: Rate limit exceeded
        '503':
          description: Compromised-password screening is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/signin:
    post:
      tags:
        - Authentication
      summary: Sign in an auth user
      description: |
        Authenticate with email and password. Requires an anon key.

        Set `session_mode` to `cookie` to request HttpOnly refresh-token
        storage. Cookie mode is honored only for an exact, credentialed CORS
        origin on the same schemeful site as this API. Otherwise the response
        retains the refresh token in its body.
      operationId: authSignin
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
                session_mode:
                  type: string
                  enum:
                    - cookie
      responses:
        '200':
          description: Signin successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid input (missing email/password)
        '401':
          description: |
            Unauthorized - Invalid credentials, invalid/tampered/revoked anon key,
            or account banned/deleted
        '403':
          description: |
            Forbidden - Anon key lacks signin permission, or the email domain is
            not in `allowed_email_domains` while `allowed_email_domains_mode` is
            `signup_and_signin`. The domain is taken from the account's canonical
            email (its primary identity), which is not necessarily the address in
            the request.
        '429':
          description: Rate limit exceeded
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Get a new access token using a refresh token. Requires an anon key.

        Send `refresh_token` in the body for the default flow. An eligible
        cookie-mode browser request may instead send `session_mode: cookie`
        with an empty token or omit the request body; the API reads and resets
        the project's HttpOnly cookie and omits `refresh_token` from the
        response.
      operationId: authRefresh
      security:
        - AnonKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                session_mode:
                  type: string
                  enum:
                    - cookie
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The account's email domain is not in `allowed_email_domains` while
            `allowed_email_domains_mode` is `signup_and_signin`, so the session
            cannot be extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout (revoke refresh token)
      description: |
        Invalidate a refresh token. Requires an anon key.

        Send `refresh_token` for the default flow. An eligible cookie-mode
        browser request may instead send `session_mode: cookie` with an empty
        token; logout remains idempotent when the cookie is missing or expired.
      operationId: authLogout
      security:
        - AnonKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                session_mode:
                  type: string
                  enum:
                    - cookie
      responses:
        '204':
          description: Logged out successfully
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: |
        Generates recovery token and stores it (email sending pending).
        Returns generic message to prevent email enumeration.
        Project is identified via the anon key.
      operationId: authForgotPassword
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Generic success message (doesn't reveal if email exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If the email exists, a password reset link has been sent
        '403':
          description: Password reset is disabled for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (10 requests per hour per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with recovery token
      description: |
        Reset password using recovery token from forgot-password.
        Revokes all existing sessions for security.
      operationId: authResetPassword
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  description: Recovery token from forgot-password
                new_password:
                  type: string
                  description: |
                    Password validated after NFC normalization against the
                    policy returned by GET /auth/password-policy.
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Password doesn't meet requirements
        '401':
          description: Invalid or expired token
        '503':
          description: Compromised-password screening is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm email address
      description: |
        Confirm email address using token sent via email.
        Required if require_email_confirmation is enabled.
      operationId: authConfirmEmail
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Confirmation token from email
      responses:
        '200':
          description: Email confirmed or already confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                      - Email confirmed successfully
                      - Email already confirmed
              examples:
                confirmed:
                  summary: Fresh confirmation
                  value:
                    message: Email confirmed successfully
                alreadyConfirmed:
                  summary: Token belongs to already-confirmed user
                  value:
                    message: Email already confirmed
        '400':
          description: Missing confirmation token in request body
        '401':
          description: Invalid or expired token
  /auth/resend-confirmation:
    post:
      tags:
        - Authentication
      summary: Resend confirmation email
      description: |
        Resend email confirmation link.
        Returns generic message to prevent email enumeration.
        No email is sent when the account does not exist or is already confirmed.
        If the account exists and is unconfirmed, a new token is generated and
        any previous confirmation token is invalidated.
      operationId: authResendConfirmation
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Generic success message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/signup-anonymous:
    post:
      tags:
        - Authentication
      summary: Create anonymous user
      description: |
        Create guest user without email/password.

        User metadata (like display_name) can be included and will appear in realtime presence events.
        Requires enable_anonymous_signins to be true.
      operationId: authSignupAnonymous
      security:
        - AnonKey: []
      requestBody:
        description: Optional user metadata
        content:
          application/json:
            schema:
              type: object
              properties:
                user_metadata:
                  type: object
                  additionalProperties: true
                  description: Custom user metadata (e.g., display_name, avatar_url)
                  example:
                    display_name: Alice
                    avatar_url: https://example.com/alice.jpg
      responses:
        '201':
          description: Anonymous user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '403':
          description: Anonymous signins disabled
  /auth/user/convert-anonymous:
    post:
      tags:
        - Authentication
      summary: Convert anonymous user to authenticated
      description: |
        Add email and password to anonymous user.
        Requires auth user access token.
        If require_email_confirmation is enabled for the project, the converted
        user remains unconfirmed until /auth/confirm succeeds. When email
        sending is enabled, a confirmation email is sent during conversion.
      operationId: authConvertAnonymous
      security:
        - AuthUserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: |
                    Password validated after NFC normalization against the
                    policy returned by GET /auth/password-policy.
                user_metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: User converted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          description: Not an anonymous user
        '403':
          description: |
            The chosen email domain is not in `allowed_email_domains`
        '409':
          description: Email already in use
        '503':
          description: Compromised-password screening is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/change-email:
    post:
      tags:
        - Authentication
      summary: Request email change
      description: |
        Request to change user's email address.
        Sends confirmation token to new email address.
      operationId: authRequestEmailChange
      security:
        - AuthUserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_email
              properties:
                new_email:
                  type: string
                  format: email
      responses:
        '200':
          description: Confirmation email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  new_email:
                    type: string
        '400':
          description: Invalid email format or same as current email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The requested email domain is not in `allowed_email_domains`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (10 requests per hour per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/confirm-email-change:
    post:
      tags:
        - Authentication
      summary: Confirm email change
      description: Confirm email change with token sent to new address
      operationId: authConfirmEmailChange
      security:
        - AuthUserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email_change_token
              properties:
                email_change_token:
                  type: string
      responses:
        '200':
          description: Email changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
