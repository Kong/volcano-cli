        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /functions/{functionId}/invoke:
    post:
      tags:
        - Functions
      summary: Invoke a function
      description: |
        Invoke a serverless function.

        **With Service Key** (admin/background operations):
        - Use for background jobs, webhooks, cron, admin operations
        - Function receives payload only (no user context)
        - Database queries bypass RLS (admin access)

        **With Auth User Token** (user-facing):
        - Use for user-initiated actions
        - Function receives payload + `__volcano_auth` context:
          ```javascript
          {
            user_id: "uuid",
            email: "user@example.com",
            project_id: "uuid",
            role: "authenticated" or "anonymous"
          }
          ```
        - Database queries enforce RLS (user-scoped data)

        **With Anon Key** (public function only):
        - Requires anon key permission: `functions.invoke`
        - Function must have `is_public: true`
        - Function receives payload only (no `__volcano_auth`)

        **Transport and CORS:**
        - Direct invocation endpoint is intended for `http://api.<domain>/functions/{functionId}/invoke`
        - DNS invocation endpoint is `https://{functionId}.functions.<domain>/`
        - CORS preflight for invocation allows only `POST, OPTIONS`
      operationId: invokeFunction
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/FunctionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionInvocationRequest'
            examples:
              serviceCall:
                summary: Admin/background operation (service key)
                value:
                  payload:
                    action: process_batch
                    items:
                      - 1
                      - 2
                      - 3
              userCall:
                summary: User-initiated call (auth token)
                value:
                  payload:
                    action: get_profile
              anonCall:
                summary: Public function call (anon key)
                value:
                  payload:
                    action: ping_public_endpoint
      responses:
        '200':
          description: Function response (passthrough from function runtime)
          headers:
            X-Volcano-Version:
              description: Volcano API/runtime version that served this invocation (`<version>` in production, `<env>-<version>` in non-production)
              schema:
                type: string
            X-Volcano-Region:
              description: Region the function ran in (for example `us-east-1`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionInvocationResponse'
        '400':
          description: Bad request - invalid payload or function in failed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - CORS blocked, missing `functions.invoke`, or private function with anon key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Function not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Rate limit exceeded (per-function or project-wide limit), or the
            owning platform user's monthly bandwidth cap (aggregate ingress +
            egress) was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Function still provisioning or rate limiting service unavailable.
            A freshly deployed (or updated) function may briefly report
            `provisioning` and reject invocations until the background status
            reconciler observes its deployment workflow completing and transitions
            it to `active`. This is expected for a few seconds after deploy; clients
            should retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Function response (passthrough; status code/body/headers come from the function)
          headers:
            X-Volcano-Version:
              description: Volcano API/runtime version that served this invocation (`<version>` in production, `<env>-<version>` in non-production)
              schema:
                type: string
            X-Volcano-Region:
              description: Region the function ran in (for example `us-east-1`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionInvocationResponse'
  /functions/resolve:
    get:
      tags:
        - Functions
      summary: Resolve function name for invocation
      description: |
        Resolves a DNS-safe function name to its function ID within the caller's project.

        SDKs use this endpoint internally to invoke by function name while routing by function ID.

        **With Service Key**:
        - Allowed

        **With Auth User Token**:
        - Allowed

        **With Anon Key**:
        - Requires anon key permission: `functions.invoke`
        - Function must have `is_public: true`
      operationId: resolveFunctionForInvocation
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            maxLength: 63
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
