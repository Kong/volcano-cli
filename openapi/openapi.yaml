          description: Target file path
        content_type:
          type: string
          description: MIME type
        total_size:
          type: integer
          format: int64
          description: Total file size in bytes
        part_size:
          type: integer
          format: int64
          description: Size of each part (except last)
        total_parts:
          type: integer
          description: Total number of parts
        parts_uploaded:
