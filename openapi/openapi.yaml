    CompleteUploadSessionResponse:
      type: object
      description: Response when completing an upload
      properties:
        object:
          $ref: '#/components/schemas/StorageObject'
    CreateDatabaseBackupRequest:
      type: object
      properties:
        name:
          type: string
          description: |
            Backup name, unique within the database. Names beginning with
            `volcano-` are reserved for the platform's own snapshots.
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
          maxLength: 63
          example: before_migration
      required:
        - name
    CreateDatabaseBranchRequest:
      type: object
      properties:
        name:
          type: string
          description: Branch name (must be unique within the parent database)
          pattern: ^[a-z0-9_]+$
          maxLength: 64
          example: feature_checkout
        ttl_seconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
          description: |
            How long the branch should live, between one hour and 30 days.
            Defaults to 7 days when omitted.
          example: 86400
      required:
        - name
    CreateDatabaseRestoreRequest:
      type: object
      description: |
        Names what to restore. Supply exactly one of `backup_name` or
        `restore_to`.
      properties:
        backup_name:
          type: string
          description: A backup of this database to restore.
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
          maxLength: 63
          example: before_migration
        restore_to:
          type: string
          format: date-time
          description: |
            A point in time to restore to, which must fall inside the
            `restore_window` reported when listing backups.
          example: '2026-01-15T09:30:00Z'
    CreateDatabaseRequest:
      type: object
      description: |
        Create a new PostgreSQL database. Volcano automatically sets up:
        - Auth helpers (auth.uid(), auth.email(), auth.role())
        - Database roles (anon for unauthenticated, authenticated for signed-in users)
        - Secure multi-tenant isolation
        - Ready for Row-Level Security
      properties:
        name:
          type: string
          description: Database name (must be unique within project)
          pattern: ^[a-z0-9_]+$
          maxLength: 64
          example: my_database
        region:
          type: string
          description: Region for database hosting
          example: aws-us-east-1
          enum:
            - aws-us-east-1
            - aws-us-east-2
            - aws-us-west-2
            - aws-eu-central-1
            - aws-eu-west-2
            - aws-ap-southeast-1
            - aws-ap-southeast-2
            - aws-sa-east-1
        pg_version:
          type: string
          description: PostgreSQL major version
          example: '16'
          enum:
            - '15'
            - '16'
        database_type:
          type: string
          description: |
            Compute size tier (optional, defaults to volcano-db-xs).
            Determines autoscaling limits for the database.
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          default: volcano-db-xs
          example: volcano-db-xs
      required:
        - name
        - region
        - pg_version
    CreateEmailTemplateRequest:
      type: object
      properties:
        template_type:
          type: string
          enum:
            - welcome
            - confirmation
            - password_reset
            - password_changed
          description: Type of email template
        subject:
          type: string
          description: Email subject line
          example: Confirm your email
        html_body:
          type: string
          description: |
            HTML template body. Available placeholders:
            - {{.Token}} - The confirmation/reset token
            - {{.ProjectName}} - The project name
            - {{.Email}} - User's email address
        text_body:
          type: string
          description: Plain text template body (same placeholders as HTML)
      required:
        - template_type
        - subject
        - html_body
        - text_body
    CreateFrontendCustomDomainRequest:
      type: object
      properties:
        domain:
          type: string
          description: Fully-qualified domain name (hostname only, no scheme/path)
          example: app.example.com
        tls:
          $ref: '#/components/schemas/FrontendCustomDomainTLSConfig'
      required:
        - domain
        - tls
    CreateFunctionSchedulerRequest:
      type: object
      required:
        - name
        - schedule
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
          default: true
        schedule:
          $ref: '#/components/schemas/ScheduleRequest'
        payload:
          type: object
          additionalProperties: true
        regions:
          type: array
          description: Optional single explicit deployed region. If omitted, the scheduler chooses one deployed region and invokes according to the cron expression.
          maxItems: 1
          items:
            type: string
    CreateOAuthConfigRequest:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - google
            - github
            - microsoft
            - apple
            - device
          example: google
        client_id:
          type: string
          example: 123456789.apps.googleusercontent.com
          description: Required for non-device providers. Must not be provided for `provider=device`; server always auto-generates it.
        client_secret:
          type: string
          example: GOCSPX-abc123def456
          description: Required for non-device providers. Must not be provided for `provider=device`; server always auto-generates it.
        redirect_url:
          type: string
          description: Required for non-device providers. Not used for `provider=device`.
          format: uri
          example: https://yourapp.com/auth/callback
        scopes:
          type: array
          items:
            type: string
          example:
            - openid
            - email
            - profile
          description: Optional for non-device providers, uses provider defaults if omitted. Not used for `provider=device`.
    CreateProjectRequest:
      type: object
      description: Request to create a new project
      properties:
        name:
          type: string
          description: |
            Project name (must be unique).
            Can only contain letters, numbers, underscores, and hyphens.
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          maxLength: 255
          example: my-awesome-app
        all_regions:
          type: boolean
          description: |
            Optional region policy.
            - `true` (default): project functions deploy to all configured regions
            - `false`: project deploys only to `selected_regions`
          default: true
        selected_regions:
          type: array
          items:
            type: string
          description: |
            Optional region subset. Requires `all_regions=false`.
            Region names must be a subset of platform `AWS_REGIONS`.
          example:
            - us-east-1
            - us-west-2
      required:
        - name
    CreateStorageBucketRequest:
      type: object
      properties:
        name:
          type: string
          description: Bucket name (alphanumeric, dashes, underscores)
          pattern: ^[a-zA-Z0-9_-]+$
          minLength: 1
          maxLength: 64
        file_size_limit:
          type: integer
          format: int64
          description: Maximum file size in bytes
        allowed_mime_types:
          type: array
          items:
            type: string
          description: Allowed MIME types (e.g., ["image/png", "image/jpeg"])
      required:
        - name
    CreateStoragePolicyRequest:
      type: object
      properties:
        name:
          type: string
          description: Policy name
        operation:
          type: string
          enum:
            - SELECT
            - INSERT
            - UPDATE
            - DELETE
          description: Operation this policy applies to
        definition:
          type: string
          description: Policy expression
      required:
        - name
        - operation
        - definition
    CreateUploadSessionRequest:
      type: object
      description: Request to create a resumable upload session
      properties:
        object_path:
          type: string
          description: Target file path within the bucket
          example: videos/large-file.mp4
        content_type:
          type: string
          description: MIME type of the file
          example: video/mp4
        total_size:
          type: integer
          format: int64
          description: Total file size in bytes (max 5TB)
          minimum: 1
          maximum: 5497558138880
          example: 5368709120
        part_size:
          type: integer
          format: int64
          description: 'Part size in bytes (default: 25MB, min: 5MB, max: 25MB)'
          minimum: 5242880
          maximum: 26214400
          example: 26214400
      required:
        - object_path
        - content_type
        - total_size
    CreateUploadSessionResponse:
      type: object
      description: Response when creating an upload session
      properties:
        session_id:
          type: string
          description: Upload session ID
          example: session-abc123
        part_size:
          type: integer
          format: int64
          description: Actual part size to use
          example: 26214400
        total_parts:
          type: integer
          description: Number of parts to upload
          example: 52
        expires_at:
          type: string
          format: date-time
          description: When the session expires (7 days from creation)
          example: '2024-01-22T10:30:00Z'
    CreateVariableRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        value:
          type: string
      required:
        - name
        - value
    Database:
      type: object
      description: |
        PostgreSQL database with automatic scalability and security features.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Database name
          pattern: ^[a-z0-9_]+$
          maxLength: 64
        status:
          type: string
          enum:
            - provisioning
            - active
            - failed
            - restoring
            - deleting
          description: |
            Database status. `restoring` means a restore is replacing the
            database's data: it does not accept connections, and the operations
            that would race the restore are rejected until it finishes. Its
            branches keep serving throughout.
        provisioning_started_at:
          type: string
          format: date-time
          description: Timestamp when the current provisioning phase started
        connection_string:
          type: string
          description: |
            Secure PostgreSQL connection URI for your database.

            The database is identified by the globally-unique username
            (`volcano_client_{database_id}`) already in this URI; the
            `application_name` parameter only selects the access mode:
            - `volcano_full_access` — Full admin access (DDL, migrations)
            - `volcano_user_access:{user_id}` — User impersonation (RLS enforced)
            - `volcano_user_access` — Anonymous access (anon role, RLS enforced)
        region:
          type: string
          description: Region where the database is hosted
          example: aws-us-east-1
        pg_version:
          type: string
          description: PostgreSQL major version
          example: '16'
        database_type:
          type: string
          description: |
            Database size tier that determines available RAM and scaling limits.
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          example: volcano-db-xs
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Latest observed on-disk size from `pg_database_size`, in bytes. This
            point-in-time gauge may be absent until the database has been sampled.
            Summing the latest samples for every database in a project produces
            the project's "Database Storage (Bytes)" usage gauge. Populated on
            database list responses; single-database responses omit it.
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent request timestamp for this database
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - name
        - status
        - created_at
        - updated_at
    DatabaseBackup:
      type: object
      description: |
        A point-in-time copy of a database, kept by the storage provider and
        restorable in place.

        Backups cover the database itself, not its branches. Restoring one
        replaces the database's data and keeps its connection string.
      properties:
        name:
          type: string
          description: |
            Backup name, unique within the database. Backups you create are
            named by you; scheduled backups are named by the storage provider.
        source:
          type: string
          enum:
            - manual
            - scheduled
          description: |
            Whether the backup was requested explicitly or produced by the
            backup schedule. Only `manual` backups count against the plan's
            backup allowance.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Storage the backup occupies. Absent until the provider has costed
            it, which takes a few minutes after the backup is taken; absent is
            not the same as empty.
        expires_at:
          type: string
          format: date-time
          description: |
            When the backup is deleted automatically, from the plan's retention.
            Absent means it is kept until deleted explicitly.
        created_at:
          type: string
          format: date-time
          description: The point in time the backup captures.
      required:
        - name
        - source
        - created_at
    DatabaseBackupList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseBackup'
        restore_window:
          $ref: '#/components/schemas/DatabaseRestoreWindow'
      required:
        - data
    DatabaseBackupSchedule:
      type: object
      description: |
        The database's automated backup schedule. An empty list means no
        scheduled backups; sending one clears the schedule.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseBackupScheduleEntry'
      required:
        - entries
    DatabaseBackupScheduleEntry:
      type: object
      description: One recurrence of the automated backup schedule.
      properties:
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - monthly
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour of the day in UTC.
        day:
          type: integer
          minimum: 0
          maximum: 28
          description: |
            Day of the week (0-6, Sunday first) for a weekly schedule, or day of
            the month (1-28) for a monthly one. Ignored for a daily schedule.
            Monthly stops at 28 so the schedule fires in every month.
        retention_seconds:
          type: integer
          format: int64
          minimum: 3600
          description: |
            How long each backup from this recurrence is kept. Clamped to the
            plan's retention, and defaulted to it when omitted.
      required:
        - frequency
        - hour
    DatabaseBranch:
      type: object
      description: |
        A copy-on-write fork of a database, for development and testing.

        A branch starts as an exact copy of its parent's data and diverges from
        there. It has its own connection string and its own credential, so a
        branch password cannot reach the parent.

        Every branch expires. `expires_at` is a hard deadline: once it passes the
        branch stops accepting connections and is deleted. Use `PATCH` to extend
        a branch you are still working on.
      properties:
        id:
          type: string
          format: uuid
        database_id:
          type: string
          format: uuid
          description: The parent database this branch was forked from.
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Branch name, unique within the parent database.
          pattern: ^[a-z0-9_]+$
          maxLength: 64
        status:
          type: string
          enum:
            - provisioning
            - active
            - failed
            - deleting
          description: |
            Branch status. A new branch starts `provisioning` and is not
            connectable until it reports `active`; poll this endpoint until it
            does. `connection_string` is only present while `active`.

            `provisioning` also covers a branch being rebuilt after a `reset`,
            and a build that is between retries, so it is the status to keep
            waiting on. `failed` is terminal: it means the platform gave up, and
            the branch will not become `active` on its own.
        connection_string:
          type: string
          description: |
            PostgreSQL connection URI for this branch. Present only while the
            branch is `active`.

            The URI carries the branch's own globally-unique username and
            password; `application_name` selects the access mode exactly as it
            does for the parent database:
            - `volcano_full_access` — Full admin access (DDL, migrations)
            - `volcano_user_access:{user_id}` — User impersonation (RLS enforced)
            - `volcano_user_access` — Anonymous access (anon role, RLS enforced)
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          description: |
            The lifetime the branch was created with. Resetting a branch re-arms
            this same duration, so a reset never shortens a branch's remaining
            life.
        expires_at:
          type: string
          format: date-time
          description: |
            When the branch stops serving connections and becomes eligible for
            deletion. Enforced on the connection path, so it holds even if
            reclamation is delayed.
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Bytes this branch has diverged from its parent, which is what a
            branch actually costs. Shared pages are not counted twice. Counts
            against the parent database's storage allowance. Absent until the
            branch has been sampled.
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent request timestamp for this branch
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - database_id
        - project_id
        - name
        - status
        - ttl_seconds
        - expires_at
        - created_at
        - updated_at
    DatabaseBranchList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseBranch'
      required:
        - data
    DatabaseBranchStorage:
      type: object
      description: One branch's contribution to its parent database's storage.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Branch name
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Bytes this branch has diverged from its parent. Pages the branch
            still shares with the parent are not counted, so this is what the
            branch actually adds to the total rather than its apparent size.
      required:
        - id
        - name
        - storage_bytes
    DatabaseSelectRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name to query
          example: posts
        select:
          type: array
          items:
            type: string
          description: Columns to select (omit for *)
          example:
            - id
            - title
            - content
            - created_at
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseQueryFilter'
          description: WHERE conditions (combined with AND)
          example:
            - column: status
              operator: eq
              value: published
            - column: views
              operator: gt
              value: 100
        order:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseQueryOrder'
          description: ORDER BY clauses
          example:
            - column: created_at
              ascending: false
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum rows to return
          example: 10
        offset:
          type: integer
          minimum: 0
          description: Number of rows to skip (for pagination)
          example: 0
      required:
        - table
    DatabaseInsertRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name
          example: posts
        values:
          type: object
          additionalProperties: true
          description: Column values to insert
          example:
            title: My New Post
            content: This is the content
            status: draft
      required:
        - table
        - values
    DatabaseUpdateRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name
          example: posts
        values:
          type: object
          additionalProperties: true
          description: Column values to update
          example:
            title: Updated Title
            status: published
        filters:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DatabaseQueryFilter'
          description: |
            WHERE conditions for which rows to update. At least one filter is
            required; a filterless update is rejected to avoid rewriting every
            row.
          example:
            - column: id
              operator: eq
              value: post-uuid
      required:
        - table
        - values
        - filters
    DatabaseDeleteRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name
          example: posts
        filters:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DatabaseQueryFilter'
          description: WHERE conditions (required for safety)
          example:
            - column: id
              operator: eq
              value: post-uuid
      required:
        - table
        - filters
    DatabaseQueryResult:
      type: object
      description: |
        Rows returned by a data API request. RLS-filtered unless the request was
        made with a service key.
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Result rows
        count:
          type: integer
          description: Number of rows returned
    DatabaseRestore:
      type: object
      description: |
        A restore of a database, either from a named backup or to a point in
        time. Restores run in the background and take longer than a request, so
        the database is unavailable until this reports `completed`.
      properties:
        id:
          type: string
          format: uuid
        database_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - snapshot
            - point_in_time
          description: |
            Whether the restore targets a named backup or an arbitrary point in
            time. Both replace the database's data in place.
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
            - exhausted
          description: |
            Restore status. `pending` and `running` both mean the restore is
            still in flight and the database is not connectable; a `failed`
            restore is retried automatically, while `exhausted` means the
            platform gave up and the database was left `failed`.
        backup_name:
          type: string
          description: |
            The backup restored, kept even if that backup is later deleted.
            Absent for a point-in-time restore.
        restore_to:
          type: string
          format: date-time
          description: The point in time restored to. Absent for a backup restore.
        error:
          type: string
          description: Why the most recent attempt failed, when one has.
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - database_id
        - project_id
        - kind
        - status
        - created_at
        - updated_at
    DatabaseRestoreList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseRestore'
      required:
        - data
    DatabaseRestoreWindow:
      type: object
      description: |
        The span a point-in-time restore may target. Empty when the owner's plan
        does not include point-in-time restore.
      properties:
        earliest_restore_at:
          type: string
          format: date-time
          description: |
            The oldest point that can still be restored. Moves forward
            continuously as history ages out, so treat it as a lower bound at
            the moment it was read rather than a fixed value.
        latest_restore_at:
          type: string
          format: date-time
          description: The most recent point that can be restored, which is now.
    DatabaseStats:
      type: object
      properties:
        current_storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            On-disk size right now, in bytes: the database itself plus every
            branch's divergence from it. This is the figure the storage
            allowance is enforced against. `branches` breaks it down.
        current_storage_mb:
          type: number
          format: double
          minimum: 0
          description: '`current_storage_bytes` expressed in megabytes.'
        branches:
          type: array
          description: |
            Per-branch contribution to `current_storage_bytes`. Empty when the
            database has no branches. A branch that has not diverged from its
            parent contributes nothing.
          items:
            $ref: '#/components/schemas/DatabaseBranchStorage'
        storage_bytes:
          type: integer
          format: int64
          description: Total storage used in bytes (data + WAL)
        data_written_bytes:
          type: integer
          format: int64
          description: Total data written in bytes
        data_transfer_bytes:
          type: integer
          format: int64
          description: Total data transferred in bytes
        compute_time_seconds:
          type: number
          format: double
          description: Total CPU seconds consumed
        active_time_seconds:
          type: number
          format: double
          description: Total active compute time in seconds
        time_range:
          type: string
          description: Time range of the metrics (e.g., "2024-01-01T00:00:00Z to 2024-01-02T00:00:00Z")
        granularity:
          type: string
          enum:
            - hourly
            - daily
            - monthly
          description: Granularity of the aggregated metrics
      required:
        - current_storage_bytes
        - current_storage_mb
        - storage_bytes
        - data_written_bytes
        - data_transfer_bytes
        - compute_time_seconds
        - active_time_seconds
