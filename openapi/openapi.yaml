          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}:
    get:
      tags:
        - Databases
      summary: Get database details
      operationId: getDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
    delete:
      tags:
        - Databases
      summary: Delete a database
      description: |
        Deletes a database and its backing Neon project. When the Neon project is
        removed synchronously the database row is deleted and the response is
        `204`. If the Neon project cannot be deleted right away, the database row
        is retained (status `deleting`) and its teardown is handed to the
        background reconciler, which retries the Neon deletion and removes the row
        once Neon is gone; in that case the response is `202`. The database row is
        never dropped while its Neon project still exists, so a Neon project is
        never orphaned without a record to retry from.
      operationId: deleteDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '202':
          description: |
            Deletion accepted and in progress. The Neon project could not be
            removed synchronously, so the database is marked `deleting` and torn
            down asynchronously by the reconciler.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleting
                  message:
                    type: string
                    example: database deletion in progress
        '204':
          description: Database deleted (Neon project removed synchronously)
  /projects/{id}/databases/{databaseName}/reset-password:
    post:
      tags:
        - Databases
      summary: Reset database password
      description: |
        Rotates the Volcano-managed PostgreSQL password used by clients when connecting
        through pgproxy. This does not rotate or expose the internal Neon owner password.
        The returned password and connection string are the only client credentials that
        will authenticate through pgproxy after reset.
      operationId: resetDatabasePassword
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  role_name:
                    type: string
                    description: Volcano-managed per-database client login (also the pgproxy routing username)
                    example: volcano_client_11111111-1111-1111-1111-111111111111
                  new_password:
                    type: string
                    description: New Volcano-managed client password. Always starts with `vpg_`.
                    example: vpg_qv3Y4GQwHcklV4G76ZcKhZW-rmZLQktEORHnGqU0Bpk
                  connection_string:
                    type: string
                    description: Updated pgproxy connection string using Volcano-managed credentials.
                    example: postgresql://volcano_client_11111111-1111-1111-1111-111111111111:vpg_qv3Y4GQwHcklV4G76ZcKhZW-rmZLQktEORHnGqU0Bpk@database.volcano.dev:5432/mydb?sslmode=require&application_name=volcano_full_access
  /projects/{id}/databases/{databaseName}/type:
    patch:
      tags:
        - Databases
      summary: Update database size
      description: |
        Change the size tier of a database. This may briefly interrupt active connections.

        **Available sizes:**
        - `volcano-db-xs`: Up to ~1GB RAM - Development, small apps
        - `volcano-db-s`: Up to ~4GB RAM - Production-ready, light traffic
        - `volcano-db-m`: Up to ~8GB RAM - Medium traffic applications
        - `volcano-db-l`: Up to ~16GB RAM - High traffic, larger datasets
        - `volcano-db-xl`: Up to ~32GB RAM - Heavy workloads
        - `volcano-db-2xl`: Up to ~64GB RAM - Enterprise-scale
      operationId: updateDatabaseType
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseTypeRequest'
      responses:
        '200':
          description: Database type updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          description: Invalid database type
        '404':
          description: Database not found
  /projects/{id}/databases/{databaseName}/stats:
    get:
      tags:
        - Databases
      summary: Get database consumption metrics
      description: |
        Retrieve consumption metrics including storage, compute time, and data transfer.
        Metrics are aggregated at the project level. Defaults to last 24 hours.

        **Note:** Advanced metrics require an upgraded plan.
      operationId: getDatabaseStats
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start time in RFC3339 format (e.g., "2024-01-01T00:00:00Z"). Defaults to 24 hours ago.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End time in RFC3339 format (e.g., "2024-01-02T00:00:00Z"). Defaults to now.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum:
              - hourly
              - daily
              - monthly
            default: hourly
          description: Level of detail for metrics aggregation
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStats'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database metrics not available or requires upgraded plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /databases/{databaseName}/query/ping:
    post:
      tags:
        - Database Queries
      summary: Database connectivity probe (REST API)
      description: |
        Connectivity probe that runs a fixed `SELECT 1` through pgproxy, using the
        same authentication, status/bandwidth gating, and metering as the other
        `/query/*` endpoints.

        Unlike those endpoints, ping takes **no request body** and performs **no
        table-name validation**, so it works on any database — including a freshly
        provisioned, empty one. It is a real committed round-trip through pgproxy,
        so a `200` means the database is reachable and queryable. Used by the
        dashboard's database connection test.
      operationId: queryDatabasePing
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Result rows of the probe query
                  count:
                    type: integer
                    description: Number of rows returned
              example:
                data:
                  - '?column?': 1
                count: 1
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/query/select:
    post:
      tags:
        - Database Queries
      summary: Query database with SELECT (REST API)
      description: |
        Query your database using a simple REST API - no SQL required!

        **Authentication:** Requires auth user access token (from signup/signin)

        **Row-Level Security:** Automatically enforced - you see only data you have access to

        **Use Cases:**
        - Query from browser/mobile apps
        - Simple data retrieval
        - Filtered searches with sorting and pagination

        **Note:** For complex queries (JOINs, CTEs), use Lambda functions with direct SQL
      operationId: queryDatabaseSelect
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - table
              properties:
                table:
                  type: string
                  description: Table name to query
                  example: posts
                select:
                  type: array
                  items:
                    type: string
                  description: Columns to select (omit for *)
                  example:
                    - id
                    - title
                    - content
                    - created_at
                filters:
                  type: array
                  items:
                    type: object
                    required:
                      - column
                      - operator
                      - value
                    properties:
                      column:
                        type: string
                        example: status
                      operator:
                        type: string
                        enum:
                          - eq
                          - neq
                          - gt
                          - gte
                          - lt
                          - lte
                          - like
                          - ilike
                          - is
                          - in
                        example: eq
                        description: |
                          Filter operators:
                          - eq: equals (=)
                          - neq: not equals (<>)
                          - gt: greater than (>)
                          - gte: greater than or equal (>=)
                          - lt: less than (<)
                          - lte: less than or equal (<=)
                          - like: pattern match (LIKE)
                          - ilike: case-insensitive pattern match (ILIKE)
                          - is: IS NULL / IS NOT NULL
                          - in: IN array
                      value:
                        oneOf:
                          - type: string
                            nullable: true
                          - type: number
                          - type: boolean
                          - type: array
                            description: Array of values for IN (...) queries
                            items:
                              oneOf:
                                - type: string
                                - type: number
                                - type: boolean
                        example: published
                  description: WHERE conditions (combined with AND)
                  example:
                    - column: status
                      operator: eq
                      value: published
                    - column: views
                      operator: gt
                      value: 100
                order:
                  type: array
                  items:
                    type: object
                    required:
                      - column
                    properties:
                      column:
                        type: string
                        example: created_at
                      ascending:
                        type: boolean
                        default: true
                        example: false
                      nulls_first:
                        type: boolean
                        default: false
                  description: ORDER BY clauses
                  example:
                    - column: created_at
                      ascending: false
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Maximum rows to return
                  example: 10
                offset:
                  type: integer
                  minimum: 0
                  description: Number of rows to skip (for pagination)
                  example: 0
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Array of result rows (automatically filtered by RLS)
                  count:
                    type: integer
                    description: Number of rows returned
              example:
                data:
                  - id: uuid-123
                    title: My Post
                    content: Post content
                    status: published
                    views: 150
                    created_at: '2026-01-13T10:00:00Z'
                count: 1
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/query/insert:
    post:
      tags:
        - Database Queries
      summary: Insert data into database (REST API)
      description: |
        Insert new rows into your database using REST API.

        **Authentication:** Requires auth user access token

        **Auto-set user_id:** If your table has a trigger using `auth.uid()`,
        user_id will be automatically set to the authenticated user

        **Security:** Row-Level Security policies are enforced
      operationId: queryDatabaseInsert
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - table
                - values
              properties:
                table:
                  type: string
                  description: Table name
                  example: posts
                values:
                  type: object
                  additionalProperties: true
                  description: Column values to insert
                  example:
                    title: My New Post
                    content: This is the content
                    status: draft
      responses:
        '200':
          description: Insert successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Inserted row(s) with all columns
                  count:
                    type: integer
              example:
                data:
                  - id: uuid-123
                    title: My New Post
                    content: This is the content
                    status: draft
                    user_id: user-uuid
                    created_at: '2026-01-13T10:00:00Z'
                count: 1
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - database does not belong to this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/query/update:
    post:
      tags:
        - Database Queries
      summary: Update data in database (REST API)
      description: |
        Update existing rows in your database using REST API.

        **Security:** Row-Level Security ensures you can only update data you have access to

        **Safety:** Requires at least one filter to prevent accidental mass updates. A
        request with no `filters` is rejected with `400` (mirrors delete). This matters
        for service-key queries, which run with full access and bypass RLS.

        **Note:** If RLS blocks the update, an empty result is returned (not an error)
      operationId: queryDatabaseUpdate
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - table
                - values
                - filters
              properties:
                table:
                  type: string
                  description: Table name
                  example: posts
                values:
                  type: object
                  additionalProperties: true
                  description: Column values to update
                  example:
                    title: Updated Title
                    status: published
                filters:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - column
                      - operator
                      - value
                    properties:
                      column:
                        type: string
                      operator:
                        type: string
                        enum:
                          - eq
                          - neq
                          - gt
                          - gte
                          - lt
                          - lte
                          - like
                          - ilike
                          - is
                          - in
                      value:
                        oneOf:
                          - type: string
                          - type: number
                          - type: boolean
                  description: |
                    WHERE conditions for which rows to update. At least one filter
                    is required; a filterless update is rejected to avoid rewriting
                    every row.
                  example:
                    - column: id
                      operator: eq
                      value: post-uuid
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Updated row(s). Empty if RLS blocked the update.
                  count:
                    type: integer
              example:
                data:
                  - id: post-uuid
                    title: Updated Title
                    status: published
                    updated_at: '2026-01-13T10:05:00Z'
                count: 1
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - database does not belong to this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/query/delete:
    post:
      tags:
        - Database Queries
      summary: Delete data from database (REST API)
      description: |
        Delete rows from your database using REST API.

        **Safety:** Requires at least one filter to prevent accidental mass deletions

        **Security:** Row-Level Security ensures you can only delete data you have access to

        **Note:** If RLS blocks the delete, an empty result is returned (not an error)
      operationId: queryDatabaseDelete
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - table
                - filters
              properties:
                table:
                  type: string
                  description: Table name
                  example: posts
                filters:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - column
                      - operator
                      - value
                    properties:
                      column:
                        type: string
                      operator:
                        type: string
                        enum:
                          - eq
                          - neq
                          - gt
                          - gte
                          - lt
                          - lte
                          - like
                          - ilike
                          - is
                          - in
                      value:
                        oneOf:
                          - type: string
                          - type: number
                          - type: boolean
                  description: WHERE conditions (required for safety)
                  example:
                    - column: id
                      operator: eq
                      value: post-uuid
      responses:
        '200':
          description: Delete successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Deleted row(s). Empty if RLS blocked the delete.
                  count:
                    type: integer
              example:
                data:
                  - id: post-uuid
                    title: Deleted Post
                count: 1
        '400':
          description: Invalid request or missing filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - database does not belong to this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/regions:
