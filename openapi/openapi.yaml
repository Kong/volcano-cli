  /projects/{id}/databases:
    get:
      tags:
        - Databases
      summary: List all databases for a project
      description: |
        Supports two mutually exclusive pagination modes. Offset mode uses `page`
        and `limit`. Cursor mode uses `cursor` and `limit`, supports `search`
        (case-insensitive name match), and returns `next_cursor`/`prev_cursor`.
        The optional `status` filter applies in both modes and is bound to the
        cursor. Sending both `page` and `cursor` (or `page` and `search`) returns 400.
      operationId: listDatabases
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatabases'
    post:
      tags:
        - Databases
      summary: Create a new serverless PostgreSQL database
      description: |
        Creates a serverless PostgreSQL database in the project.
        Each project can contain up to 100 databases. Requests over this cap return 403.
      operationId: createDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '201':
          description: Database created (provisioning)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '403':
          description: Database limit exceeded for the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}:
    get:
      tags:
        - Databases
      summary: Get database details
      operationId: getDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
    delete:
      tags:
        - Databases
      summary: Delete a database
      description: |
        Deletes a database and the instance backing it. When the instance is
        removed synchronously the database row is deleted and the response is
        `204`. If the instance cannot be deleted right away, the database row
        is retained (status `deleting`) and its teardown is handed to the
        background reconciler, which retries the deletion and removes the row
        once the instance is gone; in that case the response is `202`. The database row is
        never dropped while its instance still exists, so an instance is
        never orphaned without a record to retry from.
      operationId: deleteDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '202':
          description: |
            Deletion accepted and in progress. The backing instance could not be
            removed synchronously, so the database is marked `deleting` and torn
            down asynchronously by the reconciler.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleting
                  message:
                    type: string
                    example: database deletion in progress
        '204':
          description: Database deleted (backing instance removed synchronously)
  /projects/{id}/databases/{databaseName}/branches:
    get:
      tags:
        - Database Branches
      summary: List a database's branches
      description: |
        Returns every branch of the database, including those still provisioning
        and those that failed, since each still holds a name.

        Connection strings are omitted. Fetch a single branch to get its
        connection string.
      operationId: listDatabaseBranches
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranchList'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Database Branches
      summary: Create a branch of a database
      description: |
        Forks the database into a new branch. The branch starts as an exact copy
        of the parent's data and diverges from there.

        Provisioning is asynchronous: the response is `202` with the branch in
        `provisioning` and no connection string. Poll the branch until it reports
        `active`, at which point it carries its own connection string.

        Retrying a create with a name that already exists returns `409` rather
        than a second branch, so a retried request cannot silently consume two
        slots of the branch allowance.
      operationId: createDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseBranchRequest'
      responses:
        '202':
          description: Branch accepted and provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '400':
          description: Invalid branch name or lifetime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The database has reached its branch allowance, or the owner's plan
            does not include branching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            A branch of that name already exists on this database, or the
            database cannot be branched right now because it is still
            provisioning, failed, or being deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/branches/{branchName}:
    get:
      tags:
        - Database Branches
      summary: Get a branch
      description: |
        Returns the branch, including its connection string once it is `active`.
        Poll this after creating a branch to learn when it is connectable.
      operationId: getDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Database Branches
      summary: Extend a branch's lifetime
      description: |
        Replaces the branch's lifetime and restarts the countdown from now, so a
        branch you are still working on is not swept mid-session. The new
        duration is remembered, so a later reset re-arms the same lifetime.
      operationId: updateDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseBranchRequest'
      responses:
        '200':
          description: Lifetime updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '400':
          description: Requested lifetime is outside the allowed range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The branch is being deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Database Branches
      summary: Delete a branch
      description: |
        Marks the branch for teardown and returns immediately. The branch stops
        accepting connections at once; its fork and its row are removed by a
        background job, so a provider outage cannot leave the call hanging or the
        branch half-deleted.

        Deleting a branch that is still provisioning is allowed and stops the
        build. Deleting a branch that is already gone succeeds.
      operationId: deleteDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '202':
          description: Deletion accepted and in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleting
                  message:
                    type: string
                    example: branch deletion in progress
                required:
                  - status
                  - message
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/branches/{branchName}/reset:
    post:
      tags:
        - Database Branches
      summary: Reset a branch to its parent's current state
      description: |
        Discards everything written on the branch and re-forks it from the
        parent as it is now.

        Returns immediately with the branch in `provisioning`. The rewind runs in
        the background; poll the branch until it reports `active` before
        connecting again.

        The branch keeps its name and its connection string, so anything holding
        that string keeps working once it is active again, and its lifetime is
        re-armed to the duration it was created with. The branch does not serve
        connections for the duration of the reset.
      operationId: resetDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '202':
          description: Branch reset accepted; the branch is provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The branch is not active, or a reset is already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/branches/{branchName}/reset-password:
    post:
      tags:
        - Database Branches
      summary: Rotate a branch's password
      description: |
        Issues a new password for the branch and invalidates the previous
        connection string. Existing connections are not interrupted; new ones
        must use the returned string.

        The parent database's credentials are untouched.
      operationId: resetDatabaseBranchPassword
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Password rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The branch is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/backups:
    get:
      tags:
        - Database Backups
      summary: List a database's backups
      description: |
        Returns every backup of the database, newest first, together with the
        window a point-in-time restore may target.

        Both backups you took and backups the schedule produced are listed;
        `source` tells them apart. Only manual backups count against the plan's
        backup allowance.
      operationId: listDatabaseBackups
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackupList'
        '403':
          description: The owner's plan does not include backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The database has no storage project yet, so there is nothing to
            list. A database reports this while it is still provisioning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Database Backups
      summary: Back up a database
      description: |
        Captures the database as it is now. The backup is available immediately;
        its `size_bytes` appears once the storage provider has costed it.

        Backups are rate-limited to one per minute per database, and capped by
        the owner's plan.
      operationId: createDatabaseBackup
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseBackupRequest'
      responses:
        '201':
          description: Backup created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackup'
        '400':
          description: Invalid backup name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The database has reached its backup allowance, or the owner's plan
            does not include backups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            A backup of that name already exists, the database is not active, or
            a backup was taken too recently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/backups/{backupName}:
    get:
      tags:
        - Database Backups
      summary: Get a backup
      description: Returns one backup of the database.
      operationId: getDatabaseBackup
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BackupName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackup'
        '403':
          description: The owner's plan does not include backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project, database, or backup not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The database has no storage project yet, so it holds no backups. A
            database reports this while it is still provisioning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Database Backups
      summary: Delete a backup
      description: |
        Deletes the backup and frees its storage. Scheduled backups can be
        deleted too. A backup that is already gone reports `404`, so a name
        that never existed and a name that no longer does read the same.

        Refused with `409` while the database is being restored.
      operationId: deleteDatabaseBackup
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BackupName'
      responses:
        '200':
          description: Backup deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  message:
                    type: string
                    example: backup deleted
                required:
                  - status
                  - message
        '403':
          description: The owner's plan does not include backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project, database, or backup not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The database is being restored. A restore is pinned to a backup it
            may not have restored yet, so deleting one is refused until the
            restore finishes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/backup-schedule:
    get:
      tags:
        - Database Backups
      summary: Get the automated backup schedule
      description: |
        Returns the database's backup schedule. An empty list means no scheduled
        backups.
      operationId: getDatabaseBackupSchedule
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackupSchedule'
        '403':
          description: The owner's plan does not include backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The database has no storage project yet, so it has no schedule. A
            database reports this while it is still provisioning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Database Backups
      summary: Replace the automated backup schedule
      description: |
        Replaces the schedule wholesale. Send an empty `entries` list to stop
        scheduled backups.

        Scheduled backups do not count against the plan's backup allowance, but
        their retention is clamped to the plan's.
      operationId: updateDatabaseBackupSchedule
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseBackupSchedule'
      responses:
        '200':
          description: Schedule replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackupSchedule'
        '400':
          description: Invalid schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The owner's plan does not include backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The database is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/restores:
    get:
      tags:
        - Database Backups
      summary: List a database's restores
      description: Returns the database's restore history, newest first.
      operationId: listDatabaseRestores
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseRestoreList'
        '403':
          description: The owner's plan does not include backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Database Backups
      summary: Restore a database
      description: |
        Replaces the database's data, either with a named backup or with its
        state at a point in time. This is destructive: everything written after
        that point is discarded.

        Asynchronous: the response is `202` with the restore `pending` and the
        database `restoring`. The database does not accept connections until the
        restore reports `completed`; its connection string is unchanged
        throughout, so nothing holding it needs updating.

        Restores are in place. There is no way to restore into a second
        database, and a database's branches are never restored — they keep
        serving their own data, but resetting a branch from its parent is
        refused by the storage provider for up to 24 hours afterwards.
      operationId: createDatabaseRestore
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRestoreRequest'
      responses:
        '202':
          description: Restore accepted and in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseRestore'
        '400':
          description: |
            Neither or both restore targets were named, or the requested time is
            outside the available window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The owner's plan does not include backups, or does not include
            point-in-time restore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project, database, or backup not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            A restore is already in progress, the database is not active,
            another database operation is still running, or the database is
            holding as many pre-restore branches as it may.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Backups are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/restores/{restoreId}:
    get:
      tags:
        - Database Backups
      summary: Get a restore
      description: |
        Returns the restore. Poll this after starting one; the database is
        connectable again once it reports `completed`.
      operationId: getDatabaseRestore
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/RestoreId'
      responses:
