  /storage/{bucketName}/{path}:
    post:
      tags:
        - Storage Objects
      summary: Upload a file or create resumable session
      description: |
        Unified endpoint for file uploads. Behavior depends on Content-Type and headers:

        **Simple Upload (multipart/form-data):**
        Upload a complete file in a single request. Best for files under 100MB.

        **Create Resumable Session (application/json):**
        Create a session for chunked uploads. Best for large files or unreliable networks.
        Requires: `Content-Type: application/json` with body `{"filename": "...", "content_type": "...", "total_size": ...}`

        **Complete Resumable Session:**
        Complete a session after all parts are uploaded.
        Requires: `X-Upload-Session` header with session ID and `X-Upload-Complete: true` header.
      operationId: uploadStorageObject
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: X-Upload-Session
          in: header
          required: false
          description: Upload session ID (for completing resumable uploads)
          schema:
            type: string
        - name: X-Upload-Complete
          in: header
          required: false
          description: Set to "true" to complete a resumable upload session
          schema:
            type: string
            enum:
              - 'true'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (simple upload)
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
      responses:
        '200':
          description: Resumable upload completed (when X-Upload-Complete=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadSessionResponse'
        '201':
          description: File uploaded or session created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StorageObject'
                  - $ref: '#/components/schemas/CreateUploadSessionResponse'
        '400':
          description: |
            Bad request. This can occur when:
            - MIME type is not in the bucket's allowed_mime_types list
            - File exceeds the bucket's configured file_size_limit
            - File exceeds the global maximum upload size (5GB)
            - Invalid request body or missing required fields
        '403':
          description: Access denied by storage policy
        '413':
          description: |
            File size exceeds plan-based limits. This occurs when:
            - File exceeds the plan-based maximum file size (FREE or PRO tier)
            - Upload would exceed the project's total storage quota
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
    put:
      tags:
        - Storage Objects
      summary: Upload a part of a resumable upload
      description: |
        Upload a single part of a resumable upload session.

        **Requirements:**
        - Part numbers start at 1
        - All parts except the last must be at least 5MB
        - Maximum part size is 25MB
        - Parts can be uploaded in any order
        - Re-uploading a part overwrites the previous upload
      operationId: uploadPart
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: X-Upload-Session
          in: header
          required: true
          description: Upload session ID
          schema:
            type: string
        - name: X-Part-Number
          in: header
          required: true
          description: Part number (1 to 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Part uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionPart'
        '400':
          description: Invalid part number or part data
        '403':
          description: Access denied
        '404':
          description: Session not found
    get:
      tags:
        - Storage Objects
      summary: Download a file or get upload session status
      description: |
        Download a file, or get the status of a resumable upload session.

        **File Download (default):**
        Downloads the file at the specified path.

        **Session Status (with X-Upload-Session header):**
        Returns the status of a resumable upload session, including which parts have been uploaded.
      operationId: downloadStorageObject
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: |
            HTTP Range header for partial downloads.
            Format: bytes=start-end or bytes=start-
            Examples: bytes=0-1023, bytes=1000-
          schema:
            type: string
            pattern: ^bytes=\d+-\d*$
        - name: X-Upload-Session
          in: header
          required: false
          description: Upload session ID (to get session status instead of downloading)
          schema:
            type: string
      responses:
        '200':
          description: File content or session status
          headers:
            Content-Type:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionStatusResponse'
        '206':
          description: Partial content (range request)
        '400':
          description: Invalid Range header format
        '403':
          description: Access denied by storage policy
        '404':
          description: Object or session not found
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
    delete:
      tags:
        - Storage Objects
      summary: Delete a file or abort upload session
      description: |
        Delete a file, or abort a resumable upload session.

        **File Delete (default):**
        Deletes the file at the specified path.

        **Abort Session (with X-Upload-Session header):**
        Aborts a resumable upload session and cleans up any uploaded parts.
      operationId: deleteStorageObject
      security:
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: X-Upload-Session
          in: header
          required: false
          description: Upload session ID (to abort session instead of deleting file)
          schema:
            type: string
      responses:
        '200':
          description: Object deleted or session aborted
        '403':
          description: Access denied by storage policy
        '404':
          description: Object or session not found
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
  /storage/{bucketName}/{path}/visibility:
    patch:
      tags:
        - Storage Objects
      summary: Update file visibility (public/private)
      description: |
        Change whether a file is publicly accessible. Only the file owner or a service key can change visibility.
        If the bucket defines UPDATE policies, the owner must also satisfy one of them.

        - Public files can be downloaded with just an anon key (no user authentication required)
        - Private files (default) require authentication and must pass policy checks
        - All downloads go through the Volcano API - there is no direct access to the underlying store
      operationId: updateStorageObjectVisibility
      security:
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageVisibilityRequest'
      responses:
        '200':
          description: Visibility updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
        '403':
          description: Not the file owner or denied by the bucket's UPDATE policies
        '404':
          description: Object not found
  /public/{projectId}/{bucketName}/{path}:
    get:
      tags:
        - Storage Objects
      summary: Download a public file (no authentication required)
      description: |
        Download a file that has been marked as public. This endpoint requires NO authentication.

        **Access Requirements:**
        - The file must have `is_public: true` set via the visibility endpoint
        - Private files will return 403 Forbidden

        **Use Cases:**
        - Shareable public URLs for profile pictures, public documents, etc.
        - Embedding public files on external websites
        - Direct linking without requiring SDK or authentication

        **URL Format:**
        ```
        GET /public/{projectId}/{bucketName}/{path}
        ```

        **Example:**
        ```
        https://api.volcano.dev/public/abc123/avatars/user-photo.jpg
        ```

        **CORS:**
        This endpoint allows all origins since the file is already public.
      operationId: downloadPublicFile
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
      responses:
        '200':
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (range request)
        '404':
          description: Not found (file doesn't exist or is not public)
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns server health status. Used for load balancer and monitoring checks.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK
components:
  securitySchemes:
    AnonKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Project-specific public key for frontend authentication.
        Required for signup, signin, refresh, and logout endpoints.
        Get from Project Settings → Authentication → Anon Keys.
        Safe to expose in frontend code (scoped to project, limited permissions).
    AuthUserAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Auth user access token obtained from signup/signin.
        Used for authenticated function invocation and user profile access.
        Functions invoked with access tokens receive user context in event.__volcano_auth.
        Expires after configured lifetime (default: 1 hour).
    ServiceRoleKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service role key for admin operations.
        **WARNING:** Bypasses Row-Level Security - backend use only!
        Create via POST /projects/{id}/service-keys.
        Used for function invocation with full database access.
    UserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Platform user token from the Management API.
        Required for project management operations.
        Obtain via POST /tokens in Management API (port 8001).
  parameters:
    BackupName:
      name: backupName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
        maxLength: 63
      description: |
        Backup name, unique within the database. Hyphens are allowed here but not
        in database or branch names, because scheduled backups are named by the
        storage provider and use them.
    BranchName:
      name: branchName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9_]+$
        maxLength: 64
      description: Branch name (unique within the parent database, lowercase letters, numbers, and underscores only)
    BucketName:
      name: bucketName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]+$
        minLength: 1
        maxLength: 64
      description: Storage bucket name
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |
        Opaque keyset pagination cursor from a previous response's `next_cursor`
        — pages forward. Mutually exclusive with `page` and `ending_before`;
        combining them returns 400. When supplied, the request's `search` and
        `limit` must match the values bound to the cursor or the request returns 400.
    EndingBefore:
      name: ending_before
      in: query
      required: false
      schema:
        type: string
      description: |
        Opaque keyset pagination cursor from a previous response's `prev_cursor`
        — pages backward (the page immediately preceding this cursor). Mutually
        exclusive with `page` and `cursor`; combining them returns 400. `search`
        and `limit` must match the values bound to the cursor or the request
        returns 400.
    DatabaseName:
      name: databaseName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9_]+$
        maxLength: 64
      description: Database name (unique within project, lowercase letters, numbers, and underscores only)
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Frontend deployment ID
    FrontendId:
      name: frontendId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Frontend ID
    FunctionId:
      name: functionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Function ID
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of items per page (max 100)
    LockKey:
      name: key
      in: path
      required: true
      description: Project-local lock name.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    LockToken:
      name: X-Volcano-Lock-Token
      in: header
      required: true
      description: Opaque UUID generated once by the caller and retained for the lease lifetime.
      schema:
        type: string
        format: uuid
    LockRequestId:
      name: X-Volcano-Request-Id
      in: header
      required: true
      description: |
        UUID correlating this request across client and server logs. Repeat safety comes from
        the lock token, so a retry under a reused request ID still counts against the quota.
      schema:
        type: string
        format: uuid
    DeploymentOperation:
      name: operation
      in: query
      required: false
      description: Restrict a deployment feed to one kind of operation.
      schema:
        type: string
        enum:
          - deploy
          - redeploy
          - update
          - delete
    DeploymentOwnerId:
      name: owner_id
      in: query
      required: false
      description: |
        The user who owns the projects whose deployments to return
        (`projects.user_id`). This is ownership, not the actor that started the
        deployment — see `initiated_by_user_id` for that. Not a UUID: platform
        user ids are opaque strings.
      schema:
        type: string
        maxLength: 255
    DeploymentOrder:
      name: order
      in: query
      required: false
      description: |
        Sort key and direction. `created_at.desc` (default) is the feed order.
        `completed_at.asc` orders finished attempts by completion, oldest first,
        and excludes attempts that never completed.
      schema:
        type: string
        enum:
          - created_at.desc
          - completed_at.asc
        default: created_at.desc
    DeploymentResourceType:
      name: resource_type
      in: query
      required: false
      description: |
        Restrict a deployment feed to a single resource type. Omit to return
        both Function and Frontend deployments.
      schema:
        type: string
        enum:
          - function
          - frontend
    DeploymentStatus:
      name: status
      in: query
      required: false
      description: Restrict a deployment feed to attempts in one status.
      schema:
        type: string
        enum:
          - queued
          - provisioning
          - active
          - degraded
          - failed
          - superseded
          - deleting
          - deleted
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: |
        Bounded row offset past the keyset anchor named by `cursor` (forward) or
        `ending_before` (backward) — the hybrid jump. Seek to the anchor, then
        skip this many rows within. Used for numbered jump-to-page: from the
        current page, seek to its next/prev cursor and offset the remaining
        pages. Only honored on the cursor pagination path; ignored otherwise.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: |
        Page number (1-indexed) for offset pagination. Declares no schema
        default so the request validator does not inject one: handlers that omit
        `page` see it unset (nil) and default to 1 in code, while cursor-first
        endpoints (e.g. the project deployments feed) can detect its absence to
        stay in keyset/search mode. Supplying `page` selects offset pagination.
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project ID
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
      description: |
        Case-insensitive substring match on the resource `name`. See the
        endpoint description for supported pagination modes.
    RestoreId:
      name: restoreId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Database restore ID
    SchedulerId:
      name: schedulerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Function scheduler ID
    VariableName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
      description: Variable name
  responses:
    BandwidthCapExceeded:
      description: |
        The platform user exceeded their monthly bandwidth cap (aggregate
        ingress + egress across owned projects). Enforcement is eventual:
        requests are rejected until the cap increases (plan/override) or the
        calendar-month meter resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DatabaseQueryCapExceeded:
      description: |
        The query was rejected by a monthly usage cap: either the platform user's
        bandwidth cap (aggregate ingress + egress across owned projects) or the
        project's monthly database-request cap. Enforcement is eventual: queries
        are rejected until the relevant cap increases (plan/override) or the
        calendar-month meter resets. The error message identifies which cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AnonKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        key_value:
          type: string
          description: JWT token - use this in frontend Authorization header
        permissions:
          type: array
          items:
            type: string
          description: |
            Permissions granted to this anon key.
            Auth permissions: auth.signup, auth.signin, auth.refresh, auth.logout, auth.password_reset, auth.confirm_email, auth.resend_confirmation
            Storage permissions: storage.upload, storage.download, storage.list, storage.delete
            Realtime permissions: realtime.connect, realtime.subscribe, realtime.publish
            Functions permissions: functions.invoke
          example:
            - auth.signup
            - auth.signin
            - auth.refresh
            - auth.logout
        is_default:
          type: boolean
          description: Whether this is the project's configured default anon key. Only one key per project can be default.
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - key_value
    AuthConfig:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        access_token_lifetime:
          type: integer
          description: Access token lifetime in seconds
          default: 3600
        refresh_token_lifetime:
          type: integer
          description: Refresh token lifetime in seconds
          default: 2592000
        inactivity_timeout:
          type: integer
          description: Force re-login after inactivity (seconds, 0=never)
          default: 0
        max_session_duration:
          type: integer
          description: Force re-login after duration (seconds, 0=never)
          default: 0
        min_password_length:
          type: integer
          minimum: 15
          maximum: 128
          default: 15
          description: Configured minimum password length in Unicode characters.
        password_policy:
          $ref: '#/components/schemas/AuthPasswordPolicy'
        require_uppercase:
          type: boolean
          default: false
        require_lowercase:
          type: boolean
          default: false
        require_numbers:
          type: boolean
          default: false
        require_special_chars:
          type: boolean
          default: false
        enable_signup:
          type: boolean
          description: Master switch - allow new user signups via ANY provider
          default: true
        enable_email_password:
          type: boolean
          description: Enable email/password authentication as a provider
          default: true
        rate_limit_signup:
          type: integer
          description: Signups per hour per IP
          default: 100
        rate_limit_signin:
          type: integer
          description: Signins per hour per IP
          default: 100
        rate_limit_token_refresh:
          type: integer
          description: Refreshes per hour per IP
          default: 1000
        cors_enabled:
          type: boolean
          default: false
        cors_allowed_origins:
          type: array
          items:
            type: string
          example:
            - https://myapp.com
            - http://localhost:3000
        enable_anonymous_signins:
          type: boolean
          description: Allow creating users without email/password
          default: false
        allowed_email_domains:
          type: array
          description: |
            Email domains allowed to create users in this project. Applies to
            email/password signup, OAuth/SSO signup, anonymous conversion, and
            email changes. Empty (the default) allows every domain.

            Entries are stored normalized (lowercase, no `@` prefix) and match
            the domain part exactly: `domain1.com` does not cover
            `mail.domain1.com`. Signups from other domains are rejected with
            403, and `allowed_email_domains_mode` decides whether sign-in is
            covered as well.

            The allowlist is a PRO feature to configure and to enforce. A
            downgrade parks it: the domains are still returned here and stop
            being applied until the project is back on PRO.
          items:
            type: string
          example:
            - domain1.com
            - domain2.com
        allowed_email_domains_mode:
          type: string
          description: |
            How far `allowed_email_domains` reaches. `signup` only gates account
            creation, so accounts that predate the list keep signing in.
            `signup_and_signin` also refuses to issue a session to an account
            whose domain is not listed. `disabled` keeps the list without
            enforcing it.
          enum:
            - disabled
            - signup
            - signup_and_signin
          default: signup
        platform_token_ttl:
          type: integer
          description: TTL in seconds for platform tokens minted via `/auth/platform/exchange`
          default: 2592000
        allow_password_reset:
          type: boolean
          description: Enable forgot password flow
          default: true
        password_reset_timeout:
          type: integer
          description: Recovery token expiry in seconds
          default: 3600
        max_password_history:
          type: integer
          description: Number of previous passwords to remember (0=disabled)
          default: 0
        cors_allow_credentials:
          type: boolean
          description: Allow credentials in CORS requests
          default: true
        cors_max_age:
          type: integer
          description: CORS preflight cache duration (seconds)
          default: 86400
        require_email_confirmation:
          type: boolean
          description: Require users to confirm email before sign-in. Can only be true when email_enabled is true.
          default: false
        email_confirmation_timeout:
          type: integer
          description: Email confirmation token expiry in seconds.
          default: 86400
        auto_link_verified_oauth:
          type: boolean
          description: Link a verified OAuth identity to an existing confirmed account with the same email instead of returning a conflict. Requires require_email_confirmation to be true.
          default: false
        email_enabled:
          type: boolean
          description: Enable transactional email sending (confirmation, reset, change notifications). Must be true when require_email_confirmation is true.
          default: false
        email_from_address:
          type: string
        email_from_name:
          type: string
        smtp_host:
          type: string
        smtp_port:
          type: integer
          default: 587
        smtp_username:
          type: string
        smtp_password_configured:
          type: boolean
          description: Whether an SMTP password is configured. The password itself is never returned.
          default: false
        smtp_use_tls:
          type: boolean
          default: true
        email_confirmation_subject:
          type: string
        email_password_reset_subject:
          type: string
        email_password_changed_subject:
          type: string
        managed_auth_enabled:
          type: boolean
          description: Enables project-hosted managed auth pages.
          default: false
        post_auth_redirect_url:
          type: string
          description: Default redirect target after successful hosted auth.
        allowed_redirect_urls:
          type: array
          description: Redirect allowlist used to validate post_auth_redirect_url and post_logout_redirect_url.
          items:
            type: string
        post_logout_redirect_url:
          type: string
          description: Redirect target after logout from hosted pages.
        device_verification_url:
          type: string
          description: |
            Optional override for the device-authorization verification page.
            When set, POST /auth/device/authorize returns this URL (with the
            user_code) as verification_uri/verification_uri_complete instead of
            the built-in managed device page. Lets a CLI surface the project's
            own RFC 8628 approval page. Empty falls back to the managed page.
          example: https://app.acme.com/device
      required:
        - password_policy
    AuthInsightsInterval:
      type: string
      enum:
        - day
        - week
        - month
    AuthInsightsResponse:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        observed_at:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/AuthInsightsWindow'
        summary:
          $ref: '#/components/schemas/AuthInsightsSummary'
        series:
          type: array
          items:
            $ref: '#/components/schemas/AuthInsightsSeriesPoint'
      required:
        - project_id
        - observed_at
        - window
        - summary
        - series
    AuthInsightsSeriesPoint:
      type: object
      additionalProperties: false
      properties:
        bucket_start:
          type: string
          format: date
        signups:
          type: integer
          format: int64
          minimum: 0
          description: Accounts created during the bucket.
        signins:
          type: integer
          format: int64
          minimum: 0
          description: Successful session creations during the bucket.
        is_partial:
          type: boolean
          description: Whether the requested window or observation time clips this bucket.
      required:
        - bucket_start
        - signups
        - signins
        - is_partial
    AuthInsightsSummary:
      type: object
      additionalProperties: false
      properties:
        total_users:
          type: integer
          format: int64
          minimum: 0
          description: Current auth-user count, matching the auth-user list total.
        active_users_30d:
          type: integer
          format: int64
          minimum: 0
          description: Users with a successful session creation or refresh in the trailing 30 days since activity collection was deployed.
      required:
        - total_users
        - active_users_30d
    AuthInsightsWindow:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        interval:
          $ref: '#/components/schemas/AuthInsightsInterval'
      required:
        - from
        - to
        - interval
    AuthHostedPage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        page_type:
          $ref: '#/components/schemas/HostedAuthPageType'
        html:
          type: string
          description: HTML content for this page type.
        css:
          type: string
          description: CSS content for this page type.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthHostedPageResponse:
      type: object
      required:
        - page
        - defaults
        - runtime
      properties:
        page:
          allOf:
            - $ref: '#/components/schemas/AuthHostedPage'
          nullable: true
          description: The saved page, or null when the project has not customized this page type yet.
        defaults:
          $ref: '#/components/schemas/AuthHostedPageDefaults'
        runtime:
          $ref: '#/components/schemas/AuthHostedPageRuntime'
    AuthIdentity:
      type: object
      description: |
        A real email identity owned by the account. One account can own multiple
        identities (for example a work email plus a personal email linked via OAuth).
      properties:
        id:
          type: string
          format: uuid
          description: Unique identity identifier
        email:
          type: string
          format: email
          description: The email address this identity represents
        email_verified:
          type: boolean
          description: Whether ownership of this email has been verified
        is_primary:
          type: boolean
          description: Whether the account's primary sign-in method resolves to this identity
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - email_verified
        - is_primary
        - created_at
    AuthIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/AuthIdentity'
      required:
        - identities
    AuthMethodSummary:
      type: object
      description: |
        A single sign-in method the account owns (password, an OAuth provider, or an
        active anonymous method). `is_primary` reflects the account's primary_method_id.
      properties:
        id:
          type: string
          format: uuid
          description: Unique method identifier
        type:
          type: string
          x-go-type: string
          description: The kind of sign-in method
          enum:
            - password
            - oauth
            - anonymous
        provider:
          type: string
          description: OAuth provider name; present only when type is oauth
          example: google
        identity_id:
          type: string
          description: |
            The identity this method signs in to — a UUID for password/oauth methods,
            empty for anonymous methods.
        email:
          type: string
          description: The email of the method's identity (empty for anonymous)
        is_primary:
          type: boolean
          description: Whether this is the account's primary sign-in method
        last_used_at:
          type: string
          format: date-time
          description: When this method was last used to sign in, if ever
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - identity_id
        - email
        - is_primary
        - created_at
        - updated_at
    AuthMethodsResponse:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/AuthMethodSummary'
      required:
        - methods
    AuthPasswordPolicy:
      type: object
      additionalProperties: false
      description: Effective backend-enforced password policy.
      properties:
        effective_min_length:
          type: integer
          minimum: 15
          maximum: 128
          description: Effective minimum password length in Unicode characters.
        min_configurable_length:
          type: integer
          minimum: 15
          maximum: 15
          description: Lowest minimum password length accepted by the auth configuration endpoint.
        max_length:
          type: integer
          minimum: 128
          maximum: 128
          description: Maximum password length in Unicode characters.
        require_uppercase:
          type: boolean
          description: Whether passwords must contain an ASCII uppercase letter (A-Z).
        require_lowercase:
          type: boolean
          description: Whether passwords must contain an ASCII lowercase letter (a-z).
        require_numbers:
          type: boolean
          description: Whether passwords must contain an ASCII digit (0-9).
        require_special_chars:
          type: boolean
          description: Whether passwords must contain one of the backend-supported special characters.
        compromised_passwords_rejected:
          type: boolean
          description: Whether common and known-compromised passwords are rejected by the backend.
      required:
        - effective_min_length
        - min_configurable_length
        - max_length
        - require_uppercase
        - require_lowercase
        - require_numbers
        - require_special_chars
        - compromised_passwords_rejected
    AuthSession:
      type: object
      description: An authentication session for a user
      properties:
        id:
          type: string
          format: uuid
          description: Unique session identifier
        user_id:
          type: string
          format: uuid
          description: The user this session belongs to
        provider:
          type: string
          description: Authentication provider used to create this session
          enum:
            - email
            - google
            - github
            - microsoft
            - apple
            - anonymous
          example: email
        user_agent:
          type: string
          description: Browser/device user agent string
          example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)
        ip_address:
          type: string
          description: IP address of the client when the session was created
          example: 192.168.1.1
        last_ip_address:
          type: string
          description: IP address of the most recent activity (token refresh)
          example: 192.168.1.100
        expires_at:
          type: string
          format: date-time
          description: When this session expires
        last_activity_at:
          type: string
          format: date-time
          description: Last activity timestamp
        session_started_at:
          type: string
          format: date-time
          description: When the session was created
        is_active:
          type: boolean
          description: Whether the session is currently active (not expired)
        is_current:
          type: boolean
          description: Whether this is the session making the current request
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - provider
        - expires_at
        - is_active
        - is_current
    AuthSignupResponse:
      type: object
      description: |
        Uniform, session-less response returned by POST /auth/signup. It carries no
        tokens and no user object, and is identical for a new account and for an
        already-registered email (anti-enumeration). Clients obtain a session with a
        subsequent POST /auth/signin.
      properties:
        confirmation_required:
          type: boolean
          description: |
            Whether the project requires email confirmation. Reflects project config
            only (identical for a new and an existing email), so it leaks nothing about
            account existence.
        message:
          type: string
          description: Human-readable acknowledgement.
      required:
        - confirmation_required
        - message
    AuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (expires after configured lifetime)
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds
        refresh_token:
          type: string
          x-go-type-skip-optional-pointer: true
          description: |
            Long-lived token for getting new access tokens. Omitted when the
            request uses eligible HttpOnly cookie session storage.
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
        - access_token
        - token_type
        - expires_in
        - user
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_confirmed:
          type: boolean
        user_metadata:
          type: object
          additionalProperties: true
          description: User-editable metadata
        app_metadata:
          type: object
          additionalProperties: true
          description: Application-controlled metadata (read-only for users)
        avatar_url:
          type: string
          format: uri
          description: User avatar URL (from OAuth provider or manually set)
        status:
          type: string
          enum:
            - active
            - banned
            - deleted
        banned_until:
          type: string
          format: date-time
          nullable: true
          description: When temporary ban expires (null if not banned or permanent)
        last_sign_in_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - status
    BanUserResponse:
      type: object
      description: Response when banning a user
      properties:
        message:
          type: string
          example: User banned until 2026-12-31T23:59:59Z
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - banned
        banned_until:
          type: string
          format: date-time
          nullable: true
          description: When the ban expires (null for permanent ban)
