          type: string
          enum:
            - byoc
          default: byoc
          description: BYOC is mandatory for custom domain creation.
        certificate_pem:
          type: string
          description: Required. PEM-encoded certificate.
        private_key_pem:
          type: string
          description: Required. PEM-encoded private key.
        certificate_chain_pem:
          type: string
          description: Optional PEM-encoded certificate chain.
      required:
        - mode
        - certificate_pem
        - private_key_pem
    FrontendDeployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        frontend_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - deploy
            - redeploy
            - delete
        status:
          type: string
