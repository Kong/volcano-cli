        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
  /projects/{id}/auth/users/{userId}/sessions:
    get:
      tags:
        - Auth Admin
      summary: List user sessions
      description: |
        List paginated sessions for a specific auth user.
        Returns session details including device info, IP address, and activity timestamps.

        Ordering and pagination match `GET /auth/user/sessions`: the default is
        activity order with `page`/`limit` and the legacy `sessions` body, and
        `sort=created_at` opts into the standard cursor/offset hybrid with the
        shared `data` envelope. Cursor pagination is only available for
        `sort=created_at`, because the activity timestamp changes under paging.
        The `status=expired` filter is offset-only because sessions can expire
        above a cursor anchor during a walk.
      operationId: listUserSessions
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of sessions per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            Sort key. `last_activity` (default) orders by most recent activity and
            supports offset pagination only. `created_at` orders by session start
            and supports both offset and cursor pagination.
          schema:
            type: string
            enum:
              - last_activity
              - created_at
            default: last_activity
        - name: status
          in: query
          description: |
            Filter by whether the session can still be refreshed. Omit for every
            stored session, including expired ones. `expired` is not supported
            with cursor pagination.
          schema:
            type: string
            enum:
              - active
              - expired
        - name: cursor
          in: query
          description: |
            Opaque keyset cursor from a previous response's `next_cursor`. Requires
            `sort=created_at`; mutually exclusive with `page` and `ending_before`.
          schema:
            type: string
        - name: ending_before
          in: query
          description: |
            Opaque keyset cursor from a previous response's `prev_cursor`, paging
            backward. Requires `sort=created_at`; mutually exclusive with `page`
            and `cursor`.
          schema:
            type: string
        - name: offset
          in: query
          description: |
            Bounded number of rows to skip past the cursor anchor (the hybrid
            jump, maximum 100000). Ignored unless `cursor` or `ending_before` is
            supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 100000
      responses:
        '200':
          description: Paginated list of user sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  total:
                    type: integer
                    description: Total number of sessions
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of sessions per page
                  total_pages:
                    type: integer
                    description: Total number of pages
                  data:
                    type: array
                    description: Sessions for this page (cursor pagination only)
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  has_more:
                    type: boolean
                    description: Whether a further page exists (cursor pagination only)
                  next_cursor:
                    type: string
                    description: Opaque cursor for the next page (cursor pagination only)
                  prev_cursor:
                    type: string
                    description: Opaque cursor for the previous page (cursor pagination only). Send as `ending_before`.
        '400':
          description: Invalid or conflicting pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
    delete:
      tags:
        - Auth Admin
      summary: Delete all user sessions
      description: |
        Revokes all sessions for a user, forcing them to re-authenticate on all devices.
        Use this to log out a user from everywhere.
      operationId: deleteAllUserSessions
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: All sessions deleted
        '404':
          description: User not found
  /projects/{id}/auth/users/{userId}/sessions/{sessionId}:
    delete:
      tags:
        - Auth Admin
      summary: Delete specific session
      description: |
        Revokes a specific session for a user.
        Use this to log out a user from a single device.
      operationId: deleteUserSession
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session deleted
        '404':
          description: Session or user not found
  /projects/{id}/auth/users/{userId}/ban:
    post:
      tags:
        - Auth Admin
      summary: Ban a user
      description: |
        Bans a user temporarily or permanently. Banned users cannot sign in
