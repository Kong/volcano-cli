openapi: 3.0.3
info:
  title: Volcano Hosting API
  description: |-
    Public API for Volcano Hosting clients, SDKs, and CLI tooling (Port 8000).

    This specification intentionally excludes first-party/internal APIs. See api/openapi-internal.yaml for non-public internal and Builder operations.
  version: 3.0.0
  contact:
    name: Volcano Hosting
    email: support@volcano.dev
servers:
  - url: https://api.volcano.dev
    description: Production API server
  - url: http://localhost:8000
    description: Development API server (use VOLCANO_API_URL env var)
tags:
  - name: Projects
    description: Project management operations
  - name: Logs
    description: Project-scoped log search and activity APIs
  - name: Functions
    description: Function deployment and management
  - name: Frontends
    description: Frontend deployment and management. Supports Next.js 15.x and 16.x with Node.js 22.x or 24.x inferred from package.json engines.node when the selected Node.js family satisfies the installed Next.js package engines.node constraint.
  - name: Tokens
    description: Service keys for function invocation and database admin access
  - name: Variables
    description: Environment variable management
  - name: Databases
    description: Serverless PostgreSQL database provisioning and management
  - name: Database Branches
    description: Short-lived forks of a database for development and testing
  - name: Database Queries
    description: REST API for querying databases (SELECT, INSERT, UPDATE, DELETE)
  - name: Authentication
    description: End-user authentication (signup, signin, profile)
  - name: Auth Admin
    description: Auth user management (platform admin only)
  - name: Auth Configuration
    description: Authentication settings and anon keys
  - name: Anon Keys
    description: Project-specific public keys for frontend auth
  - name: Service Keys
    description: Project-specific secret keys for admin operations (bypass RLS - backend only!)
  - name: OAuth Configuration
    description: OAuth provider configuration (Google, GitHub, Microsoft, Apple)
  - name: OAuth Authentication
    description: OAuth login flows and provider management for end users
  - name: Git Connections
    description: Platform-user git provider connections for deployment source integrations
  - name: Project Imports
    description: Read-only project source discovery and import readiness checks
  - name: Storage Buckets
    description: Storage bucket management (platform admin)
  - name: Storage Policies
    description: Storage access policy management (platform admin)
  - name: Storage Admin
    description: Storage statistics and cross-bucket object listing (platform admin)
  - name: Storage Objects
    description: File upload, download, and management (SDK-facing)
  - name: Locks
    description: Project-scoped leases for backend coordination (service-role keys only)
  - name: Realtime
    description: WebSocket realtime configuration and monitoring
  - name: System
    description: System health and monitoring endpoints
  - name: CLI Authentication
    description: |
      Browser-based CLI login flow for automatic token provisioning.
      The CLI creates a session, opens a browser for user authentication,
      and polls for completion. Session completion is handled by volcano.dev
      via the Management API.
paths:
  /user/imports/connect:
    post:
      tags:
        - Project Imports
      summary: Start a project import provider connection
      description: |
        Starts a first-party dashboard user's provider connection flow. The
        response sets a short-lived HttpOnly browser-binding cookie for the
        public provider callback.
      operationId: startImportConnect
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: query
          required: false
          description: Import provider to connect. Defaults to Vercel.
          schema:
            $ref: '#/components/schemas/ImportProvider'
        - name: redirect
          in: query
          required: false
          description: Validated application URL used after the provider callback.
          schema:
            type: string
            format: uri
            pattern: ^https://[^/?#]+(?:[/?][^#]*)?$|^http://(?:localhost|127\.0\.0\.1|\[::1\])(?::[0-9]+)?(?:[/?][^#]*)?$
      responses:
        '200':
          description: Provider authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportConnectStartResponse'
        '400':
          description: Unsupported provider or invalid redirect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to start the connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Import provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{provider}/callback:
    get:
      tags:
        - Project Imports
      summary: Complete a project import provider connection
      description: |
        Public provider callback protected by signed state and the browser-binding
        cookie created by startImportConnect.
      operationId: completeImportConnect
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImportProvider'
        - name: state
          in: query
          required: true
          description: Signed connect state generated by startImportConnect.
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Provider authorization code.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Provider error category.
          schema:
            type: string
        - name: teamId
          in: query
          required: false
          description: Vercel team selected during installation.
          schema:
            type: string
        - name: configurationId
          in: query
          required: false
          description: Vercel Integration configuration identifier.
          schema:
            type: string
        - name: next
          in: query
          required: false
          description: Provider completion URL validated by the provider adapter.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Vercel installation source indicator.
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the provider completion URL, signed application redirect, or Volcano import page
          headers:
            Location:
              description: Validated redirect target
              schema:
                type: string
        '400':
          description: Invalid callback request, state, or browser binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many callback attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to complete the connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Import provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/imports/connections:
    get:
      tags:
        - Project Imports
      summary: List project import provider connections
      operationId: listImportConnections
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      responses:
        '200':
          description: Stored import provider connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportConnectionsResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to list connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/imports/connections/{connectionId}:
    delete:
      tags:
        - Project Imports
      summary: Delete a project import provider connection
      operationId: deleteImportConnection
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: connectionId
          in: path
          required: true
          description: Connection ID to delete.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Connection deleted
        '400':
          description: Malformed connection ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Connection changed while it was being deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete the connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Import provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{provider}/sources:
    get:
      tags:
        - Project Imports
      summary: List project sources available from a provider connection
      description: Lists provider projects without changing provider or Volcano resources.
      operationId: listImportSources
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImportProvider'
        - name: connection_id
          in: query
          required: true
          description: Owned provider connection used for discovery.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider sources available to import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSourcesResponse'
        '400':
          description: Invalid provider or connection ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The provider connection lacks a required Integration scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection or provider source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The provider connection must be reconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Provider rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to list provider sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable or integration not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{provider}/preflight:
    post:
      tags:
        - Project Imports
      summary: Check whether a provider project is ready to import
      description: Produces a deterministic read-only readiness report for a proposed new Volcano project.
      operationId: preflightProjectImport
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImportProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectImportPreflightRequest'
      responses:
        '200':
          description: Import readiness report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectImportReport'
        '400':
          description: Invalid provider, source, project name, or target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The provider connection lacks a required Integration scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection or provider source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The provider connection must be reconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Provider rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to produce an import readiness report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable or integration not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{provider}/runs:
    post:
      tags:
        - Project Imports
      summary: Start a Vercel project import
      description: Creates a Volcano project from an importable production preflight report. Retrying the same request with the same Idempotency-Key returns the existing run.
      operationId: startProjectImport
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImportProvider'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectImportStartRequest'
      responses:
        '202':
          description: Import run accepted
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectImportRun'
        '400':
          description: Invalid request or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Provider permission or project admission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection or provider source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Preflight is stale, idempotency key was reused, or destination conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Source is not importable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Provider rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to start the import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable or integration not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{provider}/runs/{runId}:
    get:
      tags:
        - Project Imports
      summary: Get a project import run
      operationId: getProjectImportRun
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImportProvider'
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectImportRun'
        '400':
          description: Invalid import run ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Import run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to get the import run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/git/connect:
    post:
      tags:
        - Git Connections
      summary: Start a git provider connection
      description: |
        Starts a first-party dashboard user's git provider connection flow and
        returns the provider authorization URL. The response also sets a
        short-lived HttpOnly callback binding cookie tied to the authenticated
        user through the signed provider state.
      operationId: startGitConnect
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: query
          required: false
          description: Git provider to connect. Defaults to github.
          schema:
            type: string
            enum:
              - github
            default: github
        - name: redirect
          in: query
          required: false
          description: URL to redirect the browser to after the provider callback completes.
          schema:
            type: string
      responses:
        '200':
          description: Provider authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitConnectStartResponse'
        '400':
          description: Unsupported provider or invalid redirect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to start the connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Git provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/git/connections:
    get:
      tags:
        - Git Connections
      summary: List git provider connections
      operationId: listGitConnections
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      responses:
        '200':
          description: Stored git provider connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitConnectionsResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to list connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Git provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/git/connections/{connectionId}:
    delete:
      tags:
        - Git Connections
      summary: Delete a git provider connection
      operationId: deleteGitConnection
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: connectionId
          in: path
          required: true
          description: Connection ID to delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Connection deleted
        '400':
          description: Malformed connection ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Git provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/git/connections/{connectionId}/installations:
    get:
      tags:
        - Git Connections
      summary: List GitHub App installations accessible to a connection
      description: |
        Live proxy to GitHub: lists the platform GitHub App installations the
        connection's stored user token can access. Nothing is persisted by
        this call.
      operationId: listGitInstallations
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: connectionId
          in: path
          required: true
          description: Connection ID to browse installations for.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Installations accessible to the connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitInstallationsResponse'
        '400':
          description: Malformed connection ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to list installations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Git provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/git/connections/{connectionId}/installations/{installationId}/repositories:
    get:
      tags:
        - Git Connections
      summary: List repos accessible to a connection through an installation
      description: |
        Live proxy to GitHub: lists the repos the connection's stored user
        token can access through installationId. Nothing is persisted by this
        call.
      operationId: listGitInstallationRepositories
      security:
        - UserToken: []
        - AuthUserAccessToken: []
      parameters:
        - name: connectionId
          in: path
          required: true
          description: Connection ID to browse repositories for.
          schema:
            type: string
            format: uuid
        - name: installationId
          in: path
          required: true
          description: GitHub App installation ID.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Repositories accessible through the installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepositoriesResponse'
        '400':
          description: Malformed connection or installation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to list repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Git provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /github/callback:
    get:
      tags:
        - Git Connections
      summary: Complete a GitHub App connection callback
      description: |
        Public GitHub App callback. The signed state and callback binding cookie
        bind the provider authorization to the browser that started the flow.
      operationId: gitConnectCallback
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: GitHub user authorization code.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Signed connect state generated by startGitConnect.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Provider error returned by GitHub.
          schema:
            type: string
      responses:
        '303':
          description: Redirect back to the app after a successful or failed connect attempt
          headers:
            Location:
              description: Redirect target
              schema:
                type: string
        '400':
          description: Invalid callback request or state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many callback attempts from this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to complete the connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Git provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects:
    get:
      tags:
        - Projects
      summary: List all projects for authenticated user
      description: |
        Returns projects that are not deleting or deleted, newest first.
        Supports two mutually exclusive pagination modes. Offset mode uses
        `page` and `limit`. Cursor mode uses `cursor` or `ending_before` with
        `limit`, returns `next_cursor`/`prev_cursor`, and supports a bounded
        `offset` past the cursor anchor. Supplying `limit` without `page`
        selects cursor mode. `search` applies a case-insensitive project-name
        filter in either mode. Sending `page` with `cursor` or `ending_before`,
        or sending both cursor directions, returns 400.
      operationId: listProjects
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '400':
          description: Invalid or conflicting pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Projects
      summary: Create a new project
      description: |
