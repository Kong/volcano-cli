            schema:
              type: object
              properties:
                enable_email_password:
                  type: boolean
                enable_anonymous:
                  type: boolean
                oauth_providers:
                  type: array
                  items:
                    type: object
                    properties:
                      provider:
                        type: string
                      enabled:
                        type: boolean
      responses:
        '200':
          description: Methods configured
        '400':
          description: At least one method must be enabled
  /projects/{id}/oauth/configs:
