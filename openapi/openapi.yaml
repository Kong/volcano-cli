          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/users/{userId}:
    get:
      tags:
        - Auth Admin
      summary: Get specific auth user (admin)
      operationId: getAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
