          description: Whether broadcast channels are enabled
        presence_enabled:
          type: boolean
          description: Whether presence tracking is enabled
        postgres_changes_enabled:
          type: boolean
          description: Whether Postgres change notifications are enabled
    UpdateStorageBucketRequest:
      type: object
      properties:
        file_size_limit:
          type: integer
          format: int64
        allowed_mime_types:
          type: array
          items:
            type: string
    UpdateVariableRequest:
      type: object
      properties:
        value:
          type: string
