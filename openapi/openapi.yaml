              $ref: '#/components/schemas/DatabaseDeleteRequest'
      responses:
        '200':
          description: Delete successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryResult'
              example:
                data:
                  - id: post-uuid
                    title: Deleted Post
                count: 1
        '400':
          description: Invalid request or missing filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/regions:
