  /auth/signup:
    post:
      tags:
        - Authentication
      summary: Sign up a new auth user
      description: |
        Create a new end-user account. The project is determined from the anon key.
        Requires project-specific anon key in Authorization header.

        **Session-less**: signup never issues a session. On success it returns a
        uniform acknowledgement (`AuthSignupResponse`) with no tokens; the client
        obtains a session with a subsequent `POST /auth/signin`. If email confirmation
        is enabled for the project, a confirmation email is sent and
        `confirmation_required` is `true`.

        **Anti-enumeration**: a signup for an already-registered email returns the
        exact same `201` response as a fresh signup — it never returns `409` — so the
        response cannot be used to discover which emails are registered.
      operationId: authSignup
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                user_metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: |
            Signup acknowledged (session-less). Returned identically for a new
            account and for an already-registered email (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignupResponse'
        '400':
          description: Invalid input (bad email/password format)
        '401':
          description: |
            Unauthorized - Invalid, tampered, revoked, or wrong-project anon key
        '403':
          description: |
            Forbidden - Signups disabled or anon key lacks signup permission
        '429':
          description: Rate limit exceeded
  /auth/signin:
    post:
      tags:
        - Authentication
      summary: Sign in an auth user
      description: Authenticate with email and password. Requires anon key. Project is identified via the anon key.
      operationId: authSignin
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Signin successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid input (missing email/password)
        '401':
          description: |
            Unauthorized - Invalid credentials, invalid/tampered/revoked anon key,
            or account banned/deleted
        '403':
          description: |
            Forbidden - Anon key lacks signin permission
        '429':
          description: Rate limit exceeded
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get a new access token using refresh token. Requires anon key. Project is identified via the anon key.
      operationId: authRefresh
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout (revoke refresh token)
      description: Invalidate a refresh token. Requires anon key. Project is identified via the anon key.
      operationId: authLogout
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Logged out successfully
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: |
        Generates recovery token and stores it (email sending pending).
        Returns generic message to prevent email enumeration.
        Project is identified via the anon key.
      operationId: authForgotPassword
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Generic success message (doesn't reveal if email exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If the email exists, a password reset link has been sent
        '403':
          description: Password reset is disabled for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (10 requests per hour per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with recovery token
      description: |
        Reset password using recovery token from forgot-password.
        Revokes all existing sessions for security.
      operationId: authResetPassword
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  description: Recovery token from forgot-password
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Password doesn't meet requirements
        '401':
          description: Invalid or expired token
  /auth/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm email address
      description: |
        Confirm email address using token sent via email.
        Required if require_email_confirmation is enabled.
      operationId: authConfirmEmail
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Confirmation token from email
      responses:
        '200':
          description: Email confirmed or already confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                      - Email confirmed successfully
                      - Email already confirmed
              examples:
                confirmed:
                  summary: Fresh confirmation
                  value:
                    message: Email confirmed successfully
                alreadyConfirmed:
                  summary: Token belongs to already-confirmed user
                  value:
                    message: Email already confirmed
        '400':
          description: Missing confirmation token in request body
        '401':
          description: Invalid or expired token
  /auth/resend-confirmation:
    post:
      tags:
        - Authentication
      summary: Resend confirmation email
      description: |
        Resend email confirmation link.
        Returns generic message to prevent email enumeration.
        No email is sent when the account does not exist or is already confirmed.
        If the account exists and is unconfirmed, a new token is generated and
        any previous confirmation token is invalidated.
      operationId: authResendConfirmation
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Generic success message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/signup-anonymous:
    post:
      tags:
        - Authentication
      summary: Create anonymous user
      description: |
        Create guest user without email/password.

        User metadata (like display_name) can be included and will appear in realtime presence events.
        Requires enable_anonymous_signins to be true.
      operationId: authSignupAnonymous
