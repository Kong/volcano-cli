      tags:
        - OAuth Configuration
      summary: List available OAuth providers
      description: Get list of supported OAuth providers and their default scopes
      operationId: listAvailableOAuthProviders
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Available providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        default_scopes:
                          type: array
                          items:
                            type: string
  /auth/oauth/{provider}/authorize:
    get:
      tags:
        - OAuth Authentication
      summary: Start OAuth authorization
      description: |
        Redirects user to OAuth provider for authorization.
        Handles CSRF protection with state parameter.
        Project is identified via the anon_key query parameter.
      operationId: authOAuthAuthorize
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - microsoft
              - apple
        - name: anon_key
          in: query
          required: true
          schema:
            type: string
          description: Project anon key (required - identifies the project)
        - name: redirect_url
          in: query
          schema:
            type: string
          description: |
            URL to redirect to after the OAuth flow (optional). Must exactly
            match an entry in the project's `allowed_redirect_urls`, including
            its query string, or be the project's own managed hosted-auth page
            URL.
        - name: client_state
          in: query
          schema:
            type: string
            maxLength: 255
          description: |
            Optional application nonce. It is stored with the server-generated
            provider state and echoed to redirect_url as `state`.
        - name: response_mode
          in: query
          schema:
            type: string
            enum:
              - code
          description: |
            Set to `code` to receive a short-lived authorization code at
            redirect_url, then use POST /auth/oauth/exchange to obtain the
            session. `redirect_url` is required in this mode. When omitted, the
            established session-fragment response is retained for compatibility
            with existing clients.
      responses:
        '307':
          description: Redirect to OAuth provider
        '400':
          description: |
            OAuth provider is disabled for this project, or `redirect_url` is
            not registered in `allowed_redirect_urls`
        '404':
          description: OAuth provider not configured
  /auth/oauth/{provider}/callback:
    get:
      tags:
        - OAuth Authentication
      summary: OAuth callback handler
      description: |
        Handles OAuth provider callback with authorization code.
        Exchanges code for tokens and creates/signs in user.
      operationId: authOAuthCallback
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - microsoft
              - apple
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Existing user signed in (when redirect_url was omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '201':
          description: New user created and signed in (when redirect_url was omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '303':
          description: |
            Redirect to the exact registered redirect_url. Flows that requested
            response_mode=code receive a short-lived, single-use `code` and
            optional application `state`; compatibility flows receive the
            established session fragment.
        '400':
          description: |
            Missing/invalid code or state, the state parameter expired, or the
            flow's stored redirect_url is no longer registered in
            allowed_redirect_urls (re-checked at callback time)
        '403':
          description: |
            The provider's email domain is not in `allowed_email_domains`. Creating
            an account is refused under `signup` and `signup_and_signin`; signing in
            an already-linked account is refused under `signup_and_signin`.
        '409':
          description: Email already exists (requires linking)
  /auth/oauth/exchange:
    post:
      tags:
        - OAuth Authentication
      summary: Exchange OAuth authorization code
      description: |
        Atomically consumes a short-lived callback code and returns the user's
        session. The request must use the same project anon key and exact
        redirect_url that initiated the flow.
      operationId: authOAuthExchange
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - redirect_url
              properties:
                code:
                  type: string
                redirect_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Authorization code consumed and session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid, expired, consumed, or redirect-mismatched code
        '401':
          description: Missing or invalid project anon key
        '403':
          description: |
            Email confirmation is now required, or the account's email domain is not
            in `allowed_email_domains` while `allowed_email_domains_mode` is
            `signup_and_signin`. Both are re-checked here because the code outlives
            the callback that issued it.
        '429':
          description: Too many exchange attempts from this client
  /auth/device/authorize:
    post:
      tags:
        - OAuth Authentication
      summary: Start RFC8628 device authorization
      description: |
        Starts OAuth 2.0 Device Authorization Grant (RFC 8628).
        Returns `device_code` for the CLI and `user_code` for browser verification.

        By default the returned `verification_uri` / `verification_uri_complete`
        point at the project's managed device-approval page served by this API
        (`/projects/{projectId}/auth/hosted?action=device&user_code=...&anon_key=...`),
        which requires managed auth enabled and a default anon key for the
        project.

        Projects can override this by setting `device_verification_url` on the
        auth config (`PATCH /auth/config`). When set, that URL is returned as-is
        with the `user_code` appended (no `action=device` hint and no embedded
        anon key — the page brings its own), so a CLI's `login` command surfaces
        the project's own RFC 8628 approval page. With a custom URL, device login
        does **not** require managed auth to be enabled; the custom page's origin
        must be in the project's auth CORS allowlist to call
        `POST /auth/device/verify`. Either way the verification page must
        authenticate the end user and call `POST /auth/device/verify` with the
        `user_code`. See the device-auth guide for both approaches.
      operationId: authDeviceAuthorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: string
                  description: Enabled `device` OAuth client ID for the target project
      responses:
        '200':
          description: Device authorization started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
        '400':
          description: Invalid request or unauthorized client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
  /auth/device/token:
    post:
      tags:
        - OAuth Authentication
      summary: Poll device token endpoint
      description: |
        RFC8628 token polling endpoint.
        Returns OAuth errors such as `authorization_pending`, `slow_down`, `access_denied`, and `expired_token`.
      operationId: authDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
                - device_code
                - client_id
              properties:
                grant_type:
                  type: string
                  enum:
                    - urn:ietf:params:oauth:grant-type:device_code
                device_code:
                  type: string
                client_id:
                  type: string
      responses:
        '200':
          description: Device flow completed, auth-user session minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Polling state/error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '403':
          description: |
            `access_denied` - the approving account's email domain is not in
            `allowed_email_domains` while `allowed_email_domains_mode` is
            `signup_and_signin`. Re-checked here because approval and redemption
            are separate requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
  /auth/device/verify:
    post:
      tags:
        - OAuth Authentication
      summary: Approve or deny a device code
      description: |
        Browser-side endpoint for authenticated auth-users to approve (`approve`) or deny (`deny`) a `user_code`.

        Called by the verification page after the end user signs in. The grant is
        scoped to the project the auth-user token belongs to: approving a
        `user_code` issued for a different project returns `403`. This endpoint
        does not require managed auth to be enabled, so a custom verification page
        (hosted anywhere) can drive approval — it just needs an authenticated
        project auth-user access token and, for cross-origin browser calls, the
        page origin allowed in the project's auth CORS settings.
      operationId: authDeviceVerify
      security:
        - AuthUserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_code
              properties:
                user_code:
                  type: string
                action:
                  type: string
                  enum:
                    - approve
                    - deny
                  default: approve
      responses:
        '200':
          description: Verification action accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/platform/exchange:
    post:
      tags:
        - OAuth Authentication
      summary: Exchange auth-user device session for platform token
      description: |
        Exchanges a verified auth-user device-flow session into a platform token for CLI usage.
        The target platform user is derived from authenticated auth-user mapping; client cannot select another user.
      operationId: authPlatformExchange
      security:
        - AuthUserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: string
      responses:
        '200':
          description: Platform token minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformExchangeResponse'
        '403':
          description: |
            Exchange not allowed for this session/client/project, or the
            account's email domain is not in `allowed_email_domains` while
            `allowed_email_domains_mode` is `signup_and_signin`. The domain is
            re-checked here because the minted platform token outlives the
            session it is exchanged from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oauth/providers:
    get:
      tags:
        - OAuth Authentication
      summary: List user's linked providers
      description: Get list of OAuth providers linked to current user
      operationId: authListOAuthProviders
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: Linked providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        linked_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oauth/{provider}/link:
    post:
      tags:
        - OAuth Authentication
      summary: Link OAuth provider to current user
      description: |
        Generates authorization URL to link OAuth provider to existing account.
        User must be authenticated.
      operationId: authLinkOAuthProvider
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - microsoft
              - apple
        - name: redirect_url
          in: query
          schema:
            type: string
          description: |
            URL to redirect to after linking completes (optional). Same
            allowed_redirect_urls requirement as GET /auth/oauth/{provider}/authorize.
        - name: client_state
          in: query
          schema:
            type: string
            maxLength: 255
          description: |
            Optional application nonce echoed to redirect_url as `state`.
        - name: response_mode
          in: query
          schema:
            type: string
            enum:
              - code
          description: |
            Set to `code` to receive a short-lived authorization code at
            redirect_url. `redirect_url` is required in this mode. When
            omitted, the established session-fragment response is retained for
            compatibility with existing clients.
      responses:
        '200':
          description: Authorization URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
        '400':
          description: redirect_url is not registered in allowed_redirect_urls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: OAuth provider not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Provider already linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oauth/{provider}/unlink:
    delete:
      tags:
        - OAuth Authentication
      summary: Unlink OAuth provider
      description: |
        Remove OAuth provider from user's account.
        Cannot unlink if it's the only authentication method.
      operationId: authUnlinkOAuthProvider
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - microsoft
              - apple
      responses:
        '204':
          description: Provider unlinked
        '400':
          description: Cannot unlink last authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oauth/{provider}/refresh-token:
    post:
      tags:
        - OAuth Authentication
      summary: Refresh OAuth provider token
      description: |
        Refresh the access token for an OAuth provider using its refresh token.
        Allows calling provider APIs on user's behalf (e.g., Google Drive, GitHub repos).
      operationId: refreshOAuthProviderToken
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - microsoft
              - apple
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  provider:
                    type: string
                  expires_in:
                    type: integer
        '400':
          description: No refresh token available or refresh failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oauth/{provider}/token:
    get:
      tags:
        - OAuth Authentication
      summary: Get current provider access token
      description: |
        Get valid access token for OAuth provider.
        Automatically refreshes if expired.
      operationId: getOAuthProviderToken
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - microsoft
              - apple
      responses:
        '200':
          description: Current access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  provider:
                    type: string
                  expires_in:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oauth/{provider}/call-api:
    post:
      tags:
        - OAuth Authentication
      summary: Call OAuth provider API
      description: |
        Make an authenticated request to an OAuth provider's API on behalf of the user.
        The user's stored access token is automatically used and refreshed if needed.

        The request is always sent to the provider's fixed API base URL joined with
        the caller-supplied `endpoint`. `endpoint` must be a relative path beginning
        with `/` (optionally with a query string); it cannot change the target host.
        Absolute URLs, protocol-relative `//host` values, or userinfo (`@host`) are
        rejected with `400` so the request can never be redirected to another host.

        Examples of `endpoint`:
        - Google userinfo: `/oauth2/v1/userinfo`
        - GitHub repositories: `/user/repos`
        - Microsoft Graph profile: `/me`

        The response is the raw JSON response from the provider's API.
      operationId: callOAuthProviderAPI
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - microsoft
              - apple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
                  description: |
                    Relative path on the provider's API, beginning with `/`. It is
                    joined with the provider's fixed base URL; it must not contain a
                    scheme, host, userinfo, or a leading `//`.
                  example: /user/repos
                method:
                  type: string
                  enum:
                    - GET
                    - POST
                  default: GET
                  description: HTTP method to use
                body:
                  type: object
                  additionalProperties: true
                  description: Request body for POST requests
      responses:
        '200':
          description: Provider API response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Raw response from the OAuth provider's API
        '400':
          description: |
            Invalid request (for example: missing `endpoint`, an `endpoint` that is
            not a relative path, or an unsupported HTTP method).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated or provider not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/anon-keys:
    get:
      tags:
        - Anon Keys
      summary: List anon keys
      description: |
        Supports two mutually exclusive pagination modes. Offset mode uses `page`
        and `limit` and is the default when neither `cursor` nor `search` is
        supplied (first page, default `limit`). Cursor mode uses `cursor` and
        `limit`, supports `search` (case-insensitive name match), and returns
        `next_cursor`. Sending both `page` and `cursor` (or `page` and `search`)
        returns 400.
      operationId: listAnonKeys
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: List of anon keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnonKey'
                  total:
                    type: integer
                    description: Total number of items matching the query (so the UI can render numbered pages).
                  has_more:
                    type: boolean
                    description: Whether a next page exists.
                  next_cursor:
                    type: string
                    description: Opaque cursor for the next page (cursor pagination only)
                  prev_cursor:
                    type: string
                    description: Opaque cursor for the previous page (cursor pagination only). Send as `ending_before`.
    post:
      tags:
        - Anon Keys
      summary: Create anon key
      operationId: createAnonKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: |
                    Key name for identification.
                    Can only contain letters, numbers, underscores, and hyphens.
                  pattern: ^[A-Za-z0-9_-]+$
                  minLength: 1
                  maxLength: 255
                  example: frontend-app
                permissions:
                  type: array
                  items:
                    type: string
                    enum:
                      - auth.signup
                      - auth.signin
                      - auth.refresh
                      - auth.logout
                      - auth.password_reset
                      - auth.confirm_email
                      - auth.resend_confirmation
                      - storage.upload
                      - storage.download
                      - storage.list
                      - storage.delete
                      - realtime.connect
                      - realtime.subscribe
                      - realtime.publish
                      - functions.invoke
                  description: |
                    Optional list of permissions for this key.
                    If not provided, defaults to auth-only permissions: auth.signup, auth.signin, auth.refresh, auth.logout, auth.password_reset, auth.confirm_email, auth.resend_confirmation.
                    Storage, realtime, and functions permissions must be explicitly added if needed.
                  example:
                    - auth.signup
                    - auth.signin
                    - auth.refresh
                    - auth.logout
      responses:
        '201':
          description: Anon key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonKey'
  /projects/{id}/anon-keys/{keyId}:
    get:
      tags:
        - Anon Keys
      summary: Get anon key
      description: Get details of a specific anon key
      operationId: getAnonKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Anon key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonKey'
        '404':
          description: Key not found
    delete:
      tags:
        - Anon Keys
      summary: Revoke anon key
      description: Revokes key - it will immediately stop working
      operationId: revokeAnonKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Key revoked
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Key not found
        '409':
          description: Cannot delete the project's default anon key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/anon-keys/{keyId}/regenerate:
    post:
      tags:
        - Anon Keys
      summary: Regenerate anon key
      description: Generate new JWT value for existing key
      operationId: regenerateAnonKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonKey'
  /projects/{id}/anon-keys/{keyId}/set-default:
    post:
      tags:
        - Anon Keys
      summary: Set default anon key
      description: Promotes the given key to the project's configured default. At most one key per project can be default.
      operationId: setDefaultAnonKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key set as default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonKey'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Anon key not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/service-keys:
    get:
      tags:
        - Service Keys
      summary: List service keys (paginated)
      description: |
        List all service role keys for a project with pagination.

        **WARNING:** Service keys bypass RLS - for backend/admin use only!
      operationId: listServiceKeys
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated list of service keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceKeys'
    post:
      tags:
        - Service Keys
      summary: Create service key
      description: |
        Create a new service role key for admin operations.

        **WARNING:** Service keys bypass all RLS policies!
        Store securely and NEVER expose in frontend code.
      operationId: createServiceKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: |
                    Descriptive name for the key (e.g., "admin-dashboard", "background-jobs").
                    Can only contain letters, numbers, underscores, and hyphens.
                  pattern: ^[A-Za-z0-9_-]+$
                  minLength: 1
                  maxLength: 255
                  example: admin-dashboard
                permissions:
                  type: array
                  items:
                    type: string
                  description: |
                    Optional least-privilege scope for the key. When omitted, empty, or
                    containing only blank strings, the key is granted full access (["*"])
                    for backward compatibility. Provide an explicit list (e.g.
                    ["functions.invoke", "locks.manage"]) to restrict the key; "*"
                    grants everything. Scope enforcement applies to function invocation,
                    storage object operations, and project locks.
                  example:
                    - functions.invoke
                    - locks.manage
      responses:
        '201':
          description: Service key created - save the key_value immediately!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKey'
        '409':
          description: Key with this name already exists
  /projects/{id}/service-keys/{keyId}:
    get:
      tags:
        - Service Keys
      summary: Get service key
      description: Get details of a specific service key
      operationId: getServiceKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKey'
        '404':
          description: Key not found
    delete:
      tags:
        - Service Keys
      summary: Delete service key
      description: |
        Permanently delete a service key.
        Any services using this key will immediately lose access.
      operationId: deleteServiceKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Key deleted
  /projects/{id}/service-keys/{keyId}/regenerate:
    post:
      tags:
        - Service Keys
      summary: Regenerate service key
      description: |
        Generate new JWT value for existing key.
        The old key is immediately invalidated.
        Update your backend services with the new key before regenerating in production.
      operationId: regenerateServiceKey
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key regenerated - save the new key_value immediately!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKey'
  /projects/{id}/storage/buckets:
    get:
      tags:
        - Storage Buckets
      summary: List all storage buckets in a project
      description: |
        With no pagination params, returns the full bucket list as a bare array
        (legacy). Supplying `cursor`, `ending_before`, `search`, or `limit`
        switches to keyset (cursor) pagination and returns a paginated envelope
        with `next_cursor`/`prev_cursor` and a filtered `total`.
      operationId: listStorageBuckets
      security:
        - UserToken: []
