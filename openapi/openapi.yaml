                    display_name: Alice
                    avatar_url: https://example.com/alice.jpg
      responses:
        '201':
          description: Anonymous user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '403':
          description: Anonymous signins disabled
  /auth/user/convert-anonymous:
    post:
      tags:
        - Authentication
      summary: Convert anonymous user to authenticated
      description: |
        Add email and password to anonymous user.
        Requires auth user access token.
        If require_email_confirmation is enabled for the project, the converted
