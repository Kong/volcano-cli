        artifact_bucket:
          type: string
        artifact_key:
          type: string
        artifact_version:
          type: string
        site_url:
          type: string
        cloudformation_stack_id:
          type: string
        cloudformation_stack_url:
          type: string
        codebuild_duration_seconds:
          type: integer
