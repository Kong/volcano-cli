# How the volcano CLI (Kong/volcano-cli) reaches each operation in
# api/openapi.yaml. Every route and dashboard action needs a CLI path; a missing
# one is a gap to close, not an exception.
#
# Each operation, keyed by method and path as the spec writes them, has
# exactly one of:
#
#   command   the full volcano command path that calls it, or that gives the
#             same result through another operation; `flags` optionally names
#             the flags that select it
#   manifest  the volcano-config.yaml section, when `volcano cloud config
#             deploy` is the only way the CLI reaches it
#   reason    one of `reasons` below; a gap links its `issue`, and a retiring
#             route links the `pr` that removes it
#
# TestEveryOperationHasACLIEntry fails until a new operation is listed. The
# volcano CLI vendors this file and checks that each command exists.

reasons:
  data_plane: An application, SDK or end user calls it with an application credential or none.
  client_protocol: A protocol endpoint other clients speak directly, such as /mcp, the OpenAPI document and capability discovery.
  browser: A redirect leg a CLI flow drives indirectly, such as an OAuth callback around a device-style poll.
  gap: A command should call it and none does yet.
  retiring: The route is being removed.

