version: 1

# Deploy with `volcano config deploy` after `volcano functions deploy`.
# Declared sections are the source of truth: schedulers listed under a
# function are fully synced, and entries for functions that are not
# deployed yet are skipped with a warning.
functions:
  # The dashboard calls notes-summary as the signed-in user, so it has to
  # accept the project's end users and not only server-side callers.
  - name: notes-summary
    visibility: authenticated
