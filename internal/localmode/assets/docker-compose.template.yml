# Generated by scripts/generate-volcano-cli-localmode-assets from infrastructure/local-mode/docker-compose.template.yml. Do not edit by hand.
# Regenerate this file from the source local-mode Compose template.

services:
  postgres:
    image: ${VOLCANO_POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:16-alpine}
    container_name: volcano-postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: volcano
      POSTGRES_USER: volcano
      POSTGRES_PASSWORD: volcano
    ports:
      - "5432:5432"
    volumes:
      - volcano-db:/var/lib/postgresql/data
    networks:
      - volcano-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volcano"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: ${VOLCANO_REDIS_IMAGE:-mirror.gcr.io/library/redis:7-alpine}
    container_name: volcano-redis
    volumes:
      - volcano-redis:/data
    ports:
      - "6379:6379"
    networks:
      - volcano-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb:
    image: ${VOLCANO_DYNAMODB_IMAGE:-amazon/dynamodb-local:latest}
    container_name: volcano-dynamodb
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    ports:
      - "8003:8000"
    volumes:
      - volcano-dynamodb:/home/dynamodblocal/data
    networks:
      - volcano-internal

  # Local SMTP catch-all for testing auth emails. The seeded default project's
  # auth_config points its smtp_host at "mailpit" so signup confirmations,
  # password reset emails, etc. land in Mailpit's inbox at http://localhost:8025
  # instead of being discarded.
  mailpit:
    image: ${VOLCANO_MAILPIT_IMAGE:-axllent/mailpit:v1.30}
    container_name: volcano-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI — view captured emails here
    networks:
      - volcano-internal

  server:
    image: ${VOLCANO_IMAGE:-kong/volcano:local-nightly}
    container_name: volcano-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dynamodb:
        condition: service_started
    environment:
      # Core settings
      LOCAL_MODE: "true"
      DATABASE_URL: postgres://volcano:volcano@postgres:5432/volcano?sslmode=disable
      REDIS_URL: redis://redis:6379
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      LOG_EVENTS_HOT_PATH_TABLE_NAME: volcano-local-log-events
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      REDIS_TIMEOUT: "60s"
      USAGE_SYNC_INTERVAL: "30s"
      USAGE_SYNC_LOCK_TTL: "30s"
      SOURCE_ARCHIVE_SIZE_LIMIT_MB: "256"
      LAMBDA_TARGET_CONTAINER_SIZE_LIMIT_MB: "4096"
      PORT: "8000"
      MANAGEMENT_PORT: "8001"
      PGPROXY_PORT: "8002"
      ENVIRONMENT: development
      LOG_LEVEL: ${VOLCANO_LOG_LEVEL:-info}
      API_BASE_URL: "http://localhost:8000"
      WEB_BASE_URL: "http://localhost:3000"
      LOCAL_STORAGE_DIR: "/app/local-storage"
      LOCAL_FUNCTIONS_DIR: "/app/local-functions"
      # Local frontend ingress: HTTP-only proxy with wildcard *.frontends.localhost.
      # macOS resolves *.localhost to 127.0.0.1 automatically, so a deployed
      # frontend at <frontend-id>.frontends.localhost:8080 is browser-reachable.
      FRONTENDS_HTTP_PORT: "8080"
      FRONTEND_INVOCATION_DNS: "*.frontends.localhost"
      # Local plan defaults are baked into the server binary (cmd/server/internal/config).
      # Do not put FREE_*/PRO_* values here: this template ships in the CLI image.
      # Deployable regions used by project region resolution (`all_regions=true`
      # projects default to this list). Cloud passes the real multi-region set;
      # locally we surface a representative subset so feature pickers and
      # scheduler validation have something to work with.
      AWS_REGIONS: "us-east-1,eu-west-1,ap-southeast-1"
      # First-party bootstrap (optional). ANON_KEY_SECRET is sourced from
      # .env.local and must match the secret VOLCANO_FIRST_PARTY_ANON_KEY was
      # signed with, since the server validates that key during bootstrap.
      ANON_KEY_SECRET: ${ANON_KEY_SECRET:-}
      VOLCANO_FIRST_PARTY_USER_ID: ${VOLCANO_FIRST_PARTY_USER_ID:-}
      VOLCANO_FIRST_PARTY_USER_DISPLAY_NAME: ${VOLCANO_FIRST_PARTY_USER_DISPLAY_NAME:-}
      VOLCANO_FIRST_PARTY_USER_TOKEN: ${VOLCANO_FIRST_PARTY_USER_TOKEN:-}
      VOLCANO_FIRST_PARTY_PROJECT_ID: ${VOLCANO_FIRST_PARTY_PROJECT_ID:-}
      VOLCANO_FIRST_PARTY_PROJECT_NAME: ${VOLCANO_FIRST_PARTY_PROJECT_NAME:-}
      VOLCANO_FIRST_PARTY_ANON_KEY: ${VOLCANO_FIRST_PARTY_ANON_KEY:-}
      VOLCANO_FIRST_PARTY_DEVICE_CLIENT_ID: ${VOLCANO_FIRST_PARTY_DEVICE_CLIENT_ID:-}
      # GitHub App git provider integration
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    volumes:
      - volcano-storage:/app/local-storage
    ports:
      - "8000:8000"
      - "8002:8002"
      - "8080:8080"
    networks:
      - volcano-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  volcano-internal:
    driver: bridge

volumes:
  volcano-db:
  volcano-redis:
  volcano-dynamodb:
  volcano-storage:
