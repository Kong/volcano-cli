name: Release PR auto-merge

# Merge the Release Please PR without a human review. The release app is a
# ruleset bypass actor, and a *direct* merge by that app honors the bypass;
# GitHub's native auto-merge does not apply ruleset bypass, so it can't be used
# here. Human PRs are unaffected and still require a review. This runs only
# after the PR CI for a release-please branch has succeeded.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'release-please--')
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.VOLCANO_APP_ID }}
          private-key: ${{ secrets.VOLCANO_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Only merge an open PR on this branch that carries the Release Please
          # label, so nothing else can be merged through this path.
          number="$(gh pr list --head "$HEAD_BRANCH" --state open \
            --json number,labels \
            --jq 'map(select(any(.labels[]; .name == "autorelease: pending"))) | .[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No open Release Please PR for ${HEAD_BRANCH}; nothing to merge."
            exit 0
          fi
          echo "Merging release PR #${number}"
          gh pr merge "$number" --squash
