name: Publish CLI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*.*.*-nightly.*"
      - "staging-v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Validate Release Ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            exit 0
          fi

          STABLE_SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          STAGING_SEMVER_RE='^staging-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $STABLE_SEMVER_RE ]] && [[ ! "$GITHUB_REF_NAME" =~ $STAGING_SEMVER_RE ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}"
            echo "Release tags must use stable SemVer form vMAJOR.MINOR.PATCH or staging form staging-vMAJOR.MINOR.PATCH."
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAGGED_SHA="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$TAGGED_SHA" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} points at ${TAGGED_SHA}, which is not reachable from origin/main."
            echo "CLI releases must be cut from main."
            exit 1
          fi

  resolve-release:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    needs: [validate-release-ref]
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_title: ${{ steps.release.outputs.release_title }}
      cli_version: ${{ steps.release.outputs.cli_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      latest: ${{ steps.release.outputs.latest }}
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DATE_PART="$(date -u +%Y%m%d)"
            LATEST_STABLE_PATCH="$({
              git tag --list 'v0.0.*' || true
            } | awk '/^v0\.0\.[0-9]+$/ { sub(/^v0\.0\./, "", $0); print $0 }' | sort -n | tail -1)"
            NEXT_PATCH=$(( ${LATEST_STABLE_PATCH:-0} + 1 ))
            NIGHTLY_PREFIX="v0.0.${NEXT_PATCH}-nightly.${DATE_PART}."
            LATEST_NIGHTLY_NUMBER=0
            while IFS= read -r tag; do
              suffix="${tag#${NIGHTLY_PREFIX}}"
              if [[ "$suffix" =~ ^[0-9]+$ ]] && (( 10#$suffix > LATEST_NIGHTLY_NUMBER )); then
                LATEST_NIGHTLY_NUMBER=$((10#$suffix))
              fi
            done < <(git tag --list "${NIGHTLY_PREFIX}*")
            RELEASE_TAG="${NIGHTLY_PREFIX}$((LATEST_NIGHTLY_NUMBER + 1))"
            ENVIRONMENT="production"
            PRERELEASE="true"
            LATEST="false"
          elif [[ "$GITHUB_REF_NAME" == staging-v* ]]; then
            # Staging channel: a staging-vX.Y.Z tag builds against the staging
            # environment and publishes only as a prerelease (never latest, and
            # publish-npm stays gated off for prereleases), so it can never ship
            # as a production GA or npm-latest release.
            RELEASE_TAG="$GITHUB_REF_NAME"
            ENVIRONMENT="staging"
            PRERELEASE="true"
            LATEST="false"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            NPM_VERSION="$(node -p "require('./package.json').version")"

            if [ "v${NPM_VERSION}" != "$RELEASE_TAG" ]; then
              echo "Release tag ${RELEASE_TAG} does not match package.json version ${NPM_VERSION}."
              echo "Stable releases must be created from the Release Please release PR commit."
              exit 1
            fi

            ENVIRONMENT="production"
            PRERELEASE="false"
            LATEST="auto"
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TAG}"
            echo "cli_version=${RELEASE_TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "latest=${LATEST}"
            echo "environment=${ENVIRONMENT}"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Release Check
    needs: [validate-release-ref]
    uses: ./.github/workflows/check.yml

  build-binaries:
    name: Build Binary (${{ matrix.target.id }})
    runs-on: ubuntu-latest
    needs: [check, resolve-release]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - id: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - id: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - id: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - id: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve release build environment
        env:
          CLI_VERSION: ${{ needs.resolve-release.outputs.cli_version }}
          ENVIRONMENT: ${{ needs.resolve-release.outputs.environment }}
          PRODUCTION_FIRST_PARTY_DEVICE_CLIENT_ID: ${{ vars.VOLCANO_FIRST_PARTY_DEVICE_CLIENT_ID_PRODUCTION }}
          STAGING_FIRST_PARTY_DEVICE_CLIENT_ID: ${{ vars.VOLCANO_FIRST_PARTY_DEVICE_CLIENT_ID_STAGING }}
        run: scripts/ci/resolve-cli-build-env.sh

      - name: Build binary
        run: |
          set -euo pipefail
          OUT_DIR="dist/${{ matrix.target.id }}"
          BINARY_NAME="volcano-${{ matrix.target.id }}${{ matrix.target.ext }}"
          mkdir -p "$OUT_DIR"
          CGO_ENABLED=0 \
            GOOS="${{ matrix.target.goos }}" \
            GOARCH="${{ matrix.target.goarch }}" \
            make build \
              BINARY="${OUT_DIR}/${BINARY_NAME}" \
              DEFAULT_API_URL="${CLI_DEFAULT_API_URL}" \
              DEFAULT_WEB_URL="${CLI_DEFAULT_WEB_URL}" \
              FIRST_PARTY_DEVICE_CLIENT_ID="${CLI_FIRST_PARTY_DEVICE_CLIENT_ID}" \
              VERSION="${CLI_VERSION}" \
              DATE="${BUILD_DATE}"

      - name: Smoke-test Linux binary
        if: matrix.target.id == 'linux-amd64'
        run: |
          dist/${{ matrix.target.id }}/volcano-${{ matrix.target.id }} --help
          dist/${{ matrix.target.id }}/volcano-${{ matrix.target.id }} --version

      - name: Sign binary
        run: |
          set -euo pipefail
          BINARY_PATH="dist/${{ matrix.target.id }}/volcano-${{ matrix.target.id }}${{ matrix.target.ext }}"
          BUNDLE_PATH="${BINARY_PATH}.sigstore.json"
          cosign sign-blob "$BINARY_PATH" \
            --bundle "$BUNDLE_PATH" \
            --yes
          test -s "$BUNDLE_PATH"

      - name: Upload signed binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volcano-binaries-${{ matrix.target.id }}
          path: dist/${{ matrix.target.id }}

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, resolve-release]
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.resolve-release.outputs.release_title }}
      RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
      RELEASE_LATEST: ${{ needs.resolve-release.outputs.latest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download signed binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: volcano-binaries-*
          path: _release
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          find _release -type f -name 'volcano-*' -exec cp {} dist/release-assets/ \;
          cp scripts/install-volcano.sh dist/release-assets/install.sh
          chmod +x dist/release-assets/install.sh
          bash -n dist/release-assets/install.sh

      - name: Sign installer script
        run: |
          set -euo pipefail
          cosign sign-blob "dist/release-assets/install.sh" \
            --bundle "dist/release-assets/install.sh.sigstore.json" \
            --yes
          test -s "dist/release-assets/install.sh.sigstore.json"

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist/release-assets
            shasum -a 256 * | sort -k2 > SHA256SUMS
          )

      - name: Publish release assets
        run: |
          set -euo pipefail

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            shift 3
            local flags=("$@")
            local notes_args=()

            if [ -n "$notes" ]; then
              notes_args=(--notes "$notes")
            else
              notes_args=(--generate-notes)
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              local edit_args=(--title "$title" --target "$GITHUB_SHA")
              if [ -n "$notes" ]; then
                edit_args+=(--notes "$notes")
              fi
              gh release upload "$tag" dist/release-assets/* --clobber
              gh release edit "$tag" "${edit_args[@]}" "${flags[@]}"
            else
              gh release create "$tag" dist/release-assets/* \
                --target "$GITHUB_SHA" \
                --title "$title" \
                "${notes_args[@]}" \
                "${flags[@]}"
            fi
          }

          append_historical_assets() {
            local version="$1"
            local asset
            local versioned_asset
            local base
            local assets=()

            while IFS= read -r asset; do
              assets+=("${asset##*/}")
            done < <(find dist/release-assets -maxdepth 1 -type f | sort)

            for asset in "${assets[@]}"; do
              case "$asset" in
                SHA256SUMS)
                  continue
                  ;;
                *.exe.sigstore.json)
                  base="${asset%.exe.sigstore.json}"
                  versioned_asset="${base}-${version}.exe.sigstore.json"
                  ;;
                *.sh.sigstore.json)
                  base="${asset%.sh.sigstore.json}"
                  versioned_asset="${base}-${version}.sh.sigstore.json"
                  ;;
                *.sigstore.json)
                  base="${asset%.sigstore.json}"
                  versioned_asset="${base}-${version}.sigstore.json"
                  ;;
                *.exe)
                  base="${asset%.exe}"
                  versioned_asset="${base}-${version}.exe"
                  ;;
                *.sh)
                  base="${asset%.sh}"
                  versioned_asset="${base}-${version}.sh"
                  ;;
                *)
                  versioned_asset="${asset}-${version}"
                  ;;
              esac
              cp "dist/release-assets/${asset}" "dist/release-assets/${versioned_asset}"
            done

            (
              cd dist/release-assets
              local versioned_assets=()
              while IFS= read -r asset; do
                versioned_assets+=("${asset#./}")
              done < <(find . -maxdepth 1 -type f -name "*${version}*" ! -name "SHA256SUMS-${version}" | sort)
              shasum -a 256 "${versioned_assets[@]}" > "SHA256SUMS-${version}"
            )
          }

          RELEASE_FLAGS=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if [ "$RELEASE_LATEST" = "false" ]; then
            RELEASE_FLAGS+=(--latest=false)
          fi

          RELEASE_NOTES=""
          if [[ "$GITHUB_REF_NAME" == staging-v* ]]; then
            RELEASE_NOTES="Automated staging build from ${GITHUB_SHA}."
          elif [ "$RELEASE_PRERELEASE" = "true" ]; then
            RELEASE_NOTES="Automated nightly build from ${GITHUB_SHA}."
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            NIGHTLY_ALIAS_NOTES="$(printf 'Latest nightly build: %s\n\nCommit: %s' "$RELEASE_TITLE" "$GITHUB_SHA")"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              git tag "$RELEASE_TAG" "$GITHUB_SHA"
              git push origin "refs/tags/${RELEASE_TAG}"
            fi
            append_historical_assets "$RELEASE_TAG"
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
            publish_release nightly "$RELEASE_TITLE" "$NIGHTLY_ALIAS_NOTES" --prerelease --latest=false
          elif [[ "$GITHUB_REF_NAME" == staging-v* ]]; then
            # Publish an immutable staging-vX.Y.Z release (npm @staging resolves
            # to it via scripts/npm/download.js) AND force-move a `staging` alias
            # release (the curl `staging` selector and Homebrew formula download
            # from it). Both are prerelease/--latest=false, so staging never
            # becomes the `latest` release or touches production/npm-latest.
            STAGING_ALIAS_NOTES="$(printf 'Latest staging build: %s\n\nCommit: %s' "$RELEASE_TITLE" "$GITHUB_SHA")"
            publish_release "$RELEASE_TAG" "$RELEASE_TITLE" "$RELEASE_NOTES" --prerelease --latest=false
            git tag -f staging "$GITHUB_SHA"
            git push origin refs/tags/staging --force
            publish_release staging "$RELEASE_TITLE" "$STAGING_ALIAS_NOTES" --prerelease --latest=false
          else
            publish_release "$RELEASE_TAG" "$RELEASE_TITLE" "$RELEASE_NOTES" "${RELEASE_FLAGS[@]}"
          fi

      - name: Verify uploaded Linux binary
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          DOWNLOAD_RELEASE_TAG="$RELEASE_TAG"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DOWNLOAD_RELEASE_TAG="nightly"
          fi
          gh release download "$DOWNLOAD_RELEASE_TAG" \
            --pattern "volcano-linux-amd64*" \
            --dir "$TMP_DIR"
          cosign verify-blob "$TMP_DIR/volcano-linux-amd64" \
            --bundle "$TMP_DIR/volcano-linux-amd64.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-cli.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          chmod +x "$TMP_DIR/volcano-linux-amd64"
          "$TMP_DIR/volcano-linux-amd64" --help
          "$TMP_DIR/volcano-linux-amd64" --version

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest # Trusted publishing requires GitHub-hosted runners
    needs: [resolve-release, publish-github-release]
    # Publish to npm only for stable releases (skip main/nightly prereleases).
    # This job runs npm publish directly in the release-triggered run, so npm's
    # OIDC trusted publisher must be configured with this workflow's filename
    # (publish-cli.yml). Dispatched/reusable workflows are not supported.
    if: needs.resolve-release.outputs.prerelease == 'false'
    permissions:
      contents: read
      id-token: write # REQUIRED for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1; pin to the npm 11 line for
      # reproducibility rather than tracking npm@latest across major versions.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Verify npm package version
        id: npm_version
        env:
          CLI_VERSION: ${{ needs.resolve-release.outputs.cli_version }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "$CLI_VERSION" ]; then
            echo "Refusing to publish npm version ${VERSION} for release ${CLI_VERSION}."
            echo "package.json must match the stable release tag."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify release assets exist
        env:
          VERSION: ${{ steps.npm_version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          # Ranged GET (first byte) confirms each asset is actually downloadable,
          # which is what the package's postinstall does.
          for target in linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64; do
            asset="volcano-${target}"
            if [ "$target" = "windows-amd64" ]; then
              asset="${asset}.exe"
            fi
            echo "Checking ${base}/${asset}"
            curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -r 0-0 -o /dev/null "${base}/${asset}"
          done
          echo "Checking ${base}/SHA256SUMS"
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -r 0-0 -o /dev/null "${base}/SHA256SUMS"

      # OIDC trusted publishing: npm detects the id-token and authenticates
      # automatically; provenance is generated for public repos. No NPM_TOKEN.
      # VOLCANO_SKIP_DOWNLOAD stops the postinstall fetching a binary in CI.
      # Trusted publishing is live (the package is published on npm), so a
      # publish failure is a real failure and must fail the release.
      - name: Publish to npm
        env:
          VOLCANO_SKIP_DOWNLOAD: "1"
        run: npm publish --provenance --access public

  publish-npm-staging:
    name: Publish npm staging package
    runs-on: ubuntu-latest # Trusted publishing requires GitHub-hosted runners
    needs: [resolve-release, publish-github-release]
    # Publish the staging build to npm under the `staging` dist-tag only (never
    # `latest`). Uses the same OIDC trusted publisher as publish-npm (same
    # workflow filename). Nightly (production prerelease) never reaches npm
    # because it is neither prerelease==false nor environment==staging.
    if: needs.resolve-release.outputs.environment == 'staging'
    permissions:
      contents: read
      id-token: write # REQUIRED for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Stamp staging npm version
        id: npm_version
        env:
          CLI_VERSION: ${{ needs.resolve-release.outputs.cli_version }}
        run: |
          set -euo pipefail
          # staging-vX.Y.Z -> X.Y.Z-staging (a valid semver prerelease). The
          # published package's postinstall maps this back to the immutable
          # staging-vX.Y.Z release (scripts/npm/download.js).
          BASE="${CLI_VERSION#staging-v}"
          if [ "$BASE" = "$CLI_VERSION" ]; then
            echo "Expected a staging-vX.Y.Z tag, got ${CLI_VERSION}."
            exit 1
          fi
          NPM_VERSION="${BASE}-staging"
          npm version --no-git-tag-version --allow-same-version "$NPM_VERSION"
          echo "version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify staging release assets exist
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          for target in linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64; do
            asset="volcano-${target}"
            if [ "$target" = "windows-amd64" ]; then
              asset="${asset}.exe"
            fi
            echo "Checking ${base}/${asset}"
            curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -r 0-0 -o /dev/null "${base}/${asset}"
          done
          echo "Checking ${base}/SHA256SUMS"
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -r 0-0 -o /dev/null "${base}/SHA256SUMS"

      - name: Publish staging to npm
        env:
          VOLCANO_SKIP_DOWNLOAD: "1"
        run: npm publish --provenance --access public --tag staging
