name: Publish CLI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*.*.*-nightly.*"

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Validate Release Ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            exit 0
          fi

          STABLE_SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $STABLE_SEMVER_RE ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}"
            echo "Release tags must use stable SemVer form vMAJOR.MINOR.PATCH."
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAGGED_SHA="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$TAGGED_SHA" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} points at ${TAGGED_SHA}, which is not reachable from origin/main."
            echo "CLI releases must be cut from main."
            exit 1
          fi

  resolve-release:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    needs: [validate-release-ref]
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_title: ${{ steps.release.outputs.release_title }}
      cli_version: ${{ steps.release.outputs.cli_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DATE_PART="$(date -u +%Y%m%d)"
            # Base the nightly on the current stable version (package.json, kept
            # in sync by release-please) and bump the patch, so the nightly
            # sorts above the latest stable but below the next release, e.g.
            # stable 0.16.0 -> v0.16.1-nightly.<date>.<seq>. Deriving from
            # package.json instead of a `v0.0.*` tag glob is what keeps this
            # tracking the real release line (the old glob froze nightlies at
            # v0.0.6 once stable moved past the 0.0.x series).
            BASE_VERSION="$(node -p "require('./package.json').version")"
            BASE_VERSION="${BASE_VERSION%%-*}"
            # Validate the whole version string before splitting, so a malformed
            # value (wrong component count, leading zeroes, non-numeric) fails
            # closed instead of being silently reshaped into a bad tag. Mirrors
            # validate-release-ref's STABLE_SEMVER_RE numeric components (line
            # 34), which also keeps the patch bump off a bad octal literal (08).
            if ! printf '%s' "$BASE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "package.json version '${BASE_VERSION}' is not X.Y.Z; cannot derive nightly version."
              exit 1
            fi
            BASE_MAJOR="${BASE_VERSION%%.*}"
            BASE_MINOR_PATCH="${BASE_VERSION#*.}"
            BASE_MINOR="${BASE_MINOR_PATCH%%.*}"
            BASE_PATCH="${BASE_MINOR_PATCH#*.}"
            NEXT_PATCH=$(( BASE_PATCH + 1 ))
            NIGHTLY_PREFIX="v${BASE_MAJOR}.${BASE_MINOR}.${NEXT_PATCH}-nightly.${DATE_PART}."
            LATEST_NIGHTLY_NUMBER=0
            while IFS= read -r tag; do
              suffix="${tag#${NIGHTLY_PREFIX}}"
              if [[ "$suffix" =~ ^[0-9]+$ ]] && (( 10#$suffix > LATEST_NIGHTLY_NUMBER )); then
                LATEST_NIGHTLY_NUMBER=$((10#$suffix))
              fi
            done < <(git tag --list "${NIGHTLY_PREFIX}*")
            RELEASE_TAG="${NIGHTLY_PREFIX}$((LATEST_NIGHTLY_NUMBER + 1))"
            PRERELEASE="true"
            LATEST="false"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            NPM_VERSION="$(node -p "require('./package.json').version")"

            if [ "v${NPM_VERSION}" != "$RELEASE_TAG" ]; then
              echo "Release tag ${RELEASE_TAG} does not match package.json version ${NPM_VERSION}."
              echo "Stable releases must be created from the Release Please release PR commit."
              exit 1
            fi

            PRERELEASE="false"
            LATEST="auto"
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TAG}"
            echo "cli_version=${RELEASE_TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Release Check
    needs: [validate-release-ref]
    uses: ./.github/workflows/check.yml

  build-binaries:
    name: Build Binary (${{ matrix.target.id }})
    runs-on: ubuntu-latest
    needs: [check, resolve-release]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - id: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - id: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - id: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - id: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve release build environment
        env:
          CLI_VERSION: ${{ needs.resolve-release.outputs.cli_version }}
          PRODUCTION_FIRST_PARTY_DEVICE_CLIENT_ID: ${{ vars.VOLCANO_FIRST_PARTY_DEVICE_CLIENT_ID_PRODUCTION }}
          # ponytail: every release path builds against staging during the testing phase, so all builds consume the staging client ID; drop this line and restore the production blocks in resolve-cli-build-env.sh before GA
          STAGING_FIRST_PARTY_DEVICE_CLIENT_ID: ${{ vars.VOLCANO_FIRST_PARTY_DEVICE_CLIENT_ID_STAGING }}
        run: scripts/ci/resolve-cli-build-env.sh

      - name: Build binary
        run: |
          set -euo pipefail
          OUT_DIR="dist/${{ matrix.target.id }}"
          BINARY_NAME="volcano-${{ matrix.target.id }}${{ matrix.target.ext }}"
          mkdir -p "$OUT_DIR"
          CGO_ENABLED=0 \
            GOOS="${{ matrix.target.goos }}" \
            GOARCH="${{ matrix.target.goarch }}" \
            make build \
              BINARY="${OUT_DIR}/${BINARY_NAME}" \
              DEFAULT_API_URL="${CLI_DEFAULT_API_URL}" \
              DEFAULT_WEB_URL="${CLI_DEFAULT_WEB_URL}" \
              DEFAULT_LOCAL_IMAGE="${CLI_DEFAULT_LOCAL_IMAGE}" \
              FIRST_PARTY_DEVICE_CLIENT_ID="${CLI_FIRST_PARTY_DEVICE_CLIENT_ID}" \
              VERSION="${CLI_VERSION}" \
              DATE="${BUILD_DATE}"

      - name: Smoke-test Linux binary
        if: matrix.target.id == 'linux-amd64'
        run: |
          dist/${{ matrix.target.id }}/volcano-${{ matrix.target.id }} --help
          dist/${{ matrix.target.id }}/volcano-${{ matrix.target.id }} --version

      - name: Sign binary
        run: |
          set -euo pipefail
          BINARY_PATH="dist/${{ matrix.target.id }}/volcano-${{ matrix.target.id }}${{ matrix.target.ext }}"
          BUNDLE_PATH="${BINARY_PATH}.sigstore.json"
          cosign sign-blob "$BINARY_PATH" \
            --bundle "$BUNDLE_PATH" \
            --yes
          test -s "$BUNDLE_PATH"

      - name: Upload signed binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volcano-binaries-${{ matrix.target.id }}
          path: dist/${{ matrix.target.id }}

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, resolve-release]
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.resolve-release.outputs.release_title }}
      RELEASE_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
      RELEASE_LATEST: ${{ needs.resolve-release.outputs.latest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download signed binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: volcano-binaries-*
          path: _release
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          find _release -type f -name 'volcano-*' -exec cp {} dist/release-assets/ \;
          cp scripts/install-volcano.sh dist/release-assets/install.sh
          chmod +x dist/release-assets/install.sh
          bash -n dist/release-assets/install.sh

      - name: Sign installer script
        run: |
          set -euo pipefail
          cosign sign-blob "dist/release-assets/install.sh" \
            --bundle "dist/release-assets/install.sh.sigstore.json" \
            --yes
          test -s "dist/release-assets/install.sh.sigstore.json"

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist/release-assets
            shasum -a 256 * | sort -k2 > SHA256SUMS
          )

      - name: Publish release assets
        run: |
          set -euo pipefail

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            shift 3
            local flags=("$@")
            local notes_args=()

            if [ -n "$notes" ]; then
              notes_args=(--notes "$notes")
            else
              notes_args=(--generate-notes)
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              local edit_args=(--title "$title" --target "$GITHUB_SHA")
              if [ -n "$notes" ]; then
                edit_args+=(--notes "$notes")
              fi
              gh release upload "$tag" dist/release-assets/* --clobber
              gh release edit "$tag" "${edit_args[@]}" "${flags[@]}"
            else
              gh release create "$tag" dist/release-assets/* \
                --target "$GITHUB_SHA" \
                --title "$title" \
                "${notes_args[@]}" \
                "${flags[@]}"
            fi
          }

          RELEASE_FLAGS=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if [ "$RELEASE_LATEST" = "false" ]; then
            RELEASE_FLAGS+=(--latest=false)
          fi

          RELEASE_NOTES=""
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            RELEASE_NOTES="Automated nightly build from ${GITHUB_SHA}."
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            NIGHTLY_ALIAS_NOTES="$(printf 'Latest nightly build: %s\n\nCommit: %s' "$RELEASE_TITLE" "$GITHUB_SHA")"
            # Keep the versioned nightly git tag (resolve-release derives the next
            # nightly number from it); it needs no release of its own.
            if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              git tag "$RELEASE_TAG" "$GITHUB_SHA"
              git push origin "refs/tags/${RELEASE_TAG}"
            fi
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
            # The `nightly` release is a rolling alias for the latest nightly only.
            # Recreate it from scratch each run so it holds just the current build's
            # assets: appending every build's assets grows it unbounded and hits
            # GitHub's hard cap of 1000 assets per release (HTTP 422 file_count
            # limited to 1000). Deleting first also self-heals an already-full release.
            # Only delete when it exists, and let a real delete failure stop the job
            # (don't blanket-swallow, or the backlog would silently persist).
            if gh release view nightly >/dev/null 2>&1; then
              gh release delete nightly --yes
            fi
            publish_release nightly "$RELEASE_TITLE" "$NIGHTLY_ALIAS_NOTES" --prerelease --latest=false
          else
            publish_release "$RELEASE_TAG" "$RELEASE_TITLE" "$RELEASE_NOTES" "${RELEASE_FLAGS[@]}"
          fi

      - name: Verify uploaded Linux binary
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          DOWNLOAD_RELEASE_TAG="$RELEASE_TAG"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            DOWNLOAD_RELEASE_TAG="nightly"
          fi
          gh release download "$DOWNLOAD_RELEASE_TAG" \
            --pattern "volcano-linux-amd64*" \
            --dir "$TMP_DIR"
          cosign verify-blob "$TMP_DIR/volcano-linux-amd64" \
            --bundle "$TMP_DIR/volcano-linux-amd64.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-cli.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          chmod +x "$TMP_DIR/volcano-linux-amd64"
          "$TMP_DIR/volcano-linux-amd64" --help
          "$TMP_DIR/volcano-linux-amd64" --version

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest # Trusted publishing requires GitHub-hosted runners
    needs: [resolve-release, publish-github-release]
    # Publish to npm only for stable releases (skip main/nightly prereleases).
    # This job runs npm publish directly in the release-triggered run, so npm's
    # OIDC trusted publisher must be configured with this workflow's filename
    # (publish-cli.yml). Dispatched/reusable workflows are not supported.
    if: needs.resolve-release.outputs.prerelease == 'false'
    permissions:
      contents: read
      id-token: write # REQUIRED for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1; pin to the npm 11 line for
      # reproducibility rather than tracking npm@latest across major versions.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Verify npm package version
        id: npm_version
        env:
          CLI_VERSION: ${{ needs.resolve-release.outputs.cli_version }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "$CLI_VERSION" ]; then
            echo "Refusing to publish npm version ${VERSION} for release ${CLI_VERSION}."
            echo "package.json must match the stable release tag."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify release assets exist
        env:
          VERSION: ${{ steps.npm_version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          # Ranged GET (first byte) confirms each asset is actually downloadable,
          # which is what the package's postinstall does.
          for target in linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64; do
            asset="volcano-${target}"
            if [ "$target" = "windows-amd64" ]; then
              asset="${asset}.exe"
            fi
            echo "Checking ${base}/${asset}"
            curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -r 0-0 -o /dev/null "${base}/${asset}"
          done
          echo "Checking ${base}/SHA256SUMS"
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors -r 0-0 -o /dev/null "${base}/SHA256SUMS"

      # OIDC trusted publishing: npm detects the id-token and authenticates
      # automatically; provenance is generated for public repos. No NPM_TOKEN.
      # VOLCANO_SKIP_DOWNLOAD stops the postinstall fetching a binary in CI.
      # Trusted publishing is live (the package is published on npm), so a
      # publish failure is a real failure and must fail the release.
      - name: Publish to npm
        env:
          VOLCANO_SKIP_DOWNLOAD: "1"
        run: npm publish --provenance --access public

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [resolve-release, publish-github-release]
    # Stable releases only; nightly/main builds never touch the tap.
    if: needs.resolve-release.outputs.prerelease == 'false'
    # Serialize across ALL release tags (the workflow-level concurrency key is
    # per-ref, so two tags can otherwise reach this job at once and race their
    # direct pushes to the tap). One tap update at a time, never cancelled.
    concurrency:
      group: update-homebrew-tap
      cancel-in-progress: false
    steps:
      # Mint a short-lived token scoped to Kong/homebrew-volcano. Reuses the
      # same App as release-please.yml (VOLCANO_APP_ID/VOLCANO_APP_KEY); the App
      # must be installed on Kong/homebrew-volcano with Contents: write.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.VOLCANO_APP_ID }}
          private-key: ${{ secrets.VOLCANO_APP_KEY }}
          owner: Kong
          repositories: homebrew-volcano
          permission-contents: write

      - name: Check out tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Kong/homebrew-volcano
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Regenerate formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          # Never downgrade the tap. A re-run of an older release (or an
          # out-of-order run) would otherwise silently regress Homebrew to an
          # old version — the exact staleness this job exists to prevent. Skip
          # when the target is older than the tap's current version; allow an
          # equal version through so a re-run can repair checksums.
          CURRENT="$(awk -F'"' '/^  version /{print $2; exit}' tap/Formula/volcano.rb || true)"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$VERSION" ]; then
            NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)"
            if [ "$NEWEST" != "$VERSION" ]; then
              echo "Tap is at ${CURRENT}; release ${VERSION} is older. Skipping to avoid a downgrade."
              exit 0
            fi
          fi

          # SHA256SUMS is an asset on the release publish-github-release just cut,
          # so the four platform checksums are already computed; no re-download
          # of the binaries needed.
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir . --clobber

          sha() { awk -v f="$1" '$2==f {print $1}' SHA256SUMS; }
          MAC_ARM="$(sha volcano-macos-arm64)"
          MAC_AMD="$(sha volcano-macos-amd64)"
          LNX_ARM="$(sha volcano-linux-arm64)"
          LNX_AMD="$(sha volcano-linux-amd64)"
          # Fail closed: a missing checksum means a malformed release, not a
          # formula we should half-write.
          for v in "$MAC_ARM" "$MAC_AMD" "$LNX_ARM" "$LNX_AMD"; do
            [ -n "$v" ] || { echo "missing checksum in SHA256SUMS"; exit 1; }
          done

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          # The formula is fully determined by version + the four checksums, so
          # template the whole file rather than sed-patching four url/sha256
          # blocks (which is why `brew bump-formula-pr` — single-url only — does
          # not fit this multi-platform binary formula).
          cat > tap/Formula/volcano.rb <<EOF
          class Volcano < Formula
            desc "CLI for Volcano's hosting platform"
            homepage "https://github.com/Kong/volcano-cli"
            version "${VERSION}"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              on_arm do
                url "${base}/volcano-macos-arm64"
                sha256 "${MAC_ARM}"
              end

              on_intel do
                url "${base}/volcano-macos-amd64"
                sha256 "${MAC_AMD}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/volcano-linux-arm64"
                sha256 "${LNX_ARM}"
              end

              on_intel do
                url "${base}/volcano-linux-amd64"
                sha256 "${LNX_AMD}"
              end
            end

            def install
              bin.install Dir["volcano-*"].first => "volcano"
              chmod 0755, bin/"volcano"
            end

            test do
              system bin/"volcano", "--help"
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula already up to date for ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name  "kong-volcano-app[bot]"
          git config user.email "kong-volcano-app[bot]@users.noreply.github.com"
          git commit -am "chore: bump volcano to ${RELEASE_TAG}"
          # The push can lose a non-fast-forward race to an unrelated commit
          # landing on the tap between checkout and here (the concurrency group
          # only serializes this job, not external writers). Rebase and retry;
          # our change only touches Formula/volcano.rb, so a doc/unrelated
          # commit rebases cleanly. Final push outside the loop lets a
          # persistent failure surface non-zero.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}); rebasing on latest tap HEAD"
            git pull --rebase origin main
          done
          git push
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
