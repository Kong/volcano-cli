name: AI Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  ai-review:
    uses: Kong/volcano-actions/.github/workflows/ai-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_CI_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_CI_API_KEY }}
