name: CLI Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make openapi-generated-check
      - run: make lint
      - run: make test
      - run: go build ./...
      - run: make build FIRST_PARTY_DEVICE_CLIENT_ID=volcano-cli
      - name: Smoke-test binary
        run: |
          ./volcano --help
          ./volcano --version

  localmode-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify local-mode image exists
        run: |
          set -euo pipefail
          docker manifest inspect kong/volcano:local-nightly >/dev/null
      - name: Run local-mode CLI contract smoke
        env:
          VOLCANO_IMAGE: kong/volcano:local-nightly
        run: make localmode-e2e
