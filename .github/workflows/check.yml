name: CLI Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - run: make test
      - run: go build ./...
      - run: make build FIRST_PARTY_DEVICE_CLIENT_ID=volcano-cli
      - name: Smoke-test binary
        run: |
          ./volcano --help
          ./volcano --version

  localmode-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run local-mode CLI contract smoke
        env:
          # Keep CI pinned to the last published local-compatible image until
          # volcano-hosting publishes kong/volcano:local-nightly.
          VOLCANO_IMAGE: kong/volcano:nightly@sha256:1c57519c86ac156fcc7a6464c9eb6a6812795d8d438306d2a89efe486e523399
        run: make localmode-e2e
