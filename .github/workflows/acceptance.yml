name: Installed binary acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Build candidate binaries
        run: |
          set -euo pipefail
          mkdir candidate
          version="$(jq -er .version package.json)"
          for target in linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64; do
            os="${target%-*}"
            arch="${target#*-}"
            suffix=''
            if [[ "$os" == macos ]]; then os=darwin; fi
            if [[ "$os" == windows ]]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" make build BINARY="candidate/volcano-$target$suffix" VERSION="v$version"
          done
          candidate/volcano-linux-amd64 --version
      - name: Verify external-binary acceptance entry points
        env:
          VOLCANO_TEST_CLI_BINARY: ${{ github.workspace }}/candidate/volcano-linux-amd64
        run: go test ./tests/e2e/... -run 'Test(APIE2EUsesSuppliedBinary|APIE2ECommandUsesExplicitAPI|LocalModeUsesSuppliedBinary|Resolve)$'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-acceptance
          path: candidate/*
          if-no-files-found: error

  attest:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-acceptance
          path: candidate
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: candidate/*
